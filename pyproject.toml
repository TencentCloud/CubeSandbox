[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.backends.legacy:build"

[project]
name = "cubesandbox"
version = "0.1.0"
description = "Python SDK for CubeSandbox"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "Apache-2.0" }
dependencies = [
    "httpx>=0.27",
    "requests>=2.28",
]

[project.optional-dependencies]
dev = ["pytest>=7", "pytest-mock", "ruff", "mypy"]

[tool.setuptools.packages.find]
where = ["."]
include = ["cubesandbox*"]

[tool.ruff]
line-length = 100
target-version = "py39"

[tool.mypy]
python_version = "3.9"
strict = true
