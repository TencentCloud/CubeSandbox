[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.backends.legacy:build"

[project]
name = "cube-e2b-code-interpreter"
version = "0.1.0"
description = "CubeSandbox SDK — drop-in replacement for e2b_code_interpreter"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "Apache-2.0" }
dependencies = [
    "requests>=2.28",
    "httpx>=0.27",
    "websockets>=12.0",
]

[project.optional-dependencies]
dev = ["pytest", "pytest-mock", "black", "ruff"]

[tool.setuptools.packages.find]
where = ["."]
include = ["cube_e2b*"]
