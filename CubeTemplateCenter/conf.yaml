common:
  http_port: 8090
  http_readtimeout: 120
  http_writetimeout: 360
  http_idletimeout: 360
  sync_meta_data_interval: 30s
  sync_metric_data_interval: 1s
  collect_metric_interval: 1s
  # CubeMaster's HTTP base URL, used by TC to report build results. Can be set
  # here (persistent, per-deployment) or overridden by CUBE_MASTER_ADDR env
  # (env wins). Defaults to http://127.0.0.1:8089 if both are empty.
  # master_addr: "http://127.0.0.1:8089"

log:
  module: "templatecenter"
  path: "/data/log/CubeTemplateCenter"
  file_size: 100
  file_num: 10
  level: "info"

instance_db_config:
  addr: "127.0.0.1:3306"
  user: "cube"
  pwd: "cube_pass"
  db_name: "cube_mvp"
  conn_timeout: 5
  read_timeout: 5
  write_timeout: 5
  max_idle_conns: 5
  max_open_conns: 20
  max_conn_life_time_seconds: 300

redis:
  nodes: "127.0.0.1:6379"
  password: "ceuhvu123"
  db_no: 0
  max_idle: 8
  max_active: 32
  idle_timeout: 30
  max_retry: 2

auth:
  enable: false
