name: Terraform Deployer Validate

on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - 'deploy/one-click/terraform/**'
      # The deployer also depends on the release-bundle builder and the
      # component Dockerfile/package contexts it assembles. Changes there can
      # break bundle layout or image builds, so validate them too (the
      # package-layout dry run below covers the wiring).
      - 'deploy/one-click/build-release-bundle.sh'
      - 'deploy/one-click/build-release-bundle-builder.sh'
      - 'deploy/one-click/install.sh'
      - 'deploy/one-click/down.sh'
      - 'deploy/one-click/env.example'
      - 'deploy/one-click/lib/**'
      - 'deploy/one-click/tests/**'
      - 'deploy/one-click/observability/**'
      - 'CubeObservability/Dockerfile'
      - 'CubeObservability/grafana/dashboards/**'
      - 'docs/guide/observability.md'
      - 'docs/zh/guide/observability.md'
      - 'deploy/one-click/CubeAPI/**'
      - 'deploy/one-click/CubeMaster/**'
      - 'deploy/scripts/docker-install-volume-deps.sh'
      - 'deploy/one-click/webui/**'
      - 'deploy/one-click/cubeproxy/**'
      - 'CubeProxy/Dockerfile'
      # bump-image.sh is the single source of truth for the hard-coded image
      # tags this deployer bakes in; test_bump_image.sh guards it.
      - 'scripts/bump-image.sh'
      - '.github/workflows/terraform-validate.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: terraform-validate-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: fmt + validate + shellcheck (${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-latest
          - arch: arm64
            runner: ubuntu-24.04-arm
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          # Pin to the same version create.sh installs (ensure_terraform's
          # TERRAFORM_VERSION) so `fmt -check` / `validate` in CI match what users
          # actually run, instead of floating to the latest release.
          terraform_version: 1.15.6
          terraform_wrapper: false

      - name: Install shellcheck
        shell: bash
        run: sudo apt-get update && sudo apt-get install -y shellcheck

      - name: Validate the Tencent Cloud deployer
        shell: bash
        working-directory: deploy/one-click/terraform/tencentcloud
        # REQUIRE_TOOLS=1: terraform + shellcheck are installed above, so a
        # missing tool here means a broken setup step and must fail the build
        # rather than silently skip its checks.
        run: REQUIRE_TOOLS=1 ./validate.sh

      # Cloud-free one-click test suite (deploy/one-click/tests/test_*.sh).
      # Every script is self-contained and needs no docker/cloud; terraform and
      # shellcheck are installed above and python3 ships with the runner. Loop so
      # new test_*.sh are picked up automatically instead of drifting out of CI.
      - name: One-click deployer tests
        shell: bash
        run: |
          shopt -s nullglob
          status=0
          tests=(deploy/one-click/tests/test_*.sh)
          if [ "${#tests[@]}" -eq 0 ]; then
            echo "::error::no deploy/one-click/tests/test_*.sh found"
            exit 1
          fi
          for t in "${tests[@]}"; do
            echo "::group::${t}"
            if bash "${t}"; then
              echo "::endgroup::"
            else
              echo "::endgroup::"
              echo "::error file=${t}::${t} failed"
              status=1
            fi
          done
          exit "${status}"

      - name: Observability static checks
        shell: bash
        run: |
          set -euo pipefail
          bash -n \
            deploy/one-click/observability/install.sh \
            deploy/one-click/observability/otelcol/install.sh \
            deploy/one-click/observability/prometheus/install.sh \
            deploy/one-click/observability/loki/install.sh \
            deploy/one-click/observability/elasticsearch/install.sh \
            deploy/one-click/observability/grafana/install.sh
          for dashboard in CubeObservability/grafana/dashboards/*.json; do
            python3 -m json.tool "${dashboard}" >/dev/null
          done
          cmp \
            CubeObservability/grafana/dashboards/cubesandbox-host-sandbox.json \
            deploy/kubernetes/chart/files/cube-observability/grafana/dashboards/cubesandbox-host-sandbox.json
          cmp \
            CubeObservability/grafana/dashboards/cubesandbox-logs.json \
            deploy/kubernetes/chart/files/cube-observability/grafana/dashboards/cubesandbox-logs.json
          cmp \
            CubeObservability/grafana/dashboards/cubesandbox-logs-elasticsearch.json \
            deploy/kubernetes/chart/files/cube-observability/grafana/dashboards/cubesandbox-logs-elasticsearch.json

      - name: Validate generated OTel Collector configs
        shell: bash
        run: |
          set -euo pipefail
          tmp="$(mktemp -d)"
          trap 'rm -rf "${tmp}"' EXIT
          common=(
            CUBE_OBSERVABILITY_CLUSTER_ID=ci
            CUBE_METRICS_OTLP_HTTP_ENDPOINT=http://prometheus:9092/api/v1/otlp
            CUBE_METRICS_AUTHORIZATION="Bearer ci-metrics-token"
            CUBE_METRICS_TENANT_ID=ci
          )
          env "${common[@]}" \
            CUBE_LOGS_OTLP_HTTP_ENDPOINT=http://loki:3100/otlp \
            CUBE_LOGS_AUTHORIZATION="Bearer ci-logs-token" \
            CUBE_LOGS_TENANT_ID=ci \
            CUBE_OTEL_CONFIG_OUTPUT="${tmp}/systemd-loki.yaml" \
            bash deploy/one-click/observability/otelcol/install.sh render
          env "${common[@]}" \
            CUBE_LOGS_ES_ENDPOINT=http://elasticsearch:9200 \
            CUBE_LOGS_ES_API_KEY=ci-api-key \
            CUBE_OTEL_CONFIG_OUTPUT="${tmp}/systemd-es.yaml" \
            bash deploy/one-click/observability/otelcol/install.sh render
          for config in "${tmp}"/*.yaml; do
            docker run --rm \
              -e CUBE_METRICS_BACKEND_URL=http://prometheus:9092/api/v1/otlp \
              -e CUBE_METRICS_AUTHORIZATION="Bearer ci-metrics-token" \
              -e CUBE_METRICS_TENANT_ID=ci \
              -e CUBE_LOGS_BACKEND_URL=http://loki:3100/otlp \
              -e CUBE_LOGS_AUTHORIZATION="Bearer ci-logs-token" \
              -e CUBE_LOGS_TENANT_ID=ci \
              -e CUBE_LOGS_ES_API_KEY=ci-api-key \
              -e NODE_NAME=ci-node \
              -v "${tmp}:/work:ro" \
              otel/opentelemetry-collector-contrib:0.162.0 \
              validate --config="file:/work/$(basename "${config}")"
          done
