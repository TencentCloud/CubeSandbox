name: Claude Auto Review

on:
  # IMPORTANT: pull_request_target makes secrets available to fork PRs.
  # SECURITY RULE: never add steps that EXECUTE code from the PR
  # (no npm install / make / cargo build / pre-commit / etc.).
  #
  # Design (aligned with claude-code-action security intent):
  # - Checkout base only (trusted root).
  # - Prefetch PR meta/diff in a trusted workflow step (not inside Claude Bash).
  # - Claude only Reads inputs + base tree, posts inline via MCP, writes sticky
  #   body to review-input/summary.md.
  # - A trusted post-step verifies scripts/gh.sh SHA-256 then publishes via it.
  #
  # Note: track_progress is intentionally NOT used — tag mode checks out the PR
  # head into the workspace root (including forks via refs/pull/*/head), which
  # reintroduces untrusted code at the trusted root.
  # See: https://github.com/anthropics/claude-code-action/blob/main/docs/security.md
  pull_request_target:
    types: [opened, synchronize, reopened]

concurrency:
  group: claude-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: write

jobs:
  review:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout base (trusted root)
        uses: actions/checkout@v6
        with:
          # Default ref for pull_request_target is the base branch.
          # Do NOT checkout the PR head into the workspace root.
          persist-credentials: false
          submodules: false
          lfs: false

      - name: Generate GitHub App token
        id: app-token
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ secrets.CLAUDE_APP_ID }}
          private-key: ${{ secrets.CLAUDE_APP_PRIVATE_KEY }}
          permission-contents: read
          permission-pull-requests: write

      - name: Prefetch PR review inputs
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail
          # Snapshot the trusted publisher script hash outside the workspace so
          # a later Write cannot replace the expected digest.
          sha256sum scripts/gh.sh > "${RUNNER_TEMP}/gh.sh.sha256"
          mkdir -p review-input
          gh pr view "$PR_NUMBER" \
            --json title,body,author,baseRefName,headRefName,headRefOid,files,additions,deletions \
            > review-input/meta.json
          # GitHub refuses diffs above 20 000 lines with HTTP 406, so a large PR
          # would never reach review at all. Rebuild the diff from git objects
          # instead: fetch the PR head and its merge base (objects only --
          # nothing is checked out, so the trusted workspace stays clean) and
          # restrict the diff to the files this PR touches.
          #
          # The merge base is resolved through the compare API rather than
          # diffing against the base tip directly. The base tip is not the fork
          # point, so a two-dot diff against it would also replay the base
          # branch's own commits as if the PR had reverted them.
          FILELIST_TRUNCATED=0
          if ! gh pr diff "$PR_NUMBER" > review-input/pr.diff.tmp 2>review-input/pr.diff.err; then
            echo "gh pr diff failed; rebuilding the diff from git objects instead:" >&2
            cat review-input/pr.diff.err >&2

            # One JSON object per changed file: include previous_filename so
            # renames keep both sides and are not rendered as whole-file
            # additions. Project only those two fields so the files endpoint
            # does not also hand back every file's `patch`, which is the payload
            # this fallback exists to avoid; one object per line keeps the entry
            # count exact and a filename with a newline in it on one line.
            # 100 per page rather than the endpoint's default of 30, so a
            # capped list costs 30 requests instead of 100. The query string is
            # part of the path because `gh api -F` would switch the request to
            # POST and 404.
            if ! gh api --paginate \
                 "repos/${GITHUB_REPOSITORY}/pulls/${PR_NUMBER}/files?per_page=100" \
                 --jq '.[] | {filename, previous_filename}' \
                 > review-input/pr.files.json; then
              echo "failed to list the PR's files; cannot rebuild the diff" >&2
              exit 1
            fi
            PR_FILE_ENTRIES=$(grep -c '^{' review-input/pr.files.json || true)
            # NUL-delimited pathspecs, so a newline in a filename cannot split
            # it into two paths the way a line-based list would, and
            # :(top,literal) keeps it from being read as a glob.
            jq -j '. | ":(top,literal)\(.filename)\u0000",
                     (select(.previous_filename != null) |
                      ":(top,literal)\(.previous_filename)\u0000")' \
              review-input/pr.files.json > review-input/pr.pathspecs
            mapfile -t -d '' PR_FILES < review-input/pr.pathspecs
            if [ "${#PR_FILES[@]}" -eq 0 ]; then
              echo "PR files list is empty; cannot rebuild the diff" >&2
              exit 1
            fi
            # The endpoint stops at 3000 entries, so a list at the cap may be
            # partial, and a partial diff must not reach the reviewer as if it
            # were the whole change. Default to the cap: a test that cannot be
            # evaluated only makes an `if` false, it does not abort under
            # `set -e`, so an unknown count has to warn rather than pass.
            if [ "${PR_FILE_ENTRIES:-3000}" -ge 3000 ]; then
              FILELIST_TRUNCATED=1
            fi

            git fetch --no-tags --depth=1 origin "refs/pull/${PR_NUMBER}/head"
            pr_head="$(git rev-parse FETCH_HEAD)"
            # The event payload is frozen in the run that triggered it and a
            # re-run replays it, so its base.sha can be older than the fork
            # point the file list above was computed against. Read the live base
            # instead.
            live_base="$(gh api \
              "repos/${GITHUB_REPOSITORY}/pulls/${PR_NUMBER}" --jq '.base.sha')"
            pr_base="$(gh api \
              "repos/${GITHUB_REPOSITORY}/compare/${live_base}...${pr_head}" \
              --jq '.merge_base_commit.sha')"
            git fetch --no-tags --depth=1 origin "${pr_base}"

            git diff --no-color --no-ext-diff --no-textconv \
              "${pr_base}" "${pr_head}" \
              -- "${PR_FILES[@]}" > review-input/pr.diff.tmp
            # git diff exits 0 with no output when nothing matched, and the file
            # list was read one API call before the head was resolved, so a push
            # landing in between can leave the pathspecs describing a revision
            # that is no longer the one fetched. An empty rebuild must not be
            # installed and reviewed behind a green check.
            if [ ! -s review-input/pr.diff.tmp ]; then
              echo "rebuilt diff is empty for ${#PR_FILES[@]} paths; refusing to review nothing" >&2
              exit 1
            fi
          fi
          # The redirect above creates pr.diff.err on the success path too, and
          # only the failure path reads it.
          rm -f review-input/pr.diff.err
          MAX_BYTES=2000000
          SIZE=$(wc -c < review-input/pr.diff.tmp)
          if [ "$SIZE" -gt "$MAX_BYTES" ]; then
            head -c "$MAX_BYTES" review-input/pr.diff.tmp > review-input/pr.diff
            printf '\n\n... [TRUNCATED: diff was %s bytes, showing first %s] ...\n' \
              "$SIZE" "$MAX_BYTES" >> review-input/pr.diff
            echo truncated > review-input/TRUNCATED
            rm -f review-input/pr.diff.tmp
          else
            mv review-input/pr.diff.tmp review-input/pr.diff
          fi
          if [ "$FILELIST_TRUNCATED" -eq 1 ]; then
            printf '\n... [WARNING: the file list reached the files API cap of 3000 entries; this diff may be partial] ...\n' \
              >> review-input/pr.diff
            echo filelist-truncated >> review-input/TRUNCATED
          fi

      - name: Run Claude review
        uses: anthropics/claude-code-action@v1
        env:
          ANTHROPIC_BASE_URL: https://tokenhub.tencentmaas.com
          ANTHROPIC_MODEL: deepseek/deepseek-v4-flash
          ANTHROPIC_SMALL_FAST_MODEL: deepseek/deepseek-v4-flash
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          github_token: ${{ steps.app-token.outputs.token }}
          allowed_non_write_users: "*"
          show_full_output: false
          classify_inline_comments: true
          prompt: |
            REPO: ${{ github.repository }}
            PR NUMBER: ${{ github.event.pull_request.number }}

            Review this pull request using ONLY the prefetched inputs and the
            local base-branch workspace.

            Required reading (do this first):
            1. review-input/meta.json
            2. review-input/pr.diff
            If review-input/TRUNCATED exists, note that the diff was truncated.

            The workspace is the base branch. For surrounding context, Read files
            from the base tree that appear in the diff. Do not assume PR head
            files are checked out.

            Publishing rules:
            - Inline issues: mcp__github_inline_comment__create_inline_comment
              (set confirmed: true for final review comments).
            - Top-level sticky body: Write exactly one file at
              review-input/summary.md containing the full markdown review body
              wrapped with these markers:
              <!-- cubesandbox-auto-review:start -->
              ...review body...
              <!-- cubesandbox-auto-review:end -->
            - Mark the review as AI-generated; do not claim human approval.
            - Do not use Bash. Do not call gh. Do not write any other files.
          claude_args: |
            --allowedTools "Read,Glob,Grep,Write,mcp__github_inline_comment__create_inline_comment"
            --disallowedTools "Bash,Edit,NotebookEdit,Agent,WebFetch,WebSearch"

      - name: Publish sticky review comment
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail
          if [ ! -f review-input/summary.md ]; then
            echo "ERROR: Claude did not write review-input/summary.md; failing so a green CI cannot hide a missing review."
            exit 1
          fi
          if ! grep -q '<!-- cubesandbox-auto-review:start -->' review-input/summary.md || \
             ! grep -q '<!-- cubesandbox-auto-review:end -->' review-input/summary.md; then
            echo "ERROR: review-input/summary.md is missing required sticky markers."
            exit 1
          fi
          # Refuse to run a publisher script that Write may have overwritten.
          if ! sha256sum -c "${RUNNER_TEMP}/gh.sh.sha256"; then
            echo "ERROR: scripts/gh.sh integrity check failed; refusing to publish."
            exit 1
          fi
          ./scripts/gh.sh pr review-comment "$PR_NUMBER" --body-file - < review-input/summary.md
