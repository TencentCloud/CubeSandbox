name: Kubernetes Chart Check

on:
  push:
    branches: [master]
    paths:
      - 'Cubelet/Dockerfile'
      - 'deploy/kubernetes/chart/**'
      - 'CubeObservability/**'
      - 'deploy/kubernetes/images/scripts/**'
      - 'scripts/bump-image.sh'
      - '.github/workflows/kubernetes-chart-check.yml'
  pull_request:
    paths:
      - 'Cubelet/Dockerfile'
      - 'deploy/kubernetes/chart/**'
      - 'CubeObservability/**'
      - 'deploy/kubernetes/images/scripts/**'
      - 'scripts/bump-image.sh'
      - '.github/workflows/kubernetes-chart-check.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  chart:
    name: chart (${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-latest
          - arch: arm64
            runner: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v6
      - uses: azure/setup-helm@v4
      - name: Lint and render chart
        run: |
          helm lint deploy/kubernetes/chart \
            --set-string mysql.password=test \
            --set-string mysql.rootPassword=test \
            --set-string redis.password=test
          helm template chart-check deploy/kubernetes/chart \
            --set-string mysql.password=test \
            --set-string mysql.rootPassword=test \
            --set-string redis.password=test >/dev/null
      - name: Render observability combinations
        shell: bash
        run: |
          set -euo pipefail
          chart=deploy/kubernetes/chart
          common=(
            --set observability.enabled=true
            --set-string mysql.password=test
            --set-string mysql.rootPassword=test
            --set-string redis.password=test
          )
          for backend in loki elasticsearch; do
            helm lint "${chart}" "${common[@]}" \
              --set "observability.logs.backend=${backend}"
            helm template "observability-${backend}" "${chart}" "${common[@]}" \
              --set "observability.logs.backend=${backend}" \
              -s templates/observability.yaml >/dev/null
          done
          helm template observability-external-loki "${chart}" "${common[@]}" \
            --set observability.backend.enabled=false \
            --set observability.metrics.otlpEndpoint=http://prometheus.example/api/v1/otlp \
            --set observability.logs.backend=loki \
            --set observability.logs.otlpEndpoint=http://loki.example/otlp \
            -s templates/observability.yaml >/dev/null
          helm template observability-external-es "${chart}" "${common[@]}" \
            --set observability.backend.enabled=false \
            --set observability.metrics.remoteWriteUrl=http://prometheus.example/api/v1/write \
            --set observability.logs.backend=elasticsearch \
            --set observability.logs.esEndpoint=http://elasticsearch.example:9200 \
            -s templates/observability.yaml >/dev/null
          helm template observability-metrics-only "${chart}" "${common[@]}" \
            --set observability.logs.enabled=false \
            -s templates/observability.yaml >/dev/null
          auth_render="$(mktemp)"
          trap 'rm -f "${auth_render}"' EXIT
          helm template observability-auth "${chart}" "${common[@]}" \
            --set observability.logs.backend=loki \
            --set observability.metrics.auth.existingSecret=observability-auth \
            --set observability.metrics.auth.tenantIdKey=metrics-tenant \
            --set observability.logs.auth.existingSecret=observability-auth \
            --set observability.logs.auth.tenantIdKey=logs-tenant \
            --set observability.backend.grafana.existingSecret=grafana-admin \
            -s templates/observability.yaml >"${auth_render}"
          grep -q 'CUBE_METRICS_AUTHORIZATION' "${auth_render}"
          grep -q 'CUBE_LOGS_AUTHORIZATION' "${auth_render}"
          grep -q 'checksum/grafana-admin-secret' "${auth_render}"
          helm template observability-ephemeral "${chart}" "${common[@]}" \
            --set observability.backend.prometheus.persistence.enabled=false \
            --set observability.backend.loki.persistence.enabled=false \
            --set observability.backend.grafana.persistence.enabled=false \
            -s templates/observability.yaml >/dev/null
          helm template observability-existing-claims "${chart}" "${common[@]}" \
            --set observability.backend.prometheus.persistence.existingClaim=prometheus-data \
            --set observability.backend.loki.persistence.existingClaim=loki-data \
            --set observability.backend.grafana.persistence.existingClaim=grafana-data \
            -s templates/observability.yaml >/dev/null
          if helm template observability-invalid "${chart}" "${common[@]}" \
            --set observability.logs.backend=loki \
            --set observability.logs.esEndpoint=http://elasticsearch.example:9200 \
            -s templates/observability.yaml >/dev/null 2>&1; then
            echo "::error::conflicting Loki/Elasticsearch settings were accepted"
            exit 1
          fi
          if helm template observability-invalid-host-network "${chart}" "${common[@]}" \
            --set cubeNode.hostNetwork=false \
            -s templates/observability.yaml >/dev/null 2>&1; then
            echo "::error::loopback Cubelet metrics target was accepted with cubeNode.hostNetwork=false"
            exit 1
          fi
      - name: Check observability dashboards
        shell: bash
        run: |
          set -euo pipefail
          for dashboard in deploy/kubernetes/chart/files/cube-observability/grafana/dashboards/*.json; do
            python3 -m json.tool "${dashboard}" >/dev/null
          done
          for dashboard in cubesandbox-cluster.json cubesandbox-node.json cubesandbox-sandbox.json cubesandbox-logs.json cubesandbox-logs-elasticsearch.json; do
            cmp \
              "CubeObservability/grafana/dashboards/${dashboard}" \
              "deploy/kubernetes/chart/files/cube-observability/grafana/dashboards/${dashboard}"
          done
          python3 CubeObservability/grafana/generate_dashboards.py --check
          python3 CubeObservability/grafana/test_dashboards.py
      - name: Validate Helm Collector configs
        shell: bash
        run: |
          set -euo pipefail
          tmp="$(mktemp -d)"
          trap 'rm -rf "${tmp}"' EXIT
          common=(
            --set observability.enabled=true
            --set observability.logs.components.enabled=true
            --set-string mysql.password=test
            --set-string mysql.rootPassword=test
            --set-string redis.password=test
          )
          for backend in loki elasticsearch; do
            helm template "validate-${backend}" deploy/kubernetes/chart "${common[@]}" \
              --set "observability.logs.backend=${backend}" \
              -s templates/observability.yaml > "${tmp}/${backend}-rendered.yaml"
          done
          helm template validate-external deploy/kubernetes/chart "${common[@]}" \
            --set observability.backend.enabled=false \
            --set observability.metrics.remoteWriteUrl=http://prometheus.example/api/v1/write \
            --set observability.logs.otlpEndpoint=http://loki.example/otlp \
            --set observability.metrics.auth.existingSecret=ci-auth \
            --set observability.logs.auth.existingSecret=ci-auth \
            -s templates/observability.yaml > "${tmp}/external-rendered.yaml"
          python3 -c 'import pathlib,re,sys; root=pathlib.Path(sys.argv[1]); configs=[(p.stem,doc) for p in root.glob("*-rendered.yaml") for doc in p.read_text().split("---") if "  otelcol.yaml: |\n" in doc]; assert len(configs)==6, "expected node and component configs for three combinations"; [(root/(name+"-"+re.search(r"^  name: (.+)$",doc,re.M)[1]+"-config.yaml")).write_text("\n".join(line[4:] if line.startswith("    ") else line for line in doc.split("  otelcol.yaml: |\n",1)[1].splitlines())+"\n") for name,doc in configs]' "${tmp}"
          chmod 0755 "${tmp}"
          chmod 0644 "${tmp}"/*-config.yaml
          for config in "${tmp}"/*-config.yaml; do
            docker run --rm \
              -e CUBE_NODE_NAME=ci-node \
              -e POD_IP=127.0.0.1 \
              -e CUBE_METRICS_AUTHORIZATION="Bearer ci-metrics-token" \
              -e CUBE_LOGS_AUTHORIZATION="Bearer ci-logs-token" \
              -v "${tmp}:/work:ro" \
              otel/opentelemetry-collector-contrib:0.162.0 \
              validate --config="file:/work/$(basename "${config}")"
          done
      - name: Check startup-gate shell syntax
        run: |
          sh -n deploy/kubernetes/images/scripts/node-prep-lib.sh
          sh -n deploy/kubernetes/images/scripts/cube-node-init.sh
          sh -n deploy/kubernetes/images/scripts/pvm-startup-gate-lib.sh
          sh -n deploy/kubernetes/images/scripts/pvm-startup-gate-reconcile.sh
          sh -n deploy/kubernetes/images/scripts/pvm-host-bootstrap.sh
          sh -n deploy/kubernetes/images/scripts/wait-node-prep.sh
          sh -n deploy/kubernetes/chart/files/cube-proxy/cube-proxy-entrypoint.sh
          bash -n deploy/kubernetes/images/scripts/cube-s3lvol-entrypoint.sh
          bash -n deploy/kubernetes/chart/files/cube-node-hostnet-preflight.sh
          bash -n deploy/kubernetes/chart/files/cubevs-cidr-preflight.sh
      # Cloud-free chart/image guard suite (deploy/kubernetes/*/scripts/
      # test-*.sh). Helm is installed above; every script is self-contained.
      # Loop so new test-*.sh are picked up automatically instead of drifting
      # out of CI. Run each under bash (a POSIX-sh superset): the suite mixes
      # #!/bin/sh and #!/usr/bin/env bash scripts, and on ubuntu-latest sh is
      # dash, which would choke on the bash-only ones (arrays, [[ ]], local).
      - name: Kubernetes test suite
        shell: bash
        run: |
          shopt -s nullglob
          status=0
          tests=(deploy/kubernetes/*/scripts/test-*.sh)
          if [ "${#tests[@]}" -eq 0 ]; then
            echo "::error::no deploy/kubernetes/*/scripts/test-*.sh found"
            exit 1
          fi
          for t in "${tests[@]}"; do
            echo "::group::${t}"
            if bash "${t}"; then
              echo "::endgroup::"
            else
              echo "::endgroup::"
              echo "::error file=${t}::${t} failed"
              status=1
            fi
          done
          exit "${status}"
