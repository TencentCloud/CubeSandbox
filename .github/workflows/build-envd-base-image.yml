name: Build envd Base Image

on:
  push:
    branches: [master]
    paths:
      - 'docker/Dockerfile.cube-base'
      - 'docker/cube-entrypoint.sh'
      - 'cube-envd/**'
      - '.github/workflows/build-envd-base-image.yml'
  pull_request:
    paths:
      - 'docker/Dockerfile.cube-base'
      - 'docker/cube-entrypoint.sh'
      - 'cube-envd/**'
      - '.github/workflows/build-envd-base-image.yml'
  workflow_dispatch:

env:
  IMAGE_NAME: ghcr.io/tencentcloud/cubesandbox-base
  BASE_OS_TAG_SUFFIX: ubuntu22.04

concurrency:
  group: build-envd-base-image-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build ${{ matrix.arch }} base image
    runs-on: ${{ matrix.runner }}
    # 版本只在这里计算一次（读 cube-envd/src/version.rs），publish_manifest 复用该输出，
    # 避免两处各自派生同一取值而漂移。
    outputs:
      envd_version: ${{ steps.envd.outputs.envd_version }}
      envd_commit: ${{ steps.envd.outputs.envd_commit }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            platform: linux/amd64
            runner: ubuntu-latest
          - arch: arm64
            platform: linux/arm64
            runner: ubuntu-24.04-arm
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        if: github.repository == 'TencentCloud/CubeSandbox' && github.ref == 'refs/heads/master'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute envd build identifiers
        id: envd
        run: |
          set -euo pipefail
          # 版本唯一事实源是 cube-envd/src/version.rs 的 semver 常量（与上游 e2b envd 的
          # packages/envd/pkg/version.go 同构）。这里只读取，不派生：下游
          # （Cubelet/CubeMaster）按 \d+\.\d+\.\d+ 提取该值写入模板/快照注解，并作为公开
          # SDK 字段 envdVersion 暴露，sha 之类的构建标识会被直接丢弃。
          version="$(sed -n 's/.*CUBE_ENVD_VERSION: &str = "\([^"]*\)".*/\1/p' cube-envd/src/version.rs | head -1)"
          if [[ ! "${version}" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::cube-envd/src/version.rs does not hold a semver (got '${version}')"
            exit 1
          fi
          echo "envd_version=${version}" >> "${GITHUB_OUTPUT}"
          echo "envd_commit=${GITHUB_SHA}" >> "${GITHUB_OUTPUT}"

      - name: Extract image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE_NAME }}
          labels: |
            io.cubesandbox.envd.version=${{ steps.envd.outputs.envd_version }}
            io.cubesandbox.envd.commit=${{ steps.envd.outputs.envd_commit }}

      - name: Prepare image tags
        id: image_tags
        env:
          ARCH: ${{ matrix.arch }}
          ENVD_VERSION: ${{ steps.envd.outputs.envd_version }}
          IS_RELEASE_PUSH: ${{ github.repository == 'TencentCloud/CubeSandbox' && github.ref == 'refs/heads/master' }}
        run: |
          short_sha="${GITHUB_SHA::7}"
          {
            echo "tags<<EOF"
            echo "${IMAGE_NAME}:sha-${short_sha}-${ARCH}"
            if [[ "${IS_RELEASE_PUSH}" == "true" ]]; then
              echo "${IMAGE_NAME}:latest-${ARCH}"
              echo "${IMAGE_NAME}:${ENVD_VERSION}-${BASE_OS_TAG_SUFFIX}-${ARCH}"
            fi
            echo "EOF"
          } >> "${GITHUB_OUTPUT}"

      - name: Build image (load locally for smoke test)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile.cube-base
          platforms: ${{ matrix.platform }}
          push: false
          load: true
          tags: cubesandbox-base:ci-smoke
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            CUBE_ENVD_VERSION=${{ steps.envd.outputs.envd_version }}
            CUBE_ENVD_COMMIT=${{ steps.envd.outputs.envd_commit }}
          cache-from: type=gha,scope=cube-base-${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=cube-base-${{ matrix.arch }}

      - name: Smoke test envd /health
        run: |
          set -euo pipefail
          cid="$(docker run -d --rm cubesandbox-base:ci-smoke)"
          trap 'docker rm -f "${cid}" >/dev/null 2>&1 || true' EXIT

          ok=""
          for attempt in {1..10}; do
            code="$(docker exec "${cid}" curl -s -o /dev/null -w "%{http_code}" \
                http://127.0.0.1:49983/health || true)"
            echo "attempt ${attempt}: envd /health => ${code}"
            if [ "${code}" = "204" ]; then
              ok="yes"
              break
            fi
            sleep 1
          done

          if [ -z "${ok}" ]; then
            echo "envd /health probe never returned 204" >&2
            docker exec "${cid}" cat /var/log/envd.log >&2 || true
            exit 1
          fi

          echo "envd inside container:"
          docker exec "${cid}" /usr/bin/envd -version
          docker exec "${cid}" /usr/bin/envd -commit

      - name: Push per-arch image
        if: github.repository == 'TencentCloud/CubeSandbox' && github.ref == 'refs/heads/master'
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile.cube-base
          platforms: ${{ matrix.platform }}
          push: true
          # Plain per-arch manifests so publish_manifest can combine them.
          # Attestations add unknown/unknown entries that break imagetools create.
          provenance: false
          tags: ${{ steps.image_tags.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            CUBE_ENVD_VERSION=${{ steps.envd.outputs.envd_version }}
            CUBE_ENVD_COMMIT=${{ steps.envd.outputs.envd_commit }}
          cache-from: type=gha,scope=cube-base-${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=cube-base-${{ matrix.arch }}

  publish_manifest:
    name: Publish multi-arch base manifests
    if: github.repository == 'TencentCloud/CubeSandbox' && github.ref == 'refs/heads/master'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Create multi-arch manifests
        env:
          # 复用 build 任务读到的版本，避免此处再次派生同一取值。
          ENVD_VERSION: ${{ needs.build.outputs.envd_version }}
        run: |
          set -euo pipefail
          short_sha="${GITHUB_SHA::7}"
          docker buildx imagetools create \
            -t "${IMAGE_NAME}:latest" \
            -t "${IMAGE_NAME}:${ENVD_VERSION}-${BASE_OS_TAG_SUFFIX}" \
            -t "${IMAGE_NAME}:sha-${short_sha}" \
            "${IMAGE_NAME}:sha-${short_sha}-amd64" \
            "${IMAGE_NAME}:sha-${short_sha}-arm64"
