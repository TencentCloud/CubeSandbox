name: MiMo Code Integration Check

on:
  push:
    branches: [master]
    paths:
      - 'examples/mimo-code-integration/**'
      - '.github/workflows/mimo-code-integration-check.yml'
  pull_request:
    paths:
      - 'examples/mimo-code-integration/**'
      - '.github/workflows/mimo-code-integration-check.yml'
  workflow_dispatch:

concurrency:
  group: mimo-code-integration-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  offline:
    name: Offline tests and syntax
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: pip
          cache-dependency-path: examples/mimo-code-integration/requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install \
            -r examples/mimo-code-integration/requirements.txt

      - name: Run unit tests
        run: |
          python -m unittest discover \
            -s examples/mimo-code-integration/tests \
            -v

      - name: Check Python and shell syntax
        run: |
          python -m py_compile \
            examples/mimo-code-integration/*.py \
            examples/mimo-code-integration/tests/*.py \
            examples/mimo-code-integration/fixtures/normalize-slug/project/*.py \
            examples/mimo-code-integration/fixtures/normalize-slug/project/tests/*.py
          bash -n \
            examples/mimo-code-integration/build-template.sh \
            examples/mimo-code-integration/collect_e2e_evidence.sh
