name: CubeS3lvol Test

on:
  push:
    branches: [master]
    paths:
      - 'CubeS3lvol/**'
      - 'deploy/one-click/scripts/logrotate/**'
      - '.github/workflows/cube-s3lvol-test.yml'
  pull_request:
    paths:
      - 'CubeS3lvol/**'
      - 'deploy/one-click/scripts/logrotate/**'
      - '.github/workflows/cube-s3lvol-test.yml'
  workflow_dispatch:

concurrency:
  group: cube-s3lvol-test-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: read

env:
  BUILDER_IMAGE: ghcr.io/tencentcloud/cubesandbox-builder:ubuntu2004

jobs:
  test:
    name: CubeS3lvol offline tests
    # Build and test run inside the published builder image, which carries
    # prebuilt SPDK/AWS CRT under /opt/s3lvol-*. The runner only needs Docker.
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Log in to GitHub Container Registry
        id: ghcr_login
        continue-on-error: true
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Warn about GHCR login failure
        if: steps.ghcr_login.outcome == 'failure'
        run: echo "::warning::GHCR login failed - will attempt pull as anonymous"

      # Always use the published builder. Do not docker-build Dockerfile.builder
      # here: a local rebuild hits apt.llvm.org and is what the builder-image
      # workflow already publishes after merge to master.
      - name: Pull builder image
        run: docker pull "${BUILDER_IMAGE}"

      # The real-logrotate rotation tests skip without logrotate. Until the
      # published builder carries it (Dockerfile.builder installs it), add a
      # thin local layer from the Ubuntu archive. FROM keeps the s3lvol stamp
      # labels, so `make builder-image` still reuses the image. Fail rather
      # than let those tests skip silently.
      - name: Ensure logrotate in builder image
        run: |
          if docker run --rm --entrypoint /bin/sh "${BUILDER_IMAGE}" -c 'command -v logrotate' >/dev/null; then
            echo "builder image already provides logrotate"
          else
            printf 'FROM %s\nRUN apt-get update && apt-get install -y --no-install-recommends logrotate && rm -rf /var/lib/apt/lists/*\n' \
              "${BUILDER_IMAGE}" | docker build -t "${BUILDER_IMAGE}" -
            docker run --rm --entrypoint /bin/sh "${BUILDER_IMAGE}" -c 'command -v logrotate && logrotate --version 2>&1 | head -1'
          fi

      # setup_dep.sh reuses /opt/s3lvol-* from the published builder when stamps
      # match; a pin/patch change on this PR falls back to deps/ once, and the
      # next published builder after merge carries the new prebuilt.
      #
      # cube-s3lvol-test runs check-rules + debug make + check-offline inside
      # the builder. /data is a tmpfs; DPDK EAL tests need --privileged.
      - name: Build and test in builder
        run: make cube-s3lvol-test BUILDER_IMAGE="${BUILDER_IMAGE}"
