apiVersion: apps/v1
kind: Deployment
metadata:
  name: eviction-webhook
  namespace: cube-system
  labels:
    app: eviction-webhook
spec:
  replicas: 1
  selector:
    matchLabels:
      app: eviction-webhook
  template:
    metadata:
      labels:
        app: eviction-webhook
    spec:
      serviceAccountName: eviction-webhook
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        fsGroup: 65532
      containers:
      - name: eviction-webhook
        image: ccr.ccs.tencentyun.com/cube/eviction-webhook:latest
        ports:
        - containerPort: 8443
          name: https
        env:
        - name: CUBE_MASTER_URL
          value: "http://cube-master.cube-system.svc:8089"
        - name: CUBE_AUTH_ENABLE
          value: "true"
        - name: EVENT_REPORT_ENABLE
          value: "false"
        - name: CUBE_AUTH_USER_ID
          valueFrom:
            secretKeyRef:
              name: eviction-webhook-auth
              key: user_id
        - name: CUBE_AUTH_SECRET_KEY
          valueFrom:
            secretKeyRef:
              name: eviction-webhook-auth
              key: secret_key
        - name: TLS_CERT_FILE
          value: /etc/eviction-webhook/tls/tls.crt
        - name: TLS_KEY_FILE
          value: /etc/eviction-webhook/tls/tls.key
        - name: AUDIT_LOG_PATH
          value: /var/log/eviction-webhook/events.ndjson
        - name: RECOVERY_STATE_PATH
          value: /var/lib/eviction-webhook/recovery-state.json
        volumeMounts:
        - name: tls
          mountPath: /etc/eviction-webhook/tls
          readOnly: true
        - name: audit-log
          mountPath: /var/log/eviction-webhook
        - name: recovery-state
          mountPath: /var/lib/eviction-webhook
        livenessProbe:
          httpGet:
            path: /healthz
            port: 8443
            scheme: HTTPS
          initialDelaySeconds: 5
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /healthz
            port: 8443
            scheme: HTTPS
          initialDelaySeconds: 3
          periodSeconds: 5
        resources:
          requests:
            cpu: 50m
            memory: 64Mi
          limits:
            cpu: 200m
            memory: 256Mi
      volumes:
      - name: tls
        secret:
          secretName: eviction-webhook-tls
      - name: audit-log
        emptyDir: {}
      - name: recovery-state
        persistentVolumeClaim:
          claimName: eviction-webhook-state
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: eviction-webhook-state
  namespace: cube-system
spec:
  accessModes:
  - ReadWriteOnce
  resources:
    requests:
      storage: 1Gi
---
apiVersion: v1
kind: Service
metadata:
  name: eviction-webhook
  namespace: cube-system
spec:
  selector:
    app: eviction-webhook
  ports:
  - port: 443
    targetPort: 8443
    name: https
