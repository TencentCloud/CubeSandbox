apiVersion: v1
kind: ServiceAccount
metadata:
  name: eviction-webhook
  namespace: cube-system
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: eviction-webhook
rules:
- apiGroups: [""]
  resources: ["pods", "nodes"]
  verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: eviction-webhook
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: eviction-webhook
subjects:
- kind: ServiceAccount
  name: eviction-webhook
  namespace: cube-system
