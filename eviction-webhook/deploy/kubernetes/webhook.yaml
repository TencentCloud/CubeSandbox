apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingWebhookConfiguration
metadata:
  name: eviction-webhook
  annotations:
    # cert-manager injects caBundle automatically from the Certificate above.
    cert-manager.io/inject-ca-from: cube-system/eviction-webhook-tls
webhooks:
- name: eviction.cube.tencent.com
  admissionReviewVersions: ["v1"]
  sideEffects: None
  timeoutSeconds: 5
  # Fail open: if the webhook is unavailable the eviction proceeds normally.
  # This prevents a webhook outage from blocking cluster-wide eviction entirely.
  failurePolicy: Ignore
  rules:
  - apiGroups:   ["policy", ""]
    apiVersions: ["v1"]
    resources:   ["pods/eviction"]
    operations:  ["CREATE", "DELETE"]
  objectSelector:
    matchExpressions:
    - key: cube.master.instance.type
      operator: Exists
  clientConfig:
    service:
      name:      eviction-webhook
      namespace: cube-system
      path:      /webhook/eviction
      port:      443
