# Ruff configuration for mysql-sandbox example
# See https://docs.astral.sh/ruff/configuration/

line-length = 100
target-version = "py38"

[lint]
select = [
    "E",     # pycodestyle errors
    "W",     # pycodestyle warnings
    "F",     # Pyflakes
    "I",     # isort
    "B",     # flake8-bugbear
    "C4",    # flake8-comprehensions
    "UP",    # pyupgrade
]
ignore = [
    "E501",  # line too long (handled by formatter)
    "B008",  # do not perform function calls in argument defaults
    "C901",  # too complex
]

[lint.isort]
known-first-party = ["env_utils"]

[format]
quote-style = "double"
indent-style = "space"
