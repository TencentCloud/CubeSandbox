openapi: "3.0.3"

info:
  title: cube_e2b SDK
  description: |
    cube_e2b_code_interpreter 接口规格。
    功能兼容 cube-api，新增客户端侧 DNS 绕过能力（CUBE_PROXY_NODE_IP），
    使任意远程机器无需 CoreDNS / mkcert 即可访问 sandbox 数据流。

    ## 架构说明

    ```
    客户端机器（如 <YOUR_BUILD_HOST>）
        │
        ├─ cube-api:3000  ──── 沙箱生命周期（本文档 paths）
        │     直连 IP:3000，无需 DNS
        │
        └─ CubeProxy:80   ──── 数据流（x-envd-stream 扩展）
              官方方式: *.cube.app ──CoreDNS──▶ 127.0.0.1（仅本机）
              本 SDK:   TCP 直连 CUBE_PROXY_NODE_IP:80
                        Host 头保留 49999-{id}.cube.app（CubeProxy 路由依据）
    ```

    ## DNS 绕过环境变量

    | 变量 | 必填 | 默认 | 说明 |
    |------|:----:|------|------|
    | CUBE_API_URL | ✅ | http://127.0.0.1:3000 | cube-api 地址 |
    | CUBE_TEMPLATE_ID | ✅ | — | 模板 ID |
    | CUBE_PROXY_NODE_IP | 远程必填 | — | CubeProxy IP，绕过 DNS |
    | E2B_API_KEY | ❌ 无需 | dummy | cube-api 不鉴权，可忽略 |
    | CUBE_PROXY_PORT_HTTP | — | 80 | CubeProxy 对外 HTTP 端口（nginx 内部 listen 8081，对外暴露 80） |
    | CUBE_SANDBOX_DOMAIN | — | cube.app | sandbox 域名后缀 |

  version: "1.0.0"

servers:
  - url: "http://{cubeApiHost}:3000"
    description: cube-api（沙箱生命周期，对应 CUBE_API_URL）
    variables:
      cubeApiHost:
        default: "127.0.0.1"
        description: "cube-api 所在机器 IP"

tags:
  - name: health
    description: 健康检查
  - name: sandboxes-v1
    description: 沙箱管理 v1
  - name: sandboxes-v2
    description: 沙箱管理 v2（支持过滤）

paths:

  /health:
    get:
      summary: Health check
      description: 健康检查，无需鉴权
      operationId: getHealth
      tags: [health]
      responses:
        "200":
          description: 服务正常
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthResponse"
              example:
                status: "ok"
                sandboxes: 0

  /sandboxes:
    get:
      summary: List all sandboxes (v1)
      description: 列出所有运行中的 sandbox（v1，返回全量列表）
      operationId: listSandboxes
      tags: [sandboxes-v1]
      security:
        - ApiKeyAuth: []
      responses:
        "200":
          description: sandbox 列表
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/SandboxDetail"

    post:
      summary: Create a sandbox
      description: |
        创建新的 sandbox 实例。
        返回 sandboxID 和 domain，SDK 据此构造数据流地址：
        `http://{JUPYTER_PORT}-{sandboxID}.{domain}/execute`

        **数据流 DNS 绕过**（SDK 自动处理）：
        - 未设置 `CUBE_PROXY_NODE_IP`：OS 解析 `*.cube.app`（仅限部署机本机）
        - 已设置 `CUBE_PROXY_NODE_IP`：TCP 直连该 IP，Host 头保留虚拟域名
      operationId: createSandbox
      tags: [sandboxes-v1]
      security:
        - ApiKeyAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateSandboxRequest"
            example:
              templateID: "tpl-6265796cee124256b4dcd6a1"
              timeout: 300
      responses:
        "200":
          description: 创建成功
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SandboxCreated"
              example:
                templateID: "tpl-6265796cee124256b4dcd6a1"
                sandboxID: "7b93392513d84b7eb2f5b8da26717b77"
                clientID: "bdb40b5b-4777-488e-961a-68de8083ff41"
                envdVersion: "0.2.0"
                domain: "cube.app"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/ServerError"

  /v2/sandboxes:
    get:
      summary: List sandboxes (v2)
      description: |
        列出 sandbox（v2），支持 state / metadata 过滤和 limit 分页。
        响应结构与 v1 相同。
      operationId: listSandboxesV2
      tags: [sandboxes-v2]
      security:
        - ApiKeyAuth: []
      parameters:
        - name: state
          in: query
          required: false
          description: 按状态过滤
          schema:
            type: string
            enum: [running, paused, stopped]
          example: running
        - name: limit
          in: query
          required: false
          description: 最多返回条数
          schema:
            type: integer
            minimum: 1
          example: 10
        - name: metadata
          in: query
          required: false
          description: 按 metadata key=value 过滤（可多次传）
          schema:
            type: string
          example: "cube.product=cubebox"
      responses:
        "200":
          description: sandbox 列表（过滤后）
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/SandboxDetail"

  /sandboxes/{sandboxID}:
    get:
      summary: Get single sandbox details
      operationId: getSandbox
      tags: [sandboxes-v1]
      security:
        - ApiKeyAuth: []
      parameters:
        - $ref: "#/components/parameters/sandboxID"
      responses:
        "200":
          description: sandbox 详情
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SandboxDetail"
              example:
                templateID: "tpl-6265796cee124256b4dcd6a1"
                sandboxID: "7b93392513d84b7eb2f5b8da26717b77"
                clientID: "7b93392513d84b7eb2f5b8da26717b77"
                startedAt: "2026-04-26T10:59:24.813Z"
                endAt: "2026-04-26T10:59:24.813Z"
                state: "running"
                cpuCount: 2
                memoryMB: 2000
                diskSizeMB: 0
                envdVersion: "0.2.0"
                domain: "cube.app"
        "404":
          $ref: "#/components/responses/NotFound"

    delete:
      summary: Destroy a sandbox
      operationId: deleteSandbox
      tags: [sandboxes-v1]
      security:
        - ApiKeyAuth: []
      parameters:
        - $ref: "#/components/parameters/sandboxID"
      responses:
        "200":
          description: 销毁成功（空响应体）
        "204":
          description: 销毁成功（空响应体）
        "404":
          $ref: "#/components/responses/NotFound"

  /sandboxes/{sandboxID}/pause:
    post:
      summary: Pause a sandbox
      description: 暂停 sandbox，保留内存快照，可通过 resume 或 connect 恢复
      operationId: pauseSandbox
      tags: [sandboxes-v1]
      security:
        - ApiKeyAuth: []
      parameters:
        - $ref: "#/components/parameters/sandboxID"
      responses:
        "200":
          description: 暂停成功（空响应体）
        "404":
          $ref: "#/components/responses/NotFound"

  /sandboxes/{sandboxID}/resume:
    post:
      summary: Resume a sandbox (deprecated)
      description: |
        恢复已暂停的 sandbox。
        **已废弃**，建议使用 `/sandboxes/{sandboxID}/connect`（自动处理 resume 逻辑）。
      operationId: resumeSandbox
      deprecated: true
      tags: [sandboxes-v1]
      security:
        - ApiKeyAuth: []
      parameters:
        - $ref: "#/components/parameters/sandboxID"
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                timeout:
                  type: integer
                  description: 恢复后的 TTL（秒）
                  default: 300
            example:
              timeout: 300
      responses:
        "200":
          description: 恢复成功，返回 sandbox 信息
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SandboxCreated"
        "201":
          description: 恢复成功（Created），返回 sandbox 信息
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SandboxCreated"
        "404":
          $ref: "#/components/responses/NotFound"

  /sandboxes/{sandboxID}/connect:
    post:
      summary: Connect to a sandbox
      description: |
        连接到 sandbox（自动 resume 已暂停的 sandbox，替代 resume 接口）。
        返回格式与 createSandbox 相同，SDK 可直接用返回的 sandboxID/domain 构造数据流 URL。
      operationId: connectSandbox
      tags: [sandboxes-v1]
      security:
        - ApiKeyAuth: []
      parameters:
        - $ref: "#/components/parameters/sandboxID"
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                timeout:
                  type: integer
                  description: 连接后的 TTL（秒）
                  default: 300
            example:
              timeout: 300
      responses:
        "200":
          description: 连接成功，返回 sandbox 信息
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SandboxCreated"
              example:
                templateID: "tpl-6265796cee124256b4dcd6a1"
                sandboxID: "bf37c581decd478aae85a641afd8d14f"
                clientID: "bf37c581decd478aae85a641afd8d14f"
                envdVersion: "0.2.0"
                domain: "cube.app"
        "404":
          $ref: "#/components/responses/NotFound"

# ── 数据流（envd，通过 CubeProxy，不走 cube-api）─────────────────────────
# URL 格式：http://49999-{sandboxID}.{domain}/execute
# SDK 实现：IPOverrideTransport 将 TCP 目标替换为 CUBE_PROXY_NODE_IP:80
#           HTTP Host 头保留原始虚拟主机名（CubeProxy 路由依据）
x-envd-stream:
  execute:
    method: POST
    urlTemplate: "http://{JUPYTER_PORT}-{sandboxID}.{domain}/execute"
    jupyterPort: 49999
    description: |
      在 sandbox 内执行代码，ndjson 流式返回结果。
      客户端 DNS 绕过逻辑（IPOverrideTransport）：
        TCP 连接目标 → CUBE_PROXY_NODE_IP:CUBE_PROXY_PORT_HTTP
        HTTP Host 头 → {JUPYTER_PORT}-{sandboxID}.{domain}（不变）
    requestBody:
      schema: ExecuteRequest
    response:
      contentType: application/x-ndjson
      events:
        - type: stdout        # print() 输出
        - type: stderr        # 错误输出
        - type: result        # 表达式返回值（is_main_result=true 为 cell 最终值）
        - type: error         # 执行异常
        - type: number_of_executions  # 执行计数

components:

  securitySchemes:
    ApiKeyAuth:
      type: apiKey
      in: header
      name: X-API-Key
      description: |
        cube-api 本地部署不做鉴权，不传或传任意字符串均可正常请求。
        SDK 默认填 "dummy"，无需设置 E2B_API_KEY 环境变量。
        仅为兼容原版 e2b_code_interpreter 的鉴权字段保留。

  parameters:
    sandboxID:
      name: sandboxID
      in: path
      required: true
      description: sandbox 唯一 ID
      schema:
        type: string
        example: "7b93392513d84b7eb2f5b8da26717b77"

  responses:
    NotFound:
      description: 资源不存在
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
          example:
            code: 404
            message: "sandbox not found"
    ServerError:
      description: 服务内部错误
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"

  schemas:

    HealthResponse:
      type: object
      properties:
        status:
          type: string
          enum: [ok, error]
          example: ok
        sandboxes:
          type: integer
          description: 当前运行中的 sandbox 数量
          example: 1

    CreateSandboxRequest:
      type: object
      required: [templateID]
      properties:
        templateID:
          type: string
          description: 模板 ID（cubemastercli tpl create 得到）
          example: "tpl-6265796cee124256b4dcd6a1"
        timeout:
          type: integer
          description: sandbox TTL（秒）
          default: 300
          example: 300
        envVars:
          type: object
          additionalProperties:
            type: string
          description: 注入到 sandbox 的环境变量
          nullable: true
        metadata:
          type: object
          additionalProperties:
            type: string
          description: 自定义元数据
          nullable: true

    SandboxCreated:
      type: object
      description: createSandbox / connectSandbox 成功响应
      required: [templateID, sandboxID, domain]
      properties:
        templateID:
          type: string
        sandboxID:
          type: string
          description: sandbox 唯一 ID，用于构造数据流 URL
        clientID:
          type: string
        envdVersion:
          type: string
          example: "0.2.0"
        domain:
          type: string
          description: sandbox 域名后缀
          example: "cube.app"

    SandboxDetail:
      type: object
      properties:
        templateID:
          type: string
        sandboxID:
          type: string
        clientID:
          type: string
        startedAt:
          type: string
          format: date-time
        endAt:
          type: string
          format: date-time
        state:
          type: string
          enum: [running, paused, stopped]
        cpuCount:
          type: integer
        memoryMB:
          type: integer
        diskSizeMB:
          type: integer
        envdVersion:
          type: string
        domain:
          type: string
          example: "cube.app"
        metadata:
          type: object
          additionalProperties:
            type: string

    ExecuteRequest:
      type: object
      required: [code]
      description: 发送到 envd /execute 端点的请求体
      properties:
        code:
          type: string
          description: 要执行的 Python 代码
          example: "x = 1 + 1; x"
        context_id:
          type: string
          nullable: true
          description: kernel context ID，同一 context 内变量持久共享
        language:
          type: string
          nullable: true
          default: python
        env_vars:
          type: object
          nullable: true
          additionalProperties:
            type: string

    StreamEventStdout:
      type: object
      required: [type, text]
      properties:
        type:      { type: string, enum: [stdout] }
        text:      { type: string, example: "hello\n" }
        timestamp: { type: string, format: date-time }

    StreamEventStderr:
      type: object
      required: [type, text]
      properties:
        type:      { type: string, enum: [stderr] }
        text:      { type: string }
        timestamp: { type: string, format: date-time }

    StreamEventResult:
      type: object
      required: [type]
      properties:
        type:           { type: string, enum: [result] }
        text:           { type: string, example: "2", nullable: true }
        is_main_result: { type: boolean, description: "true = cell 最终返回值" }
        html:           { type: string, nullable: true }
        markdown:       { type: string, nullable: true }
        svg:            { type: string, nullable: true }
        png:            { type: string, nullable: true, description: base64 }
        jpeg:           { type: string, nullable: true, description: base64 }
        pdf:            { type: string, nullable: true }
        latex:          { type: string, nullable: true }
        json:           { type: object, nullable: true }
        javascript:     { type: string, nullable: true }
        extra:          { type: object, nullable: true }

    StreamEventError:
      type: object
      required: [type, name, value]
      properties:
        type:      { type: string, enum: [error] }
        name:      { type: string, example: "ZeroDivisionError" }
        value:     { type: string, example: "division by zero" }
        traceback: { type: array, items: { type: string } }

    StreamEventExecutionCount:
      type: object
      required: [type, execution_count]
      properties:
        type:            { type: string, enum: [number_of_executions] }
        execution_count: { type: integer, example: 3 }

    ErrorResponse:
      type: object
      properties:
        code:    { type: integer }
        message: { type: string }
