[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "cubesandbox"
description = "Python SDK for CubeSandbox"
readme = "README.md"
license = { text = "Apache-2.0" }
requires-python = ">=3.9"
authors = [
    { name = "Tencent CubeSandbox Authors" },
]
keywords = ["cubesandbox", "sandbox", "code-execution", "ai-agent", "microvm"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = [
    "httpx>=0.27",
    "requests>=2",
]
dynamic = ["version"]

[project.urls]
Homepage = "https://github.com/TencentCloud/CubeSandbox"
Repository = "https://github.com/TencentCloud/CubeSandbox"
Issues = "https://github.com/TencentCloud/CubeSandbox/issues"
Documentation = "https://github.com/TencentCloud/CubeSandbox/tree/main/sdk/python"

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-cov>=4.0",
    "mypy>=1.0",
    "ruff>=0.4",
]

[tool.setuptools.dynamic]
version = { attr = "cubesandbox.__version__" }

[tool.setuptools.packages.find]
where = ["."]
include = ["cubesandbox*"]
exclude = ["tests*", "examples*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v --tb=short"
markers = [
    "e2e: tests that hit a live CubeAPI instance",
]

[tool.ruff]
line-length = 100
target-version = "py39"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.9"
strict = true
ignore_missing_imports = true
