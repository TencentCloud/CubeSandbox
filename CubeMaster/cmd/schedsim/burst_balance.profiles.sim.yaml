# BurstBalance scenario profile for schedsim.
#
# Goal:
#   Distribute high-rate, similarly sized requests across available nodes
#   and avoid concentrating burst traffic on one node.
#
# Strategy:
#   1. Mandatory guards reject unsafe or infeasible nodes.
#   2. real_time_weighted_average prefers nodes with lower allocation.
#   3. Top-3 spread distributes requests among the best candidates.
#
# The Top-N value is an initial value for evaluation rather than a claimed optimum.
common:
  http_port: 18089
  collect_metric_interval: 1s
  report_local_create_num: false
  report_stdev_metric: false

log:
  module: "schedsim"
  path: "/tmp/schedsim-log"
  level: "error"
  file_size: 100
  file_num: 2

cubelet_conf:
  create_concurrent_limit: 100
  destroy_concurent_limit: 50

scheduler:
  pre_select_num: -1

  # These legacy picker fields are ignored when scheduler.profiles is present.
  # They are retained to keep the simulator configuration compatible.
  priority_select_num: 1
  least_select_name: "random"

  metric_update_timeout: 86400s
  local_metric_update_timeout: 86400s

  ignore_redis_allocation: false
  overcommit_ratio:
    cpu_ratio: 3.0
    mem_ratio: 2.0
  node_max_mem_reserved_in_mb: 256

    # The realtime scorer compares current CPU and memory quota allocation.
    # Factor base scores are clamped to [0,100] at the scorer boundary
    # (pkg/selector/score/utils.go clampFactorScore), so overcommitted quota
    # factors no longer trip the Profile fail-closed score-range check.
    # Request weights remain omitted to keep the burst objective purely
    # allocation-driven.
  score:
    resource_weights:
      quota_cpu_usage: 1.0
      quota_mem_usage: 1.0
    plugin_conf:
      real_time_weighted_average:
        weight: 1.0
        enable_weight_factors:
          - "quota_cpu_usage"
          - "quota_mem_usage"

  instance_type_conf:
    sim:
      oss_cluster_labels:
        schedsim-sim: {}

  profiles:
    - name: burst_balance
      default: true

      # Mandatory safety and capacity guards are added automatically.
      scores:
        - name: real_time_weighted_average
          type: go
          weight: 1.0
        # 与出厂 burst_balance 对齐：在途创建越少的节点分越高
        - name: create_concurrency_score
          type: go
          weight: 1.0

      # Spread requests among the three highest-ranked candidates.
      selection:
        method: spread
        top_n: 3

      failure:
        filter: fail-closed
        score: fail-closed
        no_candidate: fail