# Built-in ("factory") scheduler profiles embedded into the CubeMaster binary.
#
# Compiled into the binary via go:embed (see schedulerFactoryYAML in config.go)
# and injected ONLY when no scheduler policy is configured at all (no
# scheduler.profiles and no legacy scheduler.filter / scheduler.score /
# scheduler.postscore block); any explicit policy configuration replaces this
# file entirely (all-or-nothing). Injection changes placement versus the
# legacy empty-config behavior — see config.go and
# docs/guide/scheduler-plugin.md for the injection rules and the
# disable_factory_profiles escape hatch.
#
# Three built-in strategies:
#   - burst_balance   route: labels {workload: burst_balance}
#                     Burst balancing: spreads high-rate, similarly sized
#                     requests across candidate nodes by resource watermark
#                     and in-flight creates.
#   - template_reuse  route: labels {workload: template_reuse}
#                     Template reuse: prefers nodes already holding a local
#                     replica of the template, spread by same-template create
#                     pressure.
#   - mixed_binpack   default
#                     Mixed bin-packing (default): tighter placement that
#                     preserves entirely free nodes, Top-2 spread against
#                     herding.
## The legacy `score` subtree below is NOT a pipeline definition: with profiles
# present, compileLegacy never runs. It only feeds the factor weights that the
# built-in scorers read from the global config at runtime
# (pkg/selector/score/realtimescore.go, imagescore.go); without it those
# scorers stay no-ops because their enable_weight_factors live only here.

scheduler:
  # Request labels allowed to affect profile routing.
  profile_route_label_keys:
    - workload

  score:
    # Factor weights referenced by enable_weight_factors below.
    resource_weights:
      quota_cpu_usage: 1.0
      quota_mem_usage: 1.0
      template_id: 1.0
    plugin_conf:
      real_time_weighted_average:
        weight: 1.0
        enable_weight_factors:
          - "quota_cpu_usage"
          - "quota_mem_usage"
      image_score:
        weight: 1.0
        enable_weight_factors:
          - "template_id"

  profiles:
    - name: burst_balance
      route:
        labels:
          workload: burst_balance
      scores:
        - name: real_time_weighted_average
          type: go
          weight: 1.0
      # Spread burst requests among the three highest-ranked candidates.
      selection:
        method: spread
        top_n: 3
      failure:
        filter: fail-closed
        score: default-score
        no_candidate: backoff

    - name: template_reuse
      route:
        labels:
          workload: template_reuse
      scores:
        # Main objective: prefer nodes holding a local template replica.
        # Weights were calibrated by offline simulation.
        - name: image_score
          type: go
          weight: 0.7
        # Secondary objective: keep overloaded cache nodes from taking all.
        - name: real_time_weighted_average
          type: go
          weight: 0.3
      selection:
        method: spread
        top_n: 3
      failure:
        filter: fail-closed
        score: default-score
        no_candidate: backoff

    - name: mixed_binpack
      default: true
      scores:
        # Main objective: tighter placement, penalizing CPU/mem imbalance.
        - name: resource_fit_score
          type: go
          weight: 0.7
          args:
            imbalance_penalty: 0.5
        # Secondary objective: avoid nodes with substantially higher load.
        - name: real_time_weighted_average
          type: go
          weight: 0.3
      # Select among the two highest-ranked candidates to reduce herding.
      selection:
        method: spread
        top_n: 2
      failure:
        filter: fail-closed
        score: default-score
        no_candidate: backoff
