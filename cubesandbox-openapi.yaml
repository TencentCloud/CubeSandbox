openapi: "3.0.3"

info:
  title: cubesandbox SDK
  description: |
    cubesandbox Python SDK OpenAPI specification.
    Compatible with CubeAPI, with client-side DNS bypass support (CUBE_PROXY_NODE_IP)
    so remote machines can access sandbox data streams without CoreDNS.

    ## Architecture

    ```
    Client
        │
        ├─ CubeAPI:3000  ──── Sandbox lifecycle (this document's paths)
        │     Direct TCP to IP:3000, no DNS required
        │
        └─ CubeProxy:80  ──── Data stream (x-envd-stream extension)
              Standard:  *.cube.app ──CoreDNS──▶ 127.0.0.1 (local node only)
              This SDK:  TCP direct to CUBE_PROXY_NODE_IP:80
                         Host header preserves 49999-{id}.cube.app (CubeProxy routing key)
    ```

    ## Environment Variables

    | Variable | Required | Default | Description |
    |----------|:--------:|---------|-------------|
    | CUBE_API_URL | ✅ | http://127.0.0.1:3000 | CubeAPI address |
    | CUBE_TEMPLATE_ID | ✅ | — | Template ID |
    | CUBE_PROXY_NODE_IP | remote | — | CubeProxy node IP, bypasses DNS |
    | CUBE_PROXY_PORT_HTTP | — | 80 | CubeProxy HTTP port |
    | CUBE_SANDBOX_DOMAIN | — | cube.app | Sandbox domain suffix |

  version: "1.0.0"

servers:
  - url: "http://{cubeApiHost}:3000"
    description: CubeAPI management plane (CUBE_API_URL)
    variables:
      cubeApiHost:
        default: "127.0.0.1"
        description: "CubeAPI host IP"

tags:
  - name: health
    description: Health check
  - name: sandboxes-v1
    description: Sandbox management v1
  - name: sandboxes-v2
    description: Sandbox management v2 (with filtering)

paths:

  /health:
    get:
      summary: Health check
      description: Check service health. No authentication required.
      operationId: getHealth
      tags: [health]
      responses:
        "200":
          description: Service is healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthResponse"
              example:
                status: "ok"
                sandboxes: 0

  /sandboxes:
    get:
      summary: List all sandboxes (v1)
      description: List all running sandboxes (v1, returns full list).
      operationId: listSandboxes
      tags: [sandboxes-v1]
      responses:
        "200":
          description: Sandbox list
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/SandboxDetail"

    post:
      summary: Create a sandbox
      description: |
        Create a new sandbox instance.
        Returns sandboxID and domain; the SDK uses these to construct the data stream URL:
        `http://{JUPYTER_PORT}-{sandboxID}.{domain}/execute`

        **DNS bypass (handled automatically by the SDK)**:
        - Without `CUBE_PROXY_NODE_IP`: OS resolves `*.cube.app` (local node only)
        - With `CUBE_PROXY_NODE_IP`: direct TCP to that IP, Host header preserved
      operationId: createSandbox
      tags: [sandboxes-v1]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateSandboxRequest"
            example:
              templateID: "tpl-xxxxxxxxxxxxxxxxxxxxxxxx"
              timeout: 300
      responses:
        "201":
          description: Sandbox created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SandboxCreated"
              example:
                templateID: "tpl-xxxxxxxxxxxxxxxxxxxxxxxx"
                sandboxID: "7b93392513d84b7eb2f5b8da26717b77"
                clientID: "bdb40b5b-4777-488e-961a-68de8083ff41"
                envdVersion: "0.2.0"
                domain: "cube.app"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/ServerError"

  /v2/sandboxes:
    get:
      summary: List sandboxes (v2)
      description: |
        List sandboxes (v2) with optional state / metadata filtering and limit.
        Response structure is identical to v1.
      operationId: listSandboxesV2
      tags: [sandboxes-v2]
      parameters:
        - name: state
          in: query
          required: false
          description: Filter by sandbox state
          schema:
            type: string
            enum: [running, paused, stopped]
          example: running
        - name: limit
          in: query
          required: false
          description: Maximum number of results to return
          schema:
            type: integer
            minimum: 1
          example: 10
        - name: metadata
          in: query
          required: false
          description: Filter by metadata key=value (repeatable)
          schema:
            type: string
          example: "cube.product=cubebox"
      responses:
        "200":
          description: Filtered sandbox list
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/SandboxDetail"

  /sandboxes/{sandboxID}:
    get:
      summary: Get sandbox detail
      description: GET /sandboxes/:sandboxID — Get sandbox detail.
      operationId: getSandbox
      tags: [sandboxes-v1]
      parameters:
        - $ref: "#/components/parameters/sandboxID"
      responses:
        "200":
          description: Sandbox detail
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SandboxDetail"
              example:
                templateID: "tpl-xxxxxxxxxxxxxxxxxxxxxxxx"
                sandboxID: "7b93392513d84b7eb2f5b8da26717b77"
                clientID: "7b93392513d84b7eb2f5b8da26717b77"
                startedAt: "2026-04-26T10:59:24.813Z"
                endAt: "2026-04-26T10:59:24.813Z"
                state: "running"
                cpuCount: 2
                memoryMB: 2000
                diskSizeMB: 0
                envdVersion: "0.2.0"
                domain: "cube.app"
        "404":
          $ref: "#/components/responses/NotFound"

    delete:
      summary: Destroy a sandbox
      description: DELETE /sandboxes/:sandboxID — Destroy a sandbox.
      operationId: deleteSandbox
      tags: [sandboxes-v1]
      parameters:
        - $ref: "#/components/parameters/sandboxID"
      responses:
        "204":
          description: Sandbox deleted
        "404":
          $ref: "#/components/responses/NotFound"

  /sandboxes/{sandboxID}/pause:
    post:
      summary: Pause a sandbox
      description: |
        POST /sandboxes/:sandboxID/pause — Pause a sandbox (preserves memory snapshot).

        The sandbox can be resumed later via POST /sandboxes/:sandboxID/connect.
      operationId: pauseSandbox
      tags: [sandboxes-v1]
      parameters:
        - $ref: "#/components/parameters/sandboxID"
      responses:
        "204":
          description: Sandbox paused
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: Sandbox cannot be paused
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /sandboxes/{sandboxID}/resume:
    post:
      summary: Resume a sandbox (deprecated)
      description: |
        POST /sandboxes/:sandboxID/resume — Resume a paused sandbox.

        **Deprecated** — use POST /sandboxes/:sandboxID/connect instead,
        which handles resume automatically.
      operationId: resumeSandbox
      deprecated: true
      tags: [sandboxes-v1]
      parameters:
        - $ref: "#/components/parameters/sandboxID"
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                timeout:
                  type: integer
                  description: Sandbox TTL after resume (seconds)
                  default: 300
            example:
              timeout: 300
      responses:
        "201":
          description: Sandbox resumed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SandboxCreated"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: Sandbox is already running
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /sandboxes/{sandboxID}/connect:
    post:
      summary: Connect to a sandbox
      description: |
        POST /sandboxes/:sandboxID/connect — Connect to a sandbox.

        Automatically resumes the sandbox if it is currently paused.
        Returns the same format as POST /sandboxes (create).
      operationId: connectSandbox
      tags: [sandboxes-v1]
      parameters:
        - $ref: "#/components/parameters/sandboxID"
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                timeout:
                  type: integer
                  description: Sandbox TTL after connect (seconds)
                  default: 300
            example:
              timeout: 300
      responses:
        "200":
          description: Connected successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SandboxCreated"
        "404":
          $ref: "#/components/responses/NotFound"

# ── Data stream (envd via CubeProxy, not CubeAPI) ────────────────────────────
# URL format:  http://49999-{sandboxID}.{domain}/execute
# SDK impl:    IPOverrideTransport replaces TCP target with CUBE_PROXY_NODE_IP:80
#              HTTP Host header preserves the virtual hostname (CubeProxy routing key)
x-envd-stream:
  execute:
    method: POST
    urlTemplate: "http://{JUPYTER_PORT}-{sandboxID}.{domain}/execute"
    jupyterPort: 49999
    description: |
      Execute code inside the sandbox; returns results as an ndjson stream.
      Client DNS bypass (IPOverrideTransport):
        TCP target  → CUBE_PROXY_NODE_IP:CUBE_PROXY_PORT_HTTP
        HTTP Host   → {JUPYTER_PORT}-{sandboxID}.{domain} (unchanged)
    requestBody:
      schema: ExecuteRequest
    response:
      contentType: application/x-ndjson
      events:
        - type: stdout        # print() output
        - type: stderr        # stderr output
        - type: result        # expression return value (is_main_result=true for cell final value)
        - type: error         # execution exception
        - type: number_of_executions  # execution counter

components:

  parameters:
    sandboxID:
      name: sandboxID
      in: path
      required: true
      description: Sandbox identifier
      schema:
        type: string
        example: "7b93392513d84b7eb2f5b8da26717b77"

  responses:
    NotFound:
      description: Resource not found
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
          example:
            code: 404
            message: "sandbox not found"
    ServerError:
      description: Unexpected backend error
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"

  schemas:

    HealthResponse:
      type: object
      properties:
        status:
          type: string
          enum: [ok, error]
          example: ok
        sandboxes:
          type: integer
          description: Number of currently running sandboxes
          example: 1

    CreateSandboxRequest:
      type: object
      required: [templateID]
      properties:
        templateID:
          type: string
          description: Template ID
          example: "tpl-xxxxxxxxxxxxxxxxxxxxxxxx"
        timeout:
          type: integer
          description: Sandbox TTL in seconds
          default: 300
          example: 300
        envVars:
          type: object
          additionalProperties:
            type: string
          description: Environment variables injected into the sandbox
          nullable: true
        metadata:
          type: object
          additionalProperties:
            type: string
          description: |
            Arbitrary key-value metadata. Supported keys:
            - `network-policy`: `allow-all` | `deny-all` | `custom`
            - `network-rules`: JSON allow/deny list (used with `custom` policy)
            - `hostdir-mount`: JSON array of host-directory mount configs
          nullable: true

    SandboxCreated:
      type: object
      description: Response from POST /sandboxes or POST /sandboxes/:sandboxID/connect
      required: [templateID, sandboxID, domain]
      properties:
        templateID:
          type: string
        sandboxID:
          type: string
          description: Sandbox identifier, used to construct the data stream URL
        clientID:
          type: string
        envdVersion:
          type: string
          example: "0.2.0"
        domain:
          type: string
          description: Sandbox domain suffix
          example: "cube.app"

    SandboxDetail:
      type: object
      properties:
        templateID:
          type: string
        sandboxID:
          type: string
        clientID:
          type: string
        startedAt:
          type: string
          format: date-time
        endAt:
          type: string
          format: date-time
        state:
          type: string
          enum: [running, paused, stopped]
        cpuCount:
          type: integer
        memoryMB:
          type: integer
        diskSizeMB:
          type: integer
        envdVersion:
          type: string
        domain:
          type: string
          example: "cube.app"
        metadata:
          type: object
          additionalProperties:
            type: string

    ExecuteRequest:
      type: object
      required: [code]
      description: Request body for POST /execute (envd endpoint)
      properties:
        code:
          type: string
          description: Python code to execute
          example: "x = 1 + 1; x"
        context_id:
          type: string
          nullable: true
          description: Kernel context ID; variables persist within the same context
        language:
          type: string
          nullable: true
          default: python
        env_vars:
          type: object
          nullable: true
          additionalProperties:
            type: string

    StreamEventStdout:
      type: object
      required: [type, text]
      properties:
        type:      { type: string, enum: [stdout] }
        text:      { type: string, example: "hello\n" }
        timestamp: { type: string, format: date-time }

    StreamEventStderr:
      type: object
      required: [type, text]
      properties:
        type:      { type: string, enum: [stderr] }
        text:      { type: string }
        timestamp: { type: string, format: date-time }

    StreamEventResult:
      type: object
      required: [type]
      properties:
        type:           { type: string, enum: [result] }
        text:           { type: string, example: "2", nullable: true }
        is_main_result: { type: boolean, description: "true = final cell return value" }
        html:           { type: string, nullable: true }
        markdown:       { type: string, nullable: true }
        svg:            { type: string, nullable: true }
        png:            { type: string, nullable: true, description: base64-encoded }
        jpeg:           { type: string, nullable: true, description: base64-encoded }
        pdf:            { type: string, nullable: true }
        latex:          { type: string, nullable: true }
        json:           { type: object, nullable: true }
        javascript:     { type: string, nullable: true }
        extra:          { type: object, nullable: true }

    StreamEventError:
      type: object
      required: [type, name, value]
      properties:
        type:      { type: string, enum: [error] }
        name:      { type: string, example: "ZeroDivisionError" }
        value:     { type: string, example: "division by zero" }
        traceback: { type: array, items: { type: string } }

    StreamEventExecutionCount:
      type: object
      required: [type, execution_count]
      properties:
        type:            { type: string, enum: [number_of_executions] }
        execution_count: { type: integer, example: 3 }

    ErrorResponse:
      type: object
      properties:
        code:    { type: integer }
        message: { type: string }
