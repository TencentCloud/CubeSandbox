# CubeOps configuration example.
#
# Copy to /etc/cube/ops.yaml and edit, or set the path in CUBE_OPS_CONFIG.
# Any field here can be overridden by an environment variable; env wins.

# --- HTTP server ---
bind: "127.0.0.1:3010"
log_level: "info"
log_dir: "/data/log/CubeOps"  # log file directory
log_file_num: 10              # number of rotated log files to retain
log_file_size: 100            # max size in MB per log file before rotation
jwt_secret: ""             # leave empty to auto-generate on first start

# --- Database (MySQL) ---
# IMPORTANT: Replace the placeholder values below with your real credentials
# before deploying. The defaults shown here are EXAMPLES ONLY and will not
# connect to a real database.
#
# Two equivalent ways to configure:
#
# (a) Full URL (recommended):
# database_url: "mysql://USER:PASSWORD@HOST:PORT/DBNAME"
#
# (b) Individual fields (URL takes precedence if both are set):
# mysql_host: "127.0.0.1"
# mysql_port: 3306
# mysql_user: "REPLACE_ME"
# mysql_password: "REPLACE_ME"
# mysql_db: "REPLACE_ME"
#
# When neither is set, CubeOps falls back to the CUBE_SANDBOX_MYSQL_*
# environment variables (legacy behavior).

# --- JWT ---
# Access tokens are short-lived; refresh tokens are long-lived.
access_ttl: "15m"
refresh_ttl: "168h"

# --- CubeMaster (the actual sandbox / cluster control plane) ---
cubemaster_addr: "http://127.0.0.1:8089"

# --- CubeAPI (deprecated SDK proxy) ---
cubeapi_url: "http://127.0.0.1:3000"

# --- Redis (required when webhook.enabled=true) ---
redis_url: ""

# --- Sandbox domain exposed to SDK clients via /config ---
sandbox_domain: "cube.app"

# --- Soft-delete tombstone purge (issue #973) ---
# Scheduled hard-purge of soft-deleted ("tombstoned") agenthub rows. All
# fields optional; retention/interval default to 7d/1h. OFF by default — the
# purge is irreversible, so opt in explicitly. See docs/guide/soft-delete-purge.md.
soft_delete_purge:
  enable: false       # default-off: this purge is irreversible, opt in explicitly
  dry_run: false      # count-only first rollout (no DELETE issued)
  retention: "168h"   # rows with deleted_at older than now-retention are purged
  interval: "1h"      # time between purge passes

# --- Webhook delivery worker (issue #642) ---
# Disabled by default. When enabled, CubeOps consumes the lifecycle stream
# and POSTs sandbox events to subscribed endpoints.
webhook:
  enabled: false              # CUBE_OPS_WEBHOOK_ENABLED; requires redis_url
  consumer_group: "cube-webhook"   # must not equal CLM's cube-proxy-sidecar
  consumer_name: ""                # default <hostname>-<random suffix>
  read_block: "5s"
  consumer_batch_size: 10          # XREADGROUP COUNT == per-cycle materialization cap
  retry_poll_interval: "1s"
  claim_batch_size: 32             # >= worker_concurrency
  backlog_watermark: 10000         # global actionable backlog that pauses reads
  per_subscription_backlog_limit: 1000  # soft send limit per subscription
  keep_pending_max_retry_window: "168h" # 0 = infinite retries (requires alerting + SOP)
  max_subscriptions_per_event: 200      # materialization chunk size
  lease_duration: "60s"                 # floor; effective = max(this, 2*http_timeout)
  http_timeout: "10s"
  shutdown_timeout: "30s"               # in-flight sends are NOT cancelled during this window
  max_attempts: 5
  worker_concurrency: 8
  per_subscription_concurrency: 2       # per-replica; total = replicas * value
  dead_letter_mode: "keep-pending"      # keep-pending | dead-letter
  allow_private_networks: false         # dev/test only: allow loopback + RFC1918
  cleanup:
    succeeded_retention: "720h"         # 30 days
    terminal_failure_retention: "2160h" # permanent_failed/dead/materialization failures: 90 days
    interval: "24h"
