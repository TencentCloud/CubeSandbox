# CubeOps configuration example (optional; one-click and Helm use env vars).
#
# Copy to /etc/cube/ops.yaml and edit, or set the path in CUBE_OPS_CONFIG.
# Any field here can be overridden by an environment variable; env wins.
# Nested keys map to CUBE_OPS_<SECTION>_<FIELD>, e.g. s3.endpoint →
# CUBE_OPS_S3_ENDPOINT.

# --- HTTP server ---
bind: "127.0.0.1:3010"          # CUBE_OPS_BIND
log_level: "info"               # CUBE_OPS_LOG_LEVEL
log_dir: "/data/log/CubeOps"    # CUBE_OPS_LOG_DIR
log_file_num: 10                # CUBE_OPS_LOG_FILE_NUM
log_file_size: 100              # CUBE_OPS_LOG_FILE_SIZE
jwt_secret: ""                  # JWT_SECRET; leave empty to auto-generate on first start

# --- Database (MySQL) ---
# IMPORTANT: Replace the placeholder values below with your real credentials
# before deploying. The defaults shown here are EXAMPLES ONLY and will not
# connect to a real database.
#
# Two equivalent ways to configure:
#
# (a) Full URL (recommended):
# database_url: "mysql://USER:PASSWORD@HOST:PORT/DBNAME"   # DATABASE_URL
#
# (b) Individual fields (URL takes precedence if both are set):
# mysql_host: "127.0.0.1"          # CUBE_SANDBOX_MYSQL_HOST
# mysql_port: 3306                 # CUBE_SANDBOX_MYSQL_PORT
# mysql_user: "REPLACE_ME"         # CUBE_SANDBOX_MYSQL_USER
# mysql_password: "REPLACE_ME"     # CUBE_SANDBOX_MYSQL_PASSWORD
# mysql_db: "REPLACE_ME"           # CUBE_SANDBOX_MYSQL_DB
#
# When neither is set, CubeOps falls back to the CUBE_SANDBOX_MYSQL_*
# environment variables (legacy behavior).

# --- JWT ---
# Access tokens are short-lived; refresh tokens are long-lived.
access_ttl: "15m"               # JWT_ACCESS_TTL
refresh_ttl: "168h"             # JWT_REFRESH_TTL

# --- CubeMaster (the actual sandbox / cluster control plane) ---
cubemaster_addr: "http://127.0.0.1:8089"   # CUBE_MASTER_ADDR

# --- CubeAPI (deprecated SDK proxy) ---
cubeapi_url: "http://127.0.0.1:3000"       # CUBE_API_URL

# --- Redis (optional, used for node metric fan-out) ---
# A non-empty redis_url is the complete connection configuration and overrides
# Sentinel and split settings. Include the logical database in the URL path.
redis_url: ""
redis_host: ""
redis_port: 0
redis_db: 0
redis_password: ""

# --- Sandbox domain exposed to SDK clients via /config ---
sandbox_domain: "cube.app"      # CUBE_API_SANDBOX_DOMAIN

# --- Soft-delete tombstone purge (issue #973) ---
# Scheduled hard-purge of soft-deleted ("tombstoned") agenthub rows. All
# fields optional; retention/interval default to 7d/1h. OFF by default — the
# purge is irreversible, so opt in explicitly. See docs/guide/soft-delete-purge.md.
soft_delete_purge:
  enable: false       # default-off: this purge is irreversible, opt in explicitly
  dry_run: false      # count-only first rollout (no DELETE issued)
  retention: "168h"   # rows with deleted_at older than now-retention are purged
  interval: "1h"      # time between purge passes

# --- Object store ---
s3:
  endpoint: ""            # CUBE_OPS_S3_ENDPOINT
  node_endpoint: ""       # CUBE_OPS_S3_NODE_ENDPOINT; default = endpoint
                          # SigV4 signs Host; set this when callers cannot
                          # resolve the cluster-internal endpoint.
  access_key_id: ""       # CUBE_OPS_S3_ACCESS_KEY_ID
  secret_access_key: ""   # CUBE_OPS_S3_SECRET_ACCESS_KEY
  bucket: "cube-ops"      # CUBE_OPS_S3_BUCKET
  region: "us-east-1"     # CUBE_OPS_S3_REGION (required for presign; skips getBucketLocation)
  path_style: true        # CUBE_OPS_S3_PATH_STYLE
  create_bucket: true     # CUBE_OPS_S3_CREATE_BUCKET

# --- Component warehouse ---
# Needs s3.endpoint + credentials; otherwise routes return 501 warehouse_disabled.
# work_dir is local unpack scratch and is not shared across replicas.
warehouse:
  work_dir: "/var/tmp/cubeops-warehouse"  # CUBE_OPS_WAREHOUSE_WORK_DIR
  upload_timeout: "30m"                   # CUBE_OPS_WAREHOUSE_UPLOAD_TIMEOUT (also HTTP WriteTimeout)
  fetch_timeout: "30m"                    # CUBE_OPS_WAREHOUSE_FETCH_TIMEOUT
  # Presign TTL is clamped to 1m–15m (default 5m). SigV4 only checks expiry
  # when the GET starts, so a 5m ticket can still finish a 30m GB-sized download.
  presign_ttl: "5m"                       # CUBE_OPS_WAREHOUSE_PRESIGN_TTL
  github_repos:                           # CUBE_OPS_WAREHOUSE_GITHUB_REPOS (comma-separated)
    - "TencentCloud/CubeSandbox"
  cnb_repos:                              # CUBE_OPS_WAREHOUSE_CNB_REPOS (comma-separated)
    - "CubeSandbox/CubeSandbox"
  # github_token / cnb_token: leave empty for public releases.
  # CUBE_OPS_WAREHOUSE_GITHUB_TOKEN / CUBE_OPS_WAREHOUSE_CNB_TOKEN
