# CubeOps Webhook configuration.
# Copy this file to /usr/local/services/cubetoolbox/CubeOps/webhooks.toml
# and set CUBE_OPS_WEBHOOK_CONFIG in .one-click.env to enable it.

[delivery]
# Events waiting for the webhook dispatcher. A full queue rejects complete
# internal batches without partially accepting their events.
event_queue_capacity = 10000
# Endpoint batch deliveries that may exist at once, including deliveries waiting
# for an HTTP permit, sending a request, or sleeping before a retry.
max_outstanding_deliveries = 1000
# HTTP request attempts that may perform network I/O concurrently.
max_concurrent_requests = 100
# Default batch size for endpoints that do not set batch_size. Use 1 to deliver
# each event as soon as possible.
default_batch_size = 1
# Global timed flush interval in seconds. Partial batches are delivered when this
# interval elapses.
flush_interval_secs = 5
# Timeout for one HTTP POST attempt, in seconds.
request_timeout_secs = 5
# Maximum delivery attempts, including the first attempt and retries.
max_attempts = 3
# Delay before the first retry, in milliseconds. Later retries use exponential
# backoff.
initial_backoff_ms = 500
# Maximum exponential-backoff delay, in seconds.
max_backoff_secs = 10

[[endpoints]]
# Endpoint name, used in delivery logs.
name = "endpoint0"
# Webhook receiver URL. CubeOps sends HTTP POST requests to this address.
url = "http://127.0.0.1:8088/webhook"
# Event types subscribed by this endpoint.
events = [
  "sandbox.created",
  "sandbox.deleted",
  "sandbox.paused",
  "sandbox.resumed",
  "api.error",
]
# Batch size for this endpoint. When omitted, delivery.default_batch_size is used.
batch_size = 1
# Optional. Environment variable that stores the HMAC-SHA256 signing secret. Do
# not put the secret value directly in this file. The env var value is read by
# CubeOps on startup and used for X-Cube-Signature-256:
# sha256=<hex HMAC-SHA256(raw_body)>.
# Use CUBE_WEBHOOK_SECRET_1, CUBE_WEBHOOK_SECRET_2, ... for additional endpoints.
# secret_env must be prefixed with `CUBE_WEBHOOK_SECRET_`.
secret_env = "CUBE_WEBHOOK_SECRET_0"

# Optional high-volume diagnostics stream. The same URL may be reused for a
# disjoint event set, but the same URL and event must not appear in more than one
# endpoint.
#
# [[endpoints]]
# name = "local-dev-api"
# url = "http://127.0.0.1:8088/webhook"
# events = ["api.request", "api.response"]
# batch_size = 100
# secret_env = "CUBE_WEBHOOK_SECRET_0"
