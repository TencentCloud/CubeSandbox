# EgressProxy performance and isolation test workloads.
apiVersion: v1
kind: ConfigMap
metadata:
  name: long-connection-nginx
  namespace: cube-egress-test
data:
  default.conf: |
    server {
      listen 80;
      keepalive_timeout 300s;
      keepalive_requests 100000;
      location / {
        return 200 "long-connection-ok\n";
      }
    }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: long-connection-test
  namespace: cube-egress-test
spec:
  replicas: 1
  selector:
    matchLabels:
      app: long-connection-test
  template:
    metadata:
      labels:
        app: long-connection-test
        access: allowed
    spec:
      containers:
        - name: nginx
          image: nginx:1.27-alpine
          ports:
            - name: http
              containerPort: 80
          volumeMounts:
            - name: config
              mountPath: /etc/nginx/conf.d/default.conf
              subPath: default.conf
      volumes:
        - name: config
          configMap:
            name: long-connection-nginx
---
apiVersion: v1
kind: Service
metadata:
  name: long-connection-test
  namespace: cube-egress-test
spec:
  selector:
    app: long-connection-test
  ports:
    - name: http
      port: 80
      targetPort: http
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: performance-server
  namespace: cube-egress-test
spec:
  replicas: 1
  selector:
    matchLabels:
      app: performance-server
  template:
    metadata:
      labels:
        app: performance-server
        access: allowed
    spec:
      initContainers:
        - name: create-test-file
          image: alpine:3.22
          command:
            - /bin/sh
            - -ec
            - |
              dd if=/dev/zero of=/data/blob.bin bs=1M count=64
          volumeMounts:
            - name: data
              mountPath: /data
        - name: install-busybox
          image: alpine:3.22
          command:
            - /bin/sh
            - -ec
            - |
              cp /bin/busybox /data/busybox
              cp /lib/ld-musl-*.so.1 /data/ld-musl
          volumeMounts:
            - name: data
              mountPath: /data
      containers:
        - name: nginx
          image: nginx:1.27-alpine
          ports:
            - name: http
              containerPort: 80
          volumeMounts:
            - name: data
              mountPath: /usr/share/nginx/html
              readOnly: true
      volumes:
        - name: data
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: performance-server
  namespace: cube-egress-test
spec:
  selector:
    app: performance-server
  ports:
    - name: http
      port: 80
      targetPort: http
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: performance-client
  namespace: cube-egress-test
spec:
  replicas: 1
  selector:
    matchLabels:
      app: performance-client
  template:
    metadata:
      labels:
        app: performance-client
    spec:
      initContainers:
        - name: install-busybox
          image: alpine:3.22
          command:
            - /bin/sh
            - -ec
            - |
              cp /bin/busybox /tools/busybox
              cp /lib/ld-musl-*.so.1 /tools/ld-musl
          volumeMounts:
            - name: tools
              mountPath: /tools
      containers:
        - name: client
          image: ubuntu:24.04
          command: ["/bin/bash", "-c", "sleep infinity"]
          volumeMounts:
            - name: tools
              mountPath: /tools
              readOnly: true
      volumes:
        - name: tools
          emptyDir: {}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: node-management-test
  namespace: cube-egress-test
spec:
  replicas: 1
  selector:
    matchLabels:
      app: node-management-test
  template:
    metadata:
      labels:
        app: node-management-test
    spec:
      hostNetwork: true
      dnsPolicy: ClusterFirstWithHostNet
      nodeName: 10.0.99.143
      containers:
        - name: server
          image: nginx:1.27-alpine
          ports:
            - name: http
              containerPort: 18081
              hostPort: 18081
          command:
            - /bin/sh
            - -ec
            - |
              sed -i 's/listen       80;/listen       18081;/' /etc/nginx/conf.d/default.conf
              exec nginx -g 'daemon off;'
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: normal-network-client
  namespace: cube-egress-test
spec:
  replicas: 1
  selector:
    matchLabels:
      app: normal-network-client
  template:
    metadata:
      labels:
        app: normal-network-client
    spec:
      containers:
        - name: client
          image: nginx:1.27-alpine
          command: ["/bin/sh", "-c", "sleep 86400"]
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: hostnetwork-client
  namespace: cube-egress-test
spec:
  replicas: 1
  selector:
    matchLabels:
      app: hostnetwork-client
  template:
    metadata:
      labels:
        app: hostnetwork-client
    spec:
      hostNetwork: true
      dnsPolicy: ClusterFirstWithHostNet
      nodeName: 10.0.99.170
      containers:
        - name: client
          image: nginx:1.27-alpine
          command: ["/bin/sh", "-c", "sleep 86400"]
