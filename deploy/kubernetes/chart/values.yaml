# Default values for CubeSandbox on Kubernetes/TKE.
# This chart intentionally separates bootstrap images from runtime images.

nameOverride: ""
fullnameOverride: ""

global:
  timezone: Asia/Shanghai
  # Cluster DNS domain used to build in-cluster Service FQDNs (mysql, redis,
  # cube-master, cube-api). Override when the cluster is configured with
  # kubelet --cluster-domain=<non-default>. Empty falls back to
  # cubeNode.dns.clusterDomain, then "cluster.local".
  clusterDomain: ""
  # Optional registry prefix that replaces the registry portion of every
  # Cube-owned image below. Leave empty to keep the per-image repository
  # exactly as declared. Set to e.g. "my-registry.example.com/cubesandbox"
  # to mirror all images into a private registry without editing each entry
  # individually. Applies to the pvmHostBootstrap / nodeInit / node / master
  # / api / cubemastercli / proxyNode / cubeEgress / cubeEgressNet / webui
  # entries but not to third-party images such as coredns / mysql / redis /
  # docker-in-docker.
  imageRegistry: ""

images:
  # Init container 1: installs/configures PVM host kernel and may reboot the host.
  pvmHostBootstrap:
    repository: ccr.ccs.tencentyun.com/cubesandbox-chart/cube-pvm-host-bootstrap
    tag: v0.5.0
    pullPolicy: Always

  # Init container 2: validates KVM/XFS, prepares host directories, checks CubeMaster reachability.
  nodeInit:
    repository: ccr.ccs.tencentyun.com/cubesandbox-chart/cube-node-init
    tag: v0.5.0
    pullPolicy: Always

  # Runtime container for Cube compute nodes. It should contain node-only components.
  node:
    repository: ccr.ccs.tencentyun.com/cubesandbox-chart/cube-node
    tag: v0.5.0
    pullPolicy: Always

  master:
    repository: ccr.ccs.tencentyun.com/cubesandbox-chart/cube-master
    tag: v0.5.0
    pullPolicy: Always

  api:
    repository: ccr.ccs.tencentyun.com/cubesandbox-chart/cube-api
    tag: v0.5.0
    pullPolicy: Always

  cubemastercli:
    repository: ccr.ccs.tencentyun.com/cubesandbox-chart/cubemastercli
    tag: v0.5.0
    pullPolicy: Always

  proxyNode:
    repository: ccr.ccs.tencentyun.com/cubesandbox-chart/cube-proxy-node
    tag: v0.5.0
    pullPolicy: Always

  cubeEgress:
    repository: ccr.ccs.tencentyun.com/cubesandbox-chart/cube-egress
    tag: v0.5.0
    pullPolicy: Always

  cubeEgressNet:
    repository: ccr.ccs.tencentyun.com/cubesandbox-chart/cube-egress-net
    tag: v0.5.0
    pullPolicy: Always

  webui:
    repository: ccr.ccs.tencentyun.com/cubesandbox-chart/cube-webui
    tag: v0.5.0
    pullPolicy: Always

  coredns:
    repository: ccr.ccs.tencentyun.com/tkeimages/coredns
    tag: v1.11.1-tke.1
    pullPolicy: IfNotPresent

  templateBuilder:
    repository: docker
    tag: "27-dind"
    pullPolicy: IfNotPresent

imagePullSecrets: []

# Optional StorageClass created by the chart. Off by default: on a plain
# Kubernetes / self-hosted cluster the PVCs below should use the cluster's
# default StorageClass, so leave `storageClass.create=false` and either leave
# `controlPlane.master.persistence.storageClassName` / `mysql.persistence.storageClassName`
# / `redis.persistence.storageClassName` empty (falls back to the cluster default)
# or point them at an existing StorageClass name.
#
# When you do want the chart to provision its own StorageClass, set
# `create=true` and supply `name` + `provisioner` (+ `parameters` when the
# provisioner needs them). Example for TKE CBS is included below as a comment;
# see values-tke.yaml for a ready-to-merge override.
storageClass:
  create: false
  name: ""
  provisioner: ""
  reclaimPolicy: Delete
  volumeBindingMode: WaitForFirstConsumer
  parameters: {}
  # --- Example: Tencent Cloud TKE CBS ---
  # create: true
  # name: cube-cbs-wffc
  # provisioner: com.tencent.cloud.csi.cbs
  # parameters:
  #   type: cbs

placement:
  # Control-plane components run only on dedicated control nodes.
  controlPlane:
    nodeSelector:
      cube.tencent.com/role: control
      cube.tencent.com/cube-control: "true"
    tolerations:
      - key: cube.tencent.com/control
        operator: Equal
        value: "true"
        effect: NoSchedule

  # Compute placement is used by cube-node and node-local cube-dns.
  compute:
    nodeSelector:
      cube.tencent.com/role: compute
      cube.tencent.com/cube-node: "true"
      cube.tencent.com/allow-pvm-bootstrap: "true"
    affinity: {}
    tolerations:
      - key: cube.tencent.com/compute
        operator: Equal
        value: "true"
        effect: NoSchedule

externalControlPlane:
  # Compute-only mode equivalent to one-click ONE_CLICK_DEPLOY_ROLE=compute.
  # When enabled, Cube Node and CubeAPI use the supplied CubeMaster endpoint
  # instead of the chart-managed CubeMaster Service.
  enabled: false
  masterEndpoint: ""
  apiEndpoint: ""

controlPlane:
  enabled: true
  namespaceScoped: true

  master:
    enabled: true
    replicas: 1
    command: []
    args: []
    env: []
    nodeIPs: []
    service:
      type: ClusterIP
      port: 8089
    persistence:
      # One-click persists CubeMaster artifacts under /data/CubeMaster/storage.
      # Kubernetes multi-control-node deployments use PVC by default so data
      # follows the Pod when it is rescheduled across control nodes.
      enabled: true
      hostPath: ""
      existingClaim: ""
      # Empty falls back to the cluster's default StorageClass (recommended
      # on self-hosted clusters). Set to the name of an explicit
      # StorageClass — e.g. "cube-cbs-wffc" for the bundled TKE preset — to
      # pin the PVC to a specific provisioner. `existingClaim` and
      # `hostPath` override storageClassName when set.
      storageClassName: ""
      size: 20Gi
      accessModes:
        - ReadWriteOnce
    probes:
      readiness:
        enabled: true
        path: /notify/health
        initialDelaySeconds: 5
        periodSeconds: 10
        failureThreshold: 12
      liveness:
        enabled: true
        path: /notify/health
        initialDelaySeconds: 30
        periodSeconds: 20
        failureThreshold: 6
    resources: {}

  api:
    enabled: true
    replicas: 1
    command: []
    args: []
    env: []
    bind: "0.0.0.0:3000"
    sandboxDomain: "cube.app"
    service:
      type: ClusterIP
      port: 3000
    internalLoadBalancer:
      enabled: false
      annotations: {}
      port: 3000
    probes:
      readiness:
        enabled: true
        path: /health
        initialDelaySeconds: 5
        periodSeconds: 10
        failureThreshold: 12
      liveness:
        enabled: true
        path: /health
        initialDelaySeconds: 30
        periodSeconds: 20
        failureThreshold: 6
    resources: {}

  templateBuilder:
    # Optional sidecar in cube-master Pod. Enable only when template build is required.
    enabled: false
    privileged: true
    dockerdArgs: []
    resources: {}

cubemastercli:
  # Operational CLI Pod delivered with the chart. It contains the real
  # CubeMaster/cmd/cubemastercli binary only. The chart injects
  # CUBEMASTERCLI_ADDRESS and CUBEMASTERCLI_PORT for convenience; commands
  # still execute the upstream cubemastercli binary with explicit flags.
  enabled: true
  replicas: 1
  podAnnotations: {}
  command: []
  args: []
  env: []
  probes:
    readiness:
      enabled: true
      initialDelaySeconds: 5
      periodSeconds: 10
      failureThreshold: 12
    liveness:
      enabled: true
      initialDelaySeconds: 30
      periodSeconds: 20
      failureThreshold: 6
  resources: {}

webui:
  # One-click enables WebUI by default on host port 12088. In Kubernetes the
  # chart delivers it as a Service on port 12088 and proxies /cubeapi to CubeAPI.
  enabled: true
  replicas: 1
  podAnnotations: {}
  service:
    type: ClusterIP
    port: 12088
    targetPort: 80
    annotations: {}
  # Empty upstream uses the chart-managed CubeAPI Service.
  upstream: ""
  resources: {}

cubeDns:
  # One-click deploys CoreDNS for cube.app / wildcard resolution and lets the
  # compute runtime resolve through a local DNS address. The default Kubernetes
  # mode runs CoreDNS on Cube compute nodes and lets cube-node Pods use
  # 127.0.0.54 explicitly via dnsConfig, without modifying host /etc/resolv.conf.
  enabled: true
  # nodeLocal: DaemonSet on Cube nodes, binds bindAddress. Set answerIP or
  #            cubeProxy.advertiseIP when CubeProxy runs only on control nodes.
  # service:   Deployment + ClusterIP Service for DNS itself. Requires
  #            answerIP or cubeProxy.advertiseIP for cube.app records because
  #            CubeProxy is exposed by control-node hostNetwork.
  mode: nodeLocal
  replicas: 1
  bindAddress: 127.0.0.54
  sandboxGateway:
    # Also bind node-local cube-dns on the compute node HostIP so Cube sandbox
    # guests can use it as their nameserver. The regular cube-node Pod DNS
    # keeps using bindAddress.
    enabled: true
  domain: cube.app
  # Empty answerIP uses cubeProxy.advertiseIP when set. If both are empty in
  # nodeLocal mode, cube-dns returns the local compute HostIP for older local
  # proxy topologies; control-node CubeProxy deployments should set one of them.
  # service mode requires answerIP or cubeProxy.advertiseIP because CubeProxy is
  # not exposed by Service.
  answerIP: ""
  forward:
    # Empty upstreams forwards to /etc/resolv.conf. Set explicit upstreams to
    # avoid forwarding loops in custom clusters.
    upstreams: []
  # Cache TTL (seconds) for CoreDNS responses. Aligned with the 60s TTL emitted
  # by the template plugin so clients do not see stale answers longer than the
  # advertised TTL when the sandbox gateway IP changes.
  cacheTTL: 60
  # Log every DNS query at INFO level. Off by default because compute nodes
  # running many sandboxes emit thousands of queries per minute; enable only
  # when actively debugging DNS resolution.
  logQueries: false
  service:
    type: ClusterIP
    port: 53
    annotations: {}
  resources: {}

diagnostics:
  # One-click ships cube-diag scripts. In Kubernetes the chart exposes an
  # equivalent kubectl-based diagnostic script through a ConfigMap so operators
  # can collect release state without maintaining a second script copy.
  enabled: true

mysql:
  enabled: true
  image:
    repository: mysql
    tag: "8.0"
    pullPolicy: IfNotPresent
  # Empty host installs and uses the chart-managed cube-mysql service.
  # Non-empty host uses the configured third-party MySQL service and skips cube-mysql.
  host: ""
  port: 3306
  database: cube_mvp
  user: cube
  # SECURITY: The default password is committed to a public repository and MUST
  # be overridden for any environment that is not a throwaway local test. In
  # production, provide `mysql.password` and `mysql.rootPassword` via -f
  # secret-values.yaml or --set, or use `mysql.host` to point at an externally
  # managed MySQL. templates/validate.yaml refuses to render when passwords
  # equal the default sentinel below.
  password: CHANGE_ME_MYSQL_PASSWORD
  rootPassword: CHANGE_ME_MYSQL_ROOT_PASSWORD
  persistence:
    enabled: true
    existingClaim: ""
    hostPath: ""
    size: 20Gi
    # Empty falls back to the cluster's default StorageClass. Override to
    # bind the MySQL data PVC to a specific provisioner (e.g. cube-cbs-wffc
    # from values-tke.yaml, or gp3 / pd-ssd / local-path on other clouds).
    storageClassName: ""
    accessModes:
      - ReadWriteOnce
  resources: {}

redis:
  enabled: true
  image:
    repository: redis
    tag: "7-alpine"
    pullPolicy: IfNotPresent
  # Empty host installs and uses the chart-managed cube-redis service.
  # Non-empty host uses the configured third-party Redis service and skips cube-redis.
  host: ""
  port: 6379
  # SECURITY: Override before any non-throwaway deployment. templates/validate.yaml
  # refuses to render when this equals the CHANGE_ME_* sentinel.
  password: CHANGE_ME_REDIS_PASSWORD
  persistence:
    enabled: true
    existingClaim: ""
    hostPath: ""
    size: 10Gi
    # Empty falls back to the cluster's default StorageClass. Override to
    # bind the Redis data PVC to a specific provisioner.
    storageClassName: ""
    accessModes:
      - ReadWriteOnce
  resources: {}

cubeNode:
  enabled: true
  podAnnotations: {}
  updateStrategy:
    type: RollingUpdate

  # How CUBE_SANDBOX_NODE_IP is populated. Currently statusHostIP or static are supported.
  ipSource: statusHostIP
  staticNodeIP: ""

  # Default to the PVM profile so a labelled compute node can be initialized by
  # this chart without an extra values file. cube-node-init fails fast if this
  # value does not match host kvm_pvm state.
  pvmGuestKernel:
    enabled: true

  network:
    # One-click auto-detects the primary NIC and patches Cubelet eth_name.
    autoDetectEthName: true
    # Leave empty to keep auto-detection. Set to pin Cubelet eth_name.
    ethName: ""
    # Leave empty to use packaged Cubelet config.toml CIDR. Set to patch cidr.
    cidr: ""
    cidrSkipConflictCheck: false

  dns:
    useCubeDns: true
    nameserver: 127.0.0.54
    clusterDomain: cluster.local
    sandbox:
      # DNS injected into Cube sandbox guest /etc/resolv.conf. When useCubeDns
      # is true and nameservers is empty, the chart injects the current compute
      # node HostIP so guests use the node-local cube-dns sandboxGateway.
      useCubeDns: true
      nameservers: []
    waitTimeoutSeconds: 120
    checkImage:
      repository: busybox
      tag: "1.36"
      pullPolicy: IfNotPresent

  env: []
  # Sensible default resource requests / limits for the cube-node runtime
  # container. Cube nodes host multiple KVM microVMs and must not be evicted
  # by the scheduler under memory pressure. Downgrade or override in
  # runtime-values.yaml when the workload profile is known.
  resources:
    requests:
      cpu: "500m"
      memory: "1Gi"
    limits:
      memory: "4Gi"

  probes:
    startup:
      enabled: true
      tcpSocketPort: 9999
      # Optional exec probe overriding the TCP check. Set to a shell command
      # list (e.g. ["/bin/sh","-c","cubectl status --local"]) to detect a
      # process that keeps port 9999 open while internally deadlocked.
      exec: []
      periodSeconds: 10
      failureThreshold: 30
    readiness:
      enabled: true
      tcpSocketPort: 9999
      exec: []
      initialDelaySeconds: 10
      periodSeconds: 10
      failureThreshold: 6
    liveness:
      enabled: true
      tcpSocketPort: 9999
      exec: []
      initialDelaySeconds: 60
      periodSeconds: 20
      failureThreshold: 6

cubeProxy:
  # Cube data-plane proxy. When enabled, it is delivered and removed by this
  # chart together with the rest of CubeSandbox.
  #
  # One-click enables CubeProxy by default. This chart follows that behavior
  # and creates a self-signed test certificate unless production TLS is provided.
  enabled: true
  # Public sandbox domain returned by CubeAPI and terminated by CubeProxy.
  # For production, configure DNS for this domain and wildcard subdomains to
  # the CubeProxy entrypoint, for example *.sandbox.example.com.
  domain: cube.app
  podAnnotations: {}
  replicas: 1
  strategy:
    type: RollingUpdate
  # One-click CubeProxy is part of the control-node stack. This chart follows
  # that model and schedules CubeProxy through placement.controlPlane.
  hostNetwork: true
  # IP returned by cube-dns for cube.app / *.cube.app when cubeDns.answerIP is
  # empty. Set this to the selected control node IP, or set cubeDns.answerIP
  # directly when using an external load balancer.
  advertiseIP: ""
  ports:
    http:
      containerPort: 80
      hostPort: ""
    https:
      containerPort: 443
      hostPort: ""
  redis:
    # Empty host uses redis.host or chart-managed cube-redis.
    host: ""
    port: ""
    db: 0
  timeout:
    min: 500
    max: 700
  tls:
    # CubeProxy nginx.conf expects these file names inside the container:
    #   /usr/local/openresty/nginx/certs/cube.app+3.pem
    #   /usr/local/openresty/nginx/certs/cube.app+3-key.pem
    #
    # Supported modes:
    #   existingSecret - production. The operator provides a TLS Secret.
    #   certManager    - chart creates a cert-manager.io/v1 Certificate.
    #   selfSigned     - chart creates a self-signed certificate Secret; test only.
    #   inline         - chart creates a Secret from tls.cert/tls.key values.
    mode: selfSigned
    # Optional for certManager/selfSigned/inline. Defaults to <release>-proxy-certs.
    secretName: ""
    existingSecret: ""
    certSecretKey: tls.crt
    keySecretKey: tls.key
    caSecretKey: ca.crt
    certManager:
      issuerRef:
        group: cert-manager.io
        kind: ClusterIssuer
        name: ""
      commonName: ""
      dnsNames: []
      ipAddresses: []
      duration: ""
      renewBefore: ""
      usages:
        - digital signature
        - key encipherment
        - server auth
    selfSigned:
      commonName: ""
      dnsNames:
        - cube.app
        - "*.cube.app"
        - localhost
      ipAddresses:
        - 127.0.0.1
      caValidityDays: 3650
      certValidityDays: 3650
    # Used only when tls.mode=inline.
    cert: ""
    key: ""
  sidecar:
    # CubeProxy image starts cube-proxy-sidecar from CubeProxy/Dockerfile.
    # These values wire it to Kubernetes Services instead of the one-click
    # loopback defaults.
    listenAddr: 127.0.0.1:8083
    proxyAdminURLs:
      - http://127.0.0.1:8082
    defaultIdleTimeout: 5m
    lastActivePoll: 5s
    idleSweepInterval: 5s
    bootstrapWarmup: 30s
    stateLockTTL: 60s
    # Leave empty until CubeProxy nginx admin server also has token injection.
    adminToken: ""
  resolver:
    # CubeProxy nginx Lua Redis client needs an nginx resolver when Redis is
    # configured by DNS name (the default Kubernetes Service DNS name).
    # Empty addresses auto-discovers nameservers from the Pod /etc/resolv.conf.
    addresses: []
    valid: 30s
    timeout: 5s
    ipv6: false
  probes:
    readiness:
      enabled: true
      path: /admin/healthz
      port: 8082
      initialDelaySeconds: 5
      periodSeconds: 10
      failureThreshold: 6
    liveness:
      enabled: true
      path: /admin/healthz
      port: 8082
      initialDelaySeconds: 30
      periodSeconds: 20
      failureThreshold: 6
  logs:
    hostPath: /data/log/cube-proxy
  resources: {}

cubeEgress:
  # Transparent outbound egress/MITM data-plane component. When enabled, the
  # Cube Node Big Pod gets a cube-egress sidecar and a cube-egress-net helper
  # sidecar that owns host TPROXY iptables/ip-rule state.
  enabled: true
  bootstrapURL: http://127.0.0.1:19090/v1/policies/dump
  debugDump: false
  ca:
    # Supported modes:
    #   selfSigned     - chart creates/reuses a release-scoped CA Secret.
    #   existingSecret - operator provides cube-root-ca.* and placeholder.*.
    #   inline         - chart creates a Secret from the inline PEM values.
    mode: selfSigned
    secretName: ""
    existingSecret: ""
    rootCertKey: cube-root-ca.crt
    rootKeyKey: cube-root-ca.key
    placeholderCertKey: placeholder.crt
    placeholderKeyKey: placeholder.key
    selfSigned:
      caCommonName: CubeSandbox Egress MITM CA
      placeholderCommonName: cube-proxy-placeholder
      caValidityDays: 3650
      placeholderValidityDays: 36500
    inline:
      rootCert: ""
      rootKey: ""
      placeholderCert: ""
      placeholderKey: ""
  network:
    enabled: true
    ingressInterface: cube-dev
    tproxyOnIP: 192.168.0.1
    initialWaitSeconds: 300
    reapplyIntervalSeconds: 30
    probes:
      readiness:
        enabled: true
        initialDelaySeconds: 10
        periodSeconds: 10
        failureThreshold: 30
      liveness:
        enabled: true
        initialDelaySeconds: 330
        periodSeconds: 20
        failureThreshold: 6
  probes:
    readiness:
      enabled: true
      path: /admin/v1/health
      port: 9090
      initialDelaySeconds: 5
      periodSeconds: 10
      failureThreshold: 12
    liveness:
      enabled: true
      path: /admin/v1/health
      port: 9090
      initialDelaySeconds: 30
      periodSeconds: 20
      failureThreshold: 6
  # Sidecar resource defaults. Guarantees each cube-egress instance gets a
  # baseline slice of CPU/Mem so it is not evicted before the main cube-node
  # container under memory pressure. Tune for actual sandbox traffic volume.
  resources:
    requests:
      cpu: "100m"
      memory: "128Mi"
    limits:
      memory: "512Mi"
  netResources:
    requests:
      cpu: "50m"
      memory: "64Mi"
    limits:
      memory: "128Mi"

bootstrap:
  pvmHostKernel:
    enabled: true
    desiredKernelPattern: pvm.host
    # KPTI (Kernel Page-Table Isolation) is disabled here because kvm_pvm on the
    # CubeSandbox host kernel does not currently support KPTI and boot fails
    # when it is on. This is a deliberate performance/compatibility choice for
    # a sandbox-workload host that runs KVM microVMs behind hardware isolation
    # (guest kernel + KVM boundary already contains the sandbox process).
    # SECURITY TRADE-OFF: the host is more exposed to Meltdown/Spectre-family
    # side-channel primitives running on the same host (e.g. other CubeSandbox
    # sidecars). If the host also runs untrusted workloads outside of PVM
    # guests, override bootArgs (drop "nopti pti=off") after confirming that
    # kvm_pvm on your kernel supports KPTI.
    bootArgs: "nopti pti=off"
    package:
      # image: rpm/deb is baked into cube-pvm-host-bootstrap image under /artifacts.
      # production delivery should use image and normal registry pulls.
      source: image
      rpmPath: /artifacts/kernel-pvm-host.rpm
      debPath: /artifacts/linux-image-pvm-host.deb
      rpmUrl: ""
      debUrl: ""
      sha256: ""
    reboot:
      enabled: true
      coordinated: true
      leaseName: cube-node-pvm-bootstrap
      leaseTTLSeconds: 900
      maxConcurrent: 1
      maxCount: 1

  nodeInit:
    enabled: true
    requireKVM: true
    requireXFS: true
    chmodKVM: true
    loadKVMModule: true
    writeUdevRule: true
    createHostDirs: true
    checkMasterConnectivity: true
    checkMemory: true
    minMemoryKB: "7500000"
    checkCgroupCPU: true
    checkGlibc: true
    checkCIDR: true
    checkCubecowDeps: true
    dataCubelet:
      path: /data/cubelet
      loopback:
        enabled: true
        imagePath: /data/cubelet-xfs.img
        size: 25G

security:
  hostNetwork: true
  hostPID: true
  privileged: true

hostPaths:
  root: /
  dev: /dev
  sys: /sys
  libModules: /lib/modules
  dataCubelet: /data/cubelet
  dataLog: /data/log
  dataCubeShim: /data/cube-shim
  dataSnapshotPack: /data/snapshot_pack
  tmpCube: /tmp/cube

serviceAccount:
  create: true
  annotations: {}

rbac:
  create: true

helmTest:
  enabled: true
  image:
    repository: curlimages/curl
    tag: "8.10.1"
    pullPolicy: IfNotPresent
  dnsImage:
    repository: busybox
    tag: "1.36"
    pullPolicy: IfNotPresent
