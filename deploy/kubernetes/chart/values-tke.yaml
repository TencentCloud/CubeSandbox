# Tencent Cloud TKE preset overrides.
#
# Merge on top of the default chart values with:
#   helm upgrade --install cube ./deploy/kubernetes/chart \
#     -f deploy/kubernetes/chart/values-tke.yaml \
#     -f runtime-values.yaml   # your own passwords / advertiseIP / TLS
#
# What this file does compared to values.yaml defaults:
#   1. Provisions a chart-owned CBS StorageClass named "cube-cbs-wffc" and
#      pins CubeMaster / MySQL / Redis / MinIO PVCs to it.
#   2. Uses WaitForFirstConsumer volume binding so multi-AZ TKE clusters
#      create CBS disks in the same AZ as the scheduled Pod.
#   3. Exposes CubeProxy via a TKE CLB (LoadBalancer Service) and disables
#      chart Ingress. qcloud Ingress is L7 and only accepts NodePort/LB
#      backends; NodePort is a poor fit for TLS-in-CubeProxy. Point
#      cube.app / *.cube.app DNS at the Service EXTERNAL-IP instead.
#   4. Sets TKE CLB Service annotations for security-group binding. The
#      security-groups value defaults to CHANGE_ME_TKE_CLB_SECURITY_GROUP;
#      helm fails render until you override it in a local values file (or
#      set it to "" if you manage CLB SGs outside Helm).
#   5. Uses a cubevs/sandbox CIDR (10.187.0.0/18) that stays clear of the
#      ranges this repo's one-click Terraform provisions for TKE — VPC
#      10.0.0.0/16 (hard-coded in main.tf), Pod CIDR 10.200.0.0/16 and
#      Service CIDR 192.168.0.0/20 (defaults in variables.tf). cube-node
#      installs a host route to the cubevs bridge, so a cubevs range that
#      swallows the Service CIDR routes every ClusterIP (cube-ops:3010,
#      cube-master:8089, kube-dns:53, ...) into the bridge on hostNetwork
#      compute nodes. The cubevs-cidr-preflight Hook catches that and fails
#      the install; this preset is chosen so a cluster built from that
#      Terraform does not trip it.
#      See the cubeNode.network / cubeEgress.network sections below. No
#      cubevs range can be non-overlapping for every cluster — the TKE
#      Service CIDR is operator-configurable and spans the private ranges —
#      so override in your runtime values if your Service CIDR, VPC or host
#      LAN covers 10.187.0.0/18 (10.187.x) — including your Pod/CNI CIDR,
#      which the preflight Hook does not inspect.
#
# Nothing else about the release is TKE-specific — Cube-owned images default
# to TCR int (cube-sandbox-int.tencentcloudcr.com/cube-sandbox/...). Users in
# mainland China should add `-f values-cn.yaml` so pulls use TCR cn.

storageClass:
  create: true
  name: cube-cbs-wffc
  provisioner: com.tencent.cloud.csi.cbs
  reclaimPolicy: Delete
  volumeBindingMode: WaitForFirstConsumer
  parameters:
    type: cbs

controlPlane:
  master:
    persistence:
      storageClassName: cube-cbs-wffc

mysql:
  persistence:
    storageClassName: cube-cbs-wffc

redis:
  persistence:
    storageClassName: cube-cbs-wffc

minio:
  persistence:
    storageClassName: cube-cbs-wffc

# cubeOps no longer uses a warehouse PVC. replicas > 1 is safe with
# RollingUpdate (default). To enable the warehouse against COS, set
# cubeOps.s3 (volumeS3.endpoint / inline AK/SK may supply the connection;
# volumeS3.existingSecret is volume-s3.conf and is not a CubeOps credential).
# Set nodeEndpoint when compute nodes sit outside cluster DNS.
# cubeOps:
#   replicas: 2
#   s3:
#     endpoint: https://cos.ap-guangzhou.myqcloud.com
#     nodeEndpoint: https://cos.ap-guangzhou.myqcloud.com
#     bucket: cube-ops
#     region: ap-guangzhou
#     pathStyle: false
#     existingSecret: my-cubeops-s3   # keys: s3-access-key-id / s3-secret-access-key
#     # or inline: accessKeyId / secretAccessKey

# cubevs/sandbox CIDR must not overlap the cluster Service CIDR — that is the
# case the cubevs-cidr-preflight Hook guards, and under hostNetwork the only
# one that also breaks the node's own traffic. 10.187.0.0/18 is clear of the
# ranges this repo's TKE Terraform provisions (VPC 10.0.0.0/16, Pod CIDR
# 10.200.0.0/16, Service CIDR 192.168.0.0/20), so the default TKE path passes
# the preflight. The Service CIDR is operator-configurable, so this is a
# default, not a guarantee: override in your runtime values if your Service
# CIDR, VPC, Pod/CNI CIDR or host LAN covers 10.187.x. tproxyOnIP is the cube-dev gateway =
# first usable IP of cubeNode.network.cidr — keep the two in sync.
cubeNode:
  network:
    cidr: "10.187.0.0/18"
cubeEgress:
  network:
    tproxyOnIP: "10.187.0.1"

cubeProxy:
  service:
    type: LoadBalancer
    # TKE CLB annotations. Override security-groups in your runtime values —
    # do not commit real SG ids into this preset. Helm refuses to render while
    # the CHANGE_ME_* sentinel remains
    #
    # Example runtime override:
    #   cubeProxy:
    #     service:
    #       annotations:
    #         service.cloud.tencent.com/security-groups: "sg-xxxxxxxx"
    #         # multiple: "sg-aaa,sg-bbb"
    #   # Or clear if you manage CLB SGs outside Helm:
    #   #     service.cloud.tencent.com/security-groups: ""
    annotations:
      # CLB → backend default pass-through; pair with security-groups below.
      # See: https://cloud.tencent.com/document/product/457/51258
      service.cloud.tencent.com/pass-to-target: "true"
      # Expose HTTP, HTTPS, and plaintext gRPC (9090) as TCP on the CLB.
      service.cloud.tencent.com/specify-protocol: '{"80":{"protocol":["TCP"]},"443":{"protocol":["TCP"]},"9090":{"protocol":["TCP"]}}'
      # REPLACE via -f override with your VPC security group id(s).
      service.cloud.tencent.com/security-groups: "CHANGE_ME_TKE_CLB_SECURITY_GROUP"
  ingress:
    enabled: false
