{{- $computeSelector := .Values.placement.compute.nodeSelector -}}
{{- $controlPlaneSelector := .Values.placement.controlPlane.nodeSelector -}}
{{- if and .Values.controlPlane.enabled (not $controlPlaneSelector) }}
{{- fail "controlPlane.enabled=true requires placement.controlPlane.nodeSelector" }}
{{- end }}
{{- if .Values.cubeNode.enabled }}
{{- if not $computeSelector }}
{{- fail "cube-node requires placement.compute.nodeSelector, otherwise host-mutating bootstrap may run on all nodes" }}
{{- end }}
{{- $pvmSelector := ((.Values.placement).pvm).nodeSelector | default dict -}}
{{- if .Values.bootstrap.pvmHostKernel.enabled }}
{{- if not (hasKey $pvmSelector "cube.tencent.com/allow-pvm-bootstrap") }}
{{- fail "bootstrap.pvmHostKernel.enabled=true requires placement.pvm.nodeSelector to include cube.tencent.com/allow-pvm-bootstrap=true (PVM DaemonSet only; keep it out of placement.compute so non-PVM nodes skip the PVM image)" }}
{{- end }}
{{- $allowPvmRaw := index $pvmSelector "cube.tencent.com/allow-pvm-bootstrap" -}}
{{- if or (not (kindIs "string" $allowPvmRaw)) (ne $allowPvmRaw "true") }}
{{- fail (printf "placement.pvm.nodeSelector[cube.tencent.com/allow-pvm-bootstrap] must be the YAML string \"true\" (got %T %v)" $allowPvmRaw $allowPvmRaw) }}
{{- end }}
{{- if hasKey $computeSelector "cube.tencent.com/allow-pvm-bootstrap" }}
{{- fail "placement.compute.nodeSelector must not include cube.tencent.com/allow-pvm-bootstrap; that label belongs only in placement.pvm.nodeSelector" }}
{{- end }}
{{- $gate := .Values.bootstrap.pvmHostKernel.startupGate -}}
{{- if $gate.enabled }}
{{- if ne ($gate.effect | default "") "NoSchedule" }}
{{- fail "bootstrap.pvmHostKernel.startupGate.effect must be NoSchedule" }}
{{- end }}
{{- if ne ($gate.manager | default "") "script" }}
{{- fail "bootstrap.pvmHostKernel.startupGate.manager must be script" }}
{{- end }}
{{- if ne ($gate.taintKey | default "") "cube.tencent.com/pvm-not-ready" }}
{{- fail "bootstrap.pvmHostKernel.startupGate.taintKey is a fixed cluster-wide contract and must be cube.tencent.com/pvm-not-ready" }}
{{- end }}
{{- if not $gate.requirePreflight }}
{{- fail "startupGate.enabled=true requires startupGate.requirePreflight=true; the Helm hook closes the first-install scheduling window" }}
{{- end }}
{{- if and (not $gate.priorityClassCreate) (not ($gate.priorityClassName | default "")) }}
{{- fail "startupGate.priorityClassCreate=false requires startupGate.priorityClassName to reference an existing PriorityClass" }}
{{- end }}
{{- end }}
{{- end }}
{{- if and (eq (.Values.cubeNode.nodeIDSource | default "specNodeName") "static") (not .Values.cubeNode.staticNodeID) }}
{{- fail "cubeNode.nodeIDSource=static requires cubeNode.staticNodeID" }}
{{- end }}
{{- if and .Values.bootstrap.pvmHostKernel.enabled (not .Values.cubeNode.pvmGuestKernel.enabled) }}
{{- fail "bootstrap.pvmHostKernel.enabled=true requires cubeNode.pvmGuestKernel.enabled=true to match one-click CUBE_PVM_ENABLE consistency" }}
{{- end }}
{{- end }}
{{- if .Values.externalControlPlane.enabled }}
{{- if not .Values.externalControlPlane.masterEndpoint }}
{{- fail "externalControlPlane.enabled=true requires externalControlPlane.masterEndpoint" }}
{{- end }}
{{- if not .Values.externalControlPlane.opsEndpoint }}
{{- fail "externalControlPlane.enabled=true requires externalControlPlane.opsEndpoint" }}
{{- end }}
{{- end }}
{{- if and .Values.cubeNode.enabled (not .Values.controlPlane.enabled) (not .Values.externalControlPlane.enabled) }}
{{- fail "cubeNode.enabled=true with controlPlane.enabled=false requires externalControlPlane.enabled=true" }}
{{- end }}
{{- if and .Values.cubeNode.enabled .Values.controlPlane.enabled (ne (include "cube.opsEnabled" .) "true") }}
{{- fail "cubeNode.enabled=true requires cubeOps.enabled=true (cubelet registers with CubeOps)" }}
{{- end }}
{{- if and .Values.cubeNode.enabled (not .Values.images.waitNodePrep.repository) }}
{{- fail "cubeNode.enabled=true requires images.waitNodePrep.repository (Big Pod wait-node-prep initContainer)" }}
{{- end }}
{{- if and .Values.cubeNode.enabled (not .Values.images.cubeAgent.repository) }}
{{- fail "cubeNode.enabled=true requires images.cubeAgent.repository (installer stages cube-agent.ext4)" }}
{{- end }}
{{- if hasKey (.Values.images | default dict) "pause" }}
{{- fail "images.pause was removed; Big Pod placeholder slots (cube-slot-*) are gone. Remove images.pause from your values." }}
{{- end }}
{{- if hasKey (.Values.cubeNode | default dict) "placeholderSlots" }}
{{- fail "cubeNode.placeholderSlots was removed; Big Pod no longer reserves cube-slot-1..6. Remove cubeNode.placeholderSlots from your values." }}
{{- end }}
{{- if hasKey .Values.security "hostNetwork" }}
{{- fail "security.hostNetwork was removed; cube-node always runs on the Pod network. Remove security.hostNetwork from your values." }}
{{- end }}
{{- if hasKey .Values.cubeNode "useAdvancedDaemonSet" }}
{{- fail "cubeNode.useAdvancedDaemonSet was removed; cube-node uses a native apps/v1 DaemonSet. Remove cubeNode.useAdvancedDaemonSet from your values." }}
{{- end }}
{{- $nodeRolling := (((.Values.cubeNode).updateStrategy).rollingUpdate) | default dict -}}
{{- if hasKey $nodeRolling "rollingUpdateType" }}
{{- fail "cubeNode.updateStrategy.rollingUpdate.rollingUpdateType was removed; cube-node is a native apps/v1 DaemonSet. Remove rollingUpdateType from your values." }}
{{- end }}
{{- $installerRolling := (((.Values.cubeNodeInstaller).updateStrategy).rollingUpdate) | default dict -}}
{{- if hasKey $installerRolling "rollingUpdateType" }}
{{- fail "cubeNodeInstaller.updateStrategy.rollingUpdate.rollingUpdateType was removed; cube-node-installer is a native apps/v1 DaemonSet. Remove rollingUpdateType from your values." }}
{{- end }}
{{- $bootstrapRolling := (((.Values.cubeNodeBootstrap).updateStrategy).rollingUpdate) | default dict -}}
{{- if hasKey $bootstrapRolling "rollingUpdateType" }}
{{- fail "cubeNodeBootstrap.updateStrategy.rollingUpdate.rollingUpdateType was removed; cube-node-bootstrap is a native apps/v1 DaemonSet. Remove rollingUpdateType from your values." }}
{{- end }}
{{- $pvmRolling := (((.Values.cubeNodePvm).updateStrategy).rollingUpdate) | default dict -}}
{{- if hasKey $pvmRolling "rollingUpdateType" }}
{{- fail "cubeNodePvm.updateStrategy.rollingUpdate.rollingUpdateType was removed; cube-node-pvm is a native apps/v1 DaemonSet. Remove rollingUpdateType from your values." }}
{{- end }}
{{- /* Trigger database.driver validation (invalid values fail inside the helper). */ -}}
{{- $_ := include "cube.dbDriver" . -}}
{{- $controlPlaneNeedsMysql := and .Values.controlPlane.enabled (or .Values.controlPlane.master.enabled .Values.controlPlane.api.enabled) -}}
{{- if and (eq (include "cube.dbDriver" .) "postgres") (eq (include "cube.dbHostRaw" .) "") }}
{{- fail "database.driver=postgres requires postgres.host (the chart-managed MySQL StatefulSet cannot serve PostgreSQL)" }}
{{- end }}
{{- if and $controlPlaneNeedsMysql (not (eq (include "cube.mysqlBuiltinEnabled" .) "true")) (eq (include "cube.dbHostRaw" .) "") }}
{{- fail "control plane requires mysql.host when mysql.enabled=false" }}
{{- end }}
{{- if and (eq (include "cube.mysqlBuiltinEnabled" .) "true") (or (hasPrefix "CHANGE_ME" (include "cube.dbPassword" .)) (hasPrefix "CHANGE_ME" (include "cube.dbRootPassword" .))) }}
{{- fail "mysql.password / mysql.rootPassword still equal the CHANGE_ME_* default sentinel. Override them before deploying (or set mysql.host to use an external MySQL)." }}
{{- end }}
{{- if and (ne (include "cube.dbHostRaw" .) "") (hasPrefix "CHANGE_ME" (include "cube.dbPassword" .)) }}
{{- fail (printf "%s.password still equals the CHANGE_ME_* default sentinel. Override it when connecting to an external database." (include "cube.dbDriver" .)) }}
{{- end }}
{{- $controlPlaneNeedsRedis := and .Values.controlPlane.enabled .Values.controlPlane.master.enabled -}}
{{- if eq (include "cube.redisSentinelEnabled" .) "true" }}
{{- if eq (include "cube.redisSentinelEndpointCount" .) "0" }}
{{- fail "redis.masterName requires redis.sentinelNodes with at least one non-empty host:port endpoint" }}
{{- end }}
{{- if ne (((.Values.redis).host) | default "") "" }}
{{- fail "redis.masterName (Sentinel mode) cannot be combined with redis.host; leave redis.host empty" }}
{{- end }}
{{- end }}
{{- if and (ne (include "cube.redisSentinelEndpointCount" .) "0") (ne (include "cube.redisSentinelEnabled" .) "true") }}
{{- fail "redis.sentinelNodes requires redis.masterName" }}
{{- end }}
{{- if and $controlPlaneNeedsRedis (not (eq (include "cube.redisBuiltinEnabled" .) "true")) (not .Values.redis.host) (ne (include "cube.redisSentinelEnabled" .) "true") }}
{{- fail "control plane master requires redis.host or redis.masterName when redis.enabled=false" }}
{{- end }}
{{- if and (or (eq (include "cube.redisBuiltinEnabled" .) "true") .Values.redis.host (eq (include "cube.redisSentinelEnabled" .) "true")) (hasPrefix "CHANGE_ME" (default "" .Values.redis.password)) }}
{{- fail "redis.password still equals the CHANGE_ME_* default sentinel. Override it before deploying." }}
{{- end }}
{{- /* Fixed Service nodePorts are only valid for NodePort / LoadBalancer. */ -}}
{{- $apiSvcType := .Values.controlPlane.api.service.type | default "ClusterIP" -}}
{{- $apiNodePort := .Values.controlPlane.api.service.nodePort | default "" | toString -}}
{{- if and (ne $apiNodePort "") (not (has $apiSvcType (list "NodePort" "LoadBalancer"))) }}
{{- fail (printf "controlPlane.api.service.nodePort requires service.type NodePort or LoadBalancer (got %s)" $apiSvcType) }}
{{- end }}
{{- if ne $apiNodePort "" }}
{{- $apiNP := $apiNodePort | int -}}
{{- if or (lt $apiNP 30000) (gt $apiNP 32767) }}
{{- fail (printf "controlPlane.api.service.nodePort must be in 30000-32767 (got %v)" $apiNodePort) }}
{{- end }}
{{- end }}
{{- if eq (include "cube.proxyEnabled" .) "true" }}
{{- if not $controlPlaneSelector }}
{{- fail "cubeProxy.enabled=true requires placement.controlPlane.nodeSelector because CubeProxy runs on control nodes" }}
{{- end }}
{{- if and (not (eq (include "cube.redisBuiltinEnabled" .) "true")) (not .Values.redis.host) (ne (include "cube.redisSentinelEnabled" .) "true") (not .Values.cubeProxy.redis.host) }}
{{- fail "cubeProxy.enabled=true requires redis.host, redis.masterName, or cubeProxy.redis.host when redis.enabled=false" }}
{{- end }}
{{- if not (has .Values.cubeProxy.tls.mode (list "existingSecret" "certManager" "selfSigned" "inline")) }}
{{- fail "cubeProxy.tls.mode must be one of: existingSecret, certManager, selfSigned, inline" }}
{{- end }}
{{- if and (eq .Values.cubeProxy.tls.mode "existingSecret") (not .Values.cubeProxy.tls.existingSecret) }}
{{- fail "cubeProxy.tls.mode=existingSecret requires cubeProxy.tls.existingSecret" }}
{{- end }}
{{- if and (eq .Values.cubeProxy.tls.mode "inline") (or (not .Values.cubeProxy.tls.cert) (not .Values.cubeProxy.tls.key)) }}
{{- fail "cubeProxy.tls.mode=inline requires both cubeProxy.tls.cert and cubeProxy.tls.key" }}
{{- end }}
{{- if and (eq .Values.cubeProxy.tls.mode "certManager") (not .Values.cubeProxy.tls.certManager.issuerRef.name) }}
{{- fail "cubeProxy.tls.mode=certManager requires cubeProxy.tls.certManager.issuerRef.name" }}
{{- end }}
{{- $clbSecurityGroups := index (default dict .Values.cubeProxy.service.annotations) "service.cloud.tencent.com/security-groups" | default "" -}}
{{- if and (eq (.Values.cubeProxy.service.type | default "ClusterIP") "LoadBalancer") (hasPrefix "CHANGE_ME" $clbSecurityGroups) }}
{{- fail "cubeProxy.service.annotations[\"service.cloud.tencent.com/security-groups\"] still equals the CHANGE_ME_* sentinel from values-tke.yaml. Override it with your VPC security group id(s) (comma-separated), or set it to \"\" if you manage CLB security groups outside Helm." }}
{{- end }}
{{- $proxySvcType := .Values.cubeProxy.service.type | default "ClusterIP" -}}
{{- $proxyNodePorts := ((.Values.cubeProxy).service).nodePorts | default dict -}}
{{- $proxyNodePortKeys := list "http" "https" "grpc" "admin" -}}
{{- range $name, $raw := $proxyNodePorts }}
{{- if not (has $name $proxyNodePortKeys) }}
{{- fail (printf "cubeProxy.service.nodePorts.%s is not supported; allowed keys: http, https, grpc, admin" $name) }}
{{- end }}
{{- $npStr := $raw | default "" | toString -}}
{{- if ne $npStr "" }}
{{- if not (has $proxySvcType (list "NodePort" "LoadBalancer")) }}
{{- fail (printf "cubeProxy.service.nodePorts.%s requires service.type NodePort or LoadBalancer (got %s)" $name $proxySvcType) }}
{{- end }}
{{- $np := $npStr | int -}}
{{- if or (lt $np 30000) (gt $np 32767) }}
{{- fail (printf "cubeProxy.service.nodePorts.%s must be in 30000-32767 (got %v)" $name $raw) }}
{{- end }}
{{- end }}
{{- end }}
{{- if hasKey .Values.cubeProxy "sidecar" }}
{{- fail "cubeProxy.sidecar was removed; lifecycle coordination is handled by lifecycleManager (cube-lifecycle-manager). Remove cubeProxy.sidecar from your values." }}
{{- end }}
{{- if hasKey .Values.cubeProxy "hostNetwork" }}
{{- fail "cubeProxy.hostNetwork was removed; CubeProxy always runs on the Pod network behind its Service (ClusterIP / NodePort / LoadBalancer; Ingress optional). Remove cubeProxy.hostNetwork from your values." }}
{{- end }}
{{- if and .Values.lifecycleManager.adminToken (lt (len .Values.lifecycleManager.adminToken) 16) }}
{{- fail "lifecycleManager.adminToken must be empty for auto-generation or at least 16 characters when explicitly set" }}
{{- end }}
{{- if and .Values.cubeProxy.configureClusterDNS (eq (include "cube.proxyEnabled" .) "true") (not .Values.cubeProxy.domain) }}
{{- fail "cubeProxy.configureClusterDNS=true requires cubeProxy.domain" }}
{{- end }}
{{- if and .Values.cubeProxy.ingress.enabled (not .Values.cubeProxy.domain) (not .Values.cubeProxy.ingress.hosts) }}
{{- fail "cubeProxy.ingress.enabled=true requires cubeProxy.domain or cubeProxy.ingress.hosts" }}
{{- end }}
{{- if ne (include "cube.lifecycleManagerEnabled" .) "true" }}
{{- fail "cubeProxy.enabled=true requires lifecycleManager.enabled=true (cube-lifecycle-manager replaces the obsolete cube-proxy-sidecar)" }}
{{- end }}
{{- if eq (include "cube.lifecycleManagerEnabled" .) "true" }}
{{- $leaderElection := .Values.lifecycleManager.leaderElection | default dict -}}
{{- if $leaderElection.enabled }}
{{- if lt (int .Values.lifecycleManager.replicas) 2 }}
{{- fail "lifecycleManager.leaderElection.enabled=true requires lifecycleManager.replicas>=2" }}
{{- end }}
{{- if or (empty $leaderElection.leaseTTL) (empty $leaderElection.renewInterval) (empty $leaderElection.retryInterval) }}
{{- fail "lifecycleManager.leaderElection.enabled=true requires leaseTTL, renewInterval, and retryInterval" }}
{{- end }}
{{- end }}
{{- if not (include "cube.masterEndpoint" .) }}
{{- fail "lifecycleManager.enabled=true requires a CubeMaster endpoint (controlPlane.master or externalControlPlane.masterEndpoint)" }}
{{- end }}
{{- if and (not (eq (include "cube.redisBuiltinEnabled" .) "true")) (not .Values.redis.host) (ne (include "cube.redisSentinelEnabled" .) "true") (not .Values.lifecycleManager.redis.host) (not .Values.cubeProxy.redis.host) }}
{{- fail "lifecycleManager.enabled=true requires redis.host, redis.masterName, lifecycleManager.redis.host, or cubeProxy.redis.host when redis.enabled=false" }}
{{- end }}
{{- if not .Values.images.lifecycleManager.repository }}
{{- fail "lifecycleManager.enabled=true requires images.lifecycleManager.repository" }}
{{- end }}
{{- end }}
{{- end }}
{{- if and .Values.webui.enabled .Values.controlPlane.enabled (ne (include "cube.opsEnabled" .) "true") }}
{{- fail "webui.enabled=true requires cubeOps.enabled=true (WebUI proxies /opsapi and SDK paths to CubeOps)" }}
{{- end }}
{{- if eq (include "cube.opsEnabled" .) "true" }}
{{- if not (include "cube.masterEndpoint" .) }}
{{- fail "cubeOps.enabled=true requires a CubeMaster endpoint (controlPlane.master or externalControlPlane.masterEndpoint)" }}
{{- end }}
{{- if not .Values.images.ops.repository }}
{{- fail "cubeOps.enabled=true requires images.ops.repository" }}
{{- end }}
{{- end }}
{{- if .Values.cubeEgress.enabled }}
{{- if not (has .Values.cubeEgress.ca.mode (list "existingSecret" "selfSigned" "inline")) }}
{{- fail "cubeEgress.ca.mode must be one of: existingSecret, selfSigned, inline" }}
{{- end }}
{{- if and (eq .Values.cubeEgress.ca.mode "existingSecret") (not .Values.cubeEgress.ca.existingSecret) }}
{{- fail "cubeEgress.ca.mode=existingSecret requires cubeEgress.ca.existingSecret" }}
{{- end }}
{{- if and (eq .Values.cubeEgress.ca.mode "inline") (or (not .Values.cubeEgress.ca.inline.rootCert) (not .Values.cubeEgress.ca.inline.rootKey) (not .Values.cubeEgress.ca.inline.placeholderCert) (not .Values.cubeEgress.ca.inline.placeholderKey)) }}
{{- fail "cubeEgress.ca.mode=inline requires rootCert, rootKey, placeholderCert, and placeholderKey" }}
{{- end }}
{{- if and .Values.cubeEgress.network.enabled (not .Values.cubeEgress.network.ingressInterface) }}
{{- fail "cubeEgress.network.enabled=true requires cubeEgress.network.ingressInterface" }}
{{- end }}
{{- end }}
{{- if .Values.volumeCos.enabled }}
{{- if and (not .Values.volumeCos.existingSecret) (or (not .Values.volumeCos.secretId) (not .Values.volumeCos.secretKey) (not .Values.volumeCos.bucket)) }}
{{- fail "volumeCos.enabled=true requires volumeCos.existingSecret or volumeCos.secretId/secretKey/bucket" }}
{{- end }}
{{- end }}
{{- $volumeS3 := default dict .Values.volumeS3 -}}
{{- if and (eq (include "cube.minioBuiltinEnabled" .) "true") (eq (include "cube.volumeS3UserProvided" .) "true") }}
{{- fail "minio.enabled and volumeS3.endpoint/existingSecret are mutually exclusive; set minio.enabled=false to use an external S3 backend (volumeS3 is the plugin source of truth)" }}
{{- end }}
{{- if and (eq (include "cube.volumeS3UserProvided" .) "true") (not $volumeS3.existingSecret) (or (not $volumeS3.accessKeyId) (not $volumeS3.secretAccessKey) (not $volumeS3.bucket)) }}
{{- fail "volumeS3.endpoint requires volumeS3.existingSecret or volumeS3.accessKeyId/secretAccessKey/bucket" }}
{{- end }}
{{- if and (eq (include "cube.minioBuiltinEnabled" .) "true") .Values.minio.rootPassword (lt (len (printf "%s" .Values.minio.rootPassword)) 8) }}
{{- fail "minio.rootPassword must be at least 8 characters when set (leave empty to generate one)" }}
{{- end }}
{{- if eq (include "cube.s3lvolEnabled" .) "true" }}
{{- if not ((.Values.images.cubeS3lvol).repository) }}
{{- fail "cubeS3lvol.enabled=true requires images.cubeS3lvol.repository" }}
{{- end }}
{{- $s3lvolBucket := include "cube.s3lvolEffectiveBucket" . }}
{{- if eq $s3lvolBucket "cube-volumes" }}
{{- fail "cubeS3lvol must not share the S3 volume plugin bucket (cube-volumes); set cubeS3lvol.s3.bucket" }}
{{- end }}
{{- $volBucket := ((.Values.volumeS3).bucket) | default "" }}
{{- if and (ne $volBucket "") (eq $s3lvolBucket $volBucket) }}
{{- fail "cubeS3lvol.s3.bucket must not equal volumeS3.bucket; cube-s3lvol must use its own bucket" }}
{{- end }}
{{- $s3lvolS3 := default dict ((.Values.cubeS3lvol).s3) }}
{{- if eq (($s3lvolS3.existingSecret) | default "") "" }}
{{- if eq (include "cube.s3lvolEffectiveEndpoint" .) "" }}
{{- fail "cubeS3lvol.enabled=true requires cubeS3lvol.s3.endpoint, volumeS3.endpoint, cubeS3lvol.s3.existingSecret, or chart MinIO" }}
{{- end }}
{{- if ne (include "cube.s3lvolHasResolvedCreds" .) "true" }}
{{- fail "cubeS3lvol.enabled=true requires S3 credentials: cubeS3lvol.s3.existingSecret, cubeS3lvol.s3.accessKeyId+secretAccessKey, volumeS3.accessKeyId+secretAccessKey, or chart MinIO" }}
{{- end }}
{{- $s3lvolQuoteCheck := list ($s3lvolS3.accessKeyId | default "") ($s3lvolS3.secretAccessKey | default "") ($s3lvolS3.bucket | default "cube-s3lvol") }}
{{- range $s3lvolQuoteCheck }}
{{- if contains "\"" (. | toString) }}
{{- fail "cubeS3lvol.s3 values must not contain double quotes (s3.cfg is double-quoted TOML)" }}
{{- end }}
{{- end }}
{{- end }}
{{- end }}
{{- if eq (include "cube.opsEnabled" .) "true" }}
{{- if hasKey (.Values.cubeOps | default dict) "persistence" }}
{{- fail "cubeOps.persistence was removed; warehouse blobs are stored in S3. Remove cubeOps.persistence from your values (including values-tke.yaml)." }}
{{- end }}
{{- $opsS3 := default dict .Values.cubeOps.s3 }}
{{- $opsEndpoint := include "cube.opsS3Endpoint" . }}
{{- $opsExistingSecret := $opsS3.existingSecret | default "" }}
{{- $opsAK := $opsS3.accessKeyId | default "" }}
{{- $opsSK := $opsS3.secretAccessKey | default "" }}
{{- $volAK := (.Values.volumeS3).accessKeyId | default "" }}
{{- $volSK := (.Values.volumeS3).secretAccessKey | default "" }}
{{- $hasOpsCreds := or (ne $opsExistingSecret "") (and (ne $opsAK "") (ne $opsSK "")) (and (ne $volAK "") (ne $volSK "")) (eq (include "cube.minioBuiltinEnabled" .) "true") }}
{{- if and (ne $opsExistingSecret "") (eq $opsEndpoint "") }}
{{- fail "cubeOps.s3.existingSecret requires cubeOps.s3.endpoint (or volumeS3.endpoint / chart MinIO); the Secret only supplies s3-access-key-id / s3-secret-access-key" }}
{{- end }}
{{- if and (ne $opsEndpoint "") (not $hasOpsCreds) }}
{{- fail "cubeOps S3 endpoint is set but no credentials: set cubeOps.s3.existingSecret (keys s3-access-key-id / s3-secret-access-key), cubeOps.s3.accessKeyId+secretAccessKey, or volumeS3.accessKeyId+secretAccessKey. volumeS3.existingSecret (volume-s3.conf) is not a CubeOps credential source." }}
{{- end }}
{{- end }}
