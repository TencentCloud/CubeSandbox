{{- if eq (include "cube.opsEnabled" .) "true" }}
{{- $opsPort := .Values.cubeOps.service.port -}}
{{- $wh := .Values.cubeOps.warehouse | default dict }}
{{- $opsS3 := .Values.cubeOps.s3 | default dict }}
{{- $workDir := .Values.cubeOps.workDir | default "/var/tmp/cubeops-warehouse" }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "cube.opsName" . }}
  labels:
    {{- include "cube.labels" . | nindent 4 }}
    app.kubernetes.io/component: ops
spec:
  replicas: {{ .Values.cubeOps.replicas }}
  {{- include "cube.deploymentStrategy" (dict "root" . "strategy" .Values.cubeOps.deploymentStrategy) | nindent 2 }}
  selector:
    matchLabels:
      {{- include "cube.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: ops
  template:
    metadata:
      labels:
        {{- include "cube.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: ops
      {{- with .Values.cubeOps.podAnnotations }}
      annotations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- include "cube.controlPlanePlacement" . | nindent 6 }}
      containers:
        - name: cube-ops
          image: {{ include "cube.cubeImage" (dict "image" .Values.images.ops "context" $) | quote }}
          imagePullPolicy: {{ .Values.images.ops.pullPolicy }}
          env:
            {{- include "cube.timezoneEnv" . | nindent 12 }}
            - name: CUBE_OPS_BIND
              value: {{ .Values.cubeOps.bind | quote }}
            - name: CUBE_OPS_WAREHOUSE_WORK_DIR
              value: {{ $workDir | quote }}
            - name: TMPDIR
              value: {{ $workDir | quote }}
            - name: CUBE_OPS_S3_ENDPOINT
              value: {{ include "cube.opsS3Endpoint" . | quote }}
            - name: CUBE_OPS_S3_NODE_ENDPOINT
              value: {{ include "cube.opsS3NodeEndpoint" . | quote }}
            - name: CUBE_OPS_S3_BUCKET
              value: {{ include "cube.opsS3Bucket" . | quote }}
            - name: CUBE_OPS_S3_REGION
              value: {{ include "cube.opsS3Region" . | quote }}
            - name: CUBE_OPS_S3_PATH_STYLE
              value: {{ include "cube.boolEnvDefaultTrue" $opsS3.pathStyle | quote }}
            - name: CUBE_OPS_S3_CREATE_BUCKET
              value: {{ include "cube.boolEnvDefaultTrue" $opsS3.createBucket | quote }}
            - name: CUBE_OPS_WAREHOUSE_PRESIGN_TTL
              value: {{ ($wh.presignTTL | default "5m") | quote }}
            - name: CUBE_OPS_S3_ACCESS_KEY_ID
              valueFrom:
                secretKeyRef:
                  name: {{ include "cube.opsS3SecretName" . | quote }}
                  key: s3-access-key-id
            - name: CUBE_OPS_S3_SECRET_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ include "cube.opsS3SecretName" . | quote }}
                  key: s3-secret-access-key
            {{- $wh := .Values.cubeOps.warehouse | default dict }}
            {{- with $wh.githubRepos }}
            - name: CUBE_OPS_WAREHOUSE_GITHUB_REPOS
              value: {{ include "cube.csvOrString" . | quote }}
            {{- end }}
            {{- with $wh.cnbRepos }}
            - name: CUBE_OPS_WAREHOUSE_CNB_REPOS
              value: {{ include "cube.csvOrString" . | quote }}
            {{- end }}
            {{- $ghSecret := $wh.githubTokenSecret | default dict }}
            {{- if $ghSecret.name }}
            - name: CUBE_OPS_WAREHOUSE_GITHUB_TOKEN
              valueFrom:
                secretKeyRef:
                  name: {{ $ghSecret.name | quote }}
                  key: {{ $ghSecret.key | default "github-token" | quote }}
            {{- else if $wh.githubToken }}
            - name: CUBE_OPS_WAREHOUSE_GITHUB_TOKEN
              value: {{ $wh.githubToken | quote }}
            {{- end }}
            {{- $cnbSecret := $wh.cnbTokenSecret | default dict }}
            {{- if $cnbSecret.name }}
            - name: CUBE_OPS_WAREHOUSE_CNB_TOKEN
              valueFrom:
                secretKeyRef:
                  name: {{ $cnbSecret.name | quote }}
                  key: {{ $cnbSecret.key | default "cnb-token" | quote }}
            {{- else if $wh.cnbToken }}
            - name: CUBE_OPS_WAREHOUSE_CNB_TOKEN
              value: {{ $wh.cnbToken | quote }}
            {{- end }}
            - name: CUBE_MASTER_ADDR
              value: {{ printf "http://%s" (include "cube.masterEndpoint" .) | quote }}
            {{- if eq (include "cube.dbDriver" .) "postgres" }}
            # CubeOps selects the driver from DATABASE_URL scheme; MYSQL_* only yields mysql://.
            # Password stays in Secret (urlquery-encoded) rather than a plaintext env value.
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: {{ include "cube.secretName" . }}
                  key: database-url
            {{- else }}
            - name: CUBE_SANDBOX_MYSQL_HOST
              value: {{ include "cube.dbHost" . | quote }}
            - name: CUBE_SANDBOX_MYSQL_PORT
              value: {{ include "cube.dbPort" . | quote }}
            - name: CUBE_SANDBOX_MYSQL_USER
              value: {{ include "cube.dbUser" . | quote }}
            - name: CUBE_SANDBOX_MYSQL_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ include "cube.secretName" . }}
                  key: mysql-password
            - name: CUBE_SANDBOX_MYSQL_DB
              value: {{ include "cube.dbName" . | quote }}
            {{- end }}
            - name: CUBE_API_SANDBOX_DOMAIN
              value: {{ default .Values.cubeProxy.domain .Values.cubeOps.sandboxDomain | quote }}
            # Shared CubeDB with CubeMaster; skip fingerprint so chart upgrades
            # do not fail when Master already applied the same migrations.
            - name: CUBEMASTER_MIGRATION_SKIP_FINGERPRINT_CHECK
              value: "true"
            - name: REDIS_HOST
              value: {{ include "cube.redisHost" . | quote }}
            - name: REDIS_PORT
              value: {{ .Values.redis.port | quote }}
            - name: REDIS_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ include "cube.secretName" . }}
                  key: redis-password
            - name: REDIS_MASTER_NAME
              value: {{ .Values.redis.masterName | default "" | quote }}
            - name: REDIS_SENTINEL_NODES
              value: {{ .Values.redis.sentinelNodes | default "" | quote }}
            - name: REDIS_SENTINEL_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ include "cube.secretName" . }}
                  key: redis-sentinel-password
            {{- with .Values.cubeOps.env }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          ports:
            - name: http
              containerPort: {{ $opsPort }}
          {{- if .Values.cubeOps.probes.readiness.enabled }}
          readinessProbe:
            httpGet:
              path: {{ .Values.cubeOps.probes.readiness.path | quote }}
              port: http
            initialDelaySeconds: {{ .Values.cubeOps.probes.readiness.initialDelaySeconds }}
            periodSeconds: {{ .Values.cubeOps.probes.readiness.periodSeconds }}
            failureThreshold: {{ .Values.cubeOps.probes.readiness.failureThreshold }}
          {{- end }}
          {{- if .Values.cubeOps.probes.liveness.enabled }}
          livenessProbe:
            httpGet:
              path: {{ .Values.cubeOps.probes.liveness.path | quote }}
              port: http
            initialDelaySeconds: {{ .Values.cubeOps.probes.liveness.initialDelaySeconds }}
            periodSeconds: {{ .Values.cubeOps.probes.liveness.periodSeconds }}
            failureThreshold: {{ .Values.cubeOps.probes.liveness.failureThreshold }}
          {{- end }}
          {{- with .Values.cubeOps.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          volumeMounts:
            - name: cube-ops-work
              mountPath: {{ $workDir | quote }}
      volumes:
        - name: cube-ops-work
          emptyDir:
            sizeLimit: {{ .Values.cubeOps.workDirSizeLimit | default "32Gi" | quote }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "cube.opsName" . }}
  labels:
    {{- include "cube.labels" . | nindent 4 }}
    app.kubernetes.io/component: ops
spec:
  type: {{ .Values.cubeOps.service.type }}
  selector:
    {{- include "cube.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: ops
  ports:
    - name: http
      port: {{ $opsPort }}
      targetPort: http
{{- end }}
