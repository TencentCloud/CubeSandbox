{{- if and (eq (include "cube.volumeS3UserProvided" .) "true") (not ((.Values.volumeS3).existingSecret)) }}
{{- $s3 := dict
  "accessKeyId" .Values.volumeS3.accessKeyId
  "secretAccessKey" .Values.volumeS3.secretAccessKey
  "bucket" .Values.volumeS3.bucket
  "endpoint" .Values.volumeS3.endpoint
  "region" (.Values.volumeS3.region | default "us-east-1")
  "extraOpts" .Values.volumeS3.extraOpts
}}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "cube.volumeS3SecretName" . }}
  labels:
    {{- include "cube.labels" . | nindent 4 }}
    app.kubernetes.io/component: volume-s3
type: Opaque
stringData:
  volume-s3.conf: |
    {{- include "cube.volumeS3ConfBody" $s3 | nindent 4 }}
{{- end }}
