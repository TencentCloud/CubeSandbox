{{- if and .Values.controlPlane.enabled (not .Values.terminal.existingSecret) }}
{{- $secretName := include "cube.terminalSecretName" . -}}
{{- $token := "" -}}
{{- $existing := lookup "v1" "Secret" .Release.Namespace $secretName -}}
{{- if $existing -}}
{{- $existingData := default dict $existing.data -}}
{{- if not (hasKey $existingData .Values.terminal.secretKey) -}}
{{- fail (printf "generated terminal Secret %s is missing key %s; refusing to rotate the shared token" $secretName .Values.terminal.secretKey) -}}
{{- end -}}
{{- $token = index $existing.data .Values.terminal.secretKey | b64dec -}}
{{- else -}}
{{- $token = randAlphaNum 64 -}}
{{- end -}}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $secretName }}
  labels:
    {{- include "cube.labels" . | nindent 4 }}
type: Opaque
stringData:
  {{ .Values.terminal.secretKey }}: {{ $token | quote }}
{{- end }}
