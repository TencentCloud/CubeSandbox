{{- if eq (include "cube.secretEnabled" .) "true" }}
{{- $existing := lookup "v1" "Secret" .Release.Namespace (include "cube.secretName" .) -}}
{{- $adminToken := include "cube.adminToken" . -}}
{{- $minioUser := default "cubeminio" .Values.minio.rootUser -}}
{{- $minioPassword := default "" .Values.minio.rootPassword -}}
{{- if eq (include "cube.minioBuiltinEnabled" .) "true" }}
{{- if not $minioPassword }}
{{- if and $existing $existing.data (index $existing.data "minio-root-password") }}
{{- $minioPassword = index $existing.data "minio-root-password" | b64dec }}
{{- else }}
{{- $minioPassword = randAlphaNum 24 }}
{{- end }}
{{- end }}
{{- end }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "cube.secretName" . }}
  labels:
    {{- include "cube.labels" . | nindent 4 }}
type: Opaque
stringData:
  {{- if eq (include "cube.mysqlBuiltinEnabled" .) "true" }}
  # Only the chart-managed MySQL StatefulSet consumes the root password.
  mysql-root-password: {{ include "cube.dbRootPassword" . | quote }}
  {{- end }}
  {{- if eq (include "cube.dbDriver" .) "mysql" }}
  mysql-password: {{ include "cube.dbPassword" . | quote }}
  {{- else }}
  # CubeOps/CubeAPI DATABASE_URL (urlquery-encoded). Kept in Secret so the
  # Deployment does not embed the password in env value / pod YAML.
  database-url: {{ include "cube.databaseURL" . | quote }}
  {{- end }}
  redis-password: {{ .Values.redis.password | quote }}
  redis-sentinel-password: {{ .Values.redis.sentinelPassword | default "" | quote }}
  # Consumed via include in ConfigMap redis.conf (password must not live in ConfigMap or argv).
  redis-auth.conf: |
    requirepass {{ .Values.redis.password | quote }}
  {{- if eq (include "cube.minioBuiltinEnabled" .) "true" }}
  minio-root-user: {{ $minioUser | quote }}
  minio-root-password: {{ $minioPassword | quote }}
  {{- end }}
  cube-admin-token: {{ $adminToken | quote }}
  {{- $opsS3 := default dict .Values.cubeOps.s3 }}
  {{- $opsAK := $opsS3.accessKeyId | default "" }}
  {{- $opsSK := $opsS3.secretAccessKey | default "" }}
  {{- if not $opsAK }}
  {{- $opsAK = (.Values.volumeS3).accessKeyId | default "" }}
  {{- end }}
  {{- if not $opsSK }}
  {{- $opsSK = (.Values.volumeS3).secretAccessKey | default "" }}
  {{- end }}
  {{- if and (not $opsAK) (eq (include "cube.minioBuiltinEnabled" .) "true") }}
  {{- $opsAK = $minioUser }}
  {{- $opsSK = $minioPassword }}
  {{- end }}
  s3-access-key-id: {{ $opsAK | quote }}
  s3-secret-access-key: {{ $opsSK | quote }}
{{- if eq (include "cube.minioBuiltinEnabled" .) "true" }}
{{- /* Fill effective S3 plugin fields from chart MinIO (same as one-click
      fill_s3_from_local_minio). volume-s3.conf is rendered only from these
      S3 fields; minio.* is not a plugin config source. Password must be
      generated in this file so it matches minio-root-password. */}}
{{- $s3 := dict
  "accessKeyId" $minioUser
  "secretAccessKey" $minioPassword
  "bucket" (.Values.minio.bucket | default "cube-volumes")
  "endpoint" (include "cube.minioEndpoint" .)
  "region" "us-east-1"
  "extraOpts" "-ouse_path_request_style"
}}
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "cube.volumeS3SecretName" . }}
  labels:
    {{- include "cube.labels" . | nindent 4 }}
    app.kubernetes.io/component: volume-s3
type: Opaque
stringData:
  volume-s3.conf: |
    {{- include "cube.volumeS3ConfBody" $s3 | nindent 4 }}
{{- end }}
{{- end }}
