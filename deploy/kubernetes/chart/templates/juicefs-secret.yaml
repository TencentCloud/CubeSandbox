{{- if eq (include "cube.juicefsEnabled" .) "true" }}
{{- $meta := default dict ((.Values.cubeJuiceFS).metadata) }}
{{- if eq (($meta.existingSecret) | default "") "" }}
{{- $secretName := include "cube.juicefsMetadataSecretName" . }}
{{- $existing := lookup "v1" "Secret" .Release.Namespace $secretName }}
{{- $passwordKey := $meta.passwordKey | default "meta-password" }}
{{- $password := $meta.password | default "" }}
{{- if and (not $password) $existing $existing.data (index $existing.data $passwordKey) }}
{{- $password = index $existing.data $passwordKey | b64dec }}
{{- else if and (not $password) (eq (($meta.url) | default "") "") }}
{{- $password = randAlphaNum 32 }}
{{- end }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $secretName }}
  labels:
    {{- include "cube.labels" . | nindent 4 }}
    app.kubernetes.io/component: cube-juicefs
type: Opaque
stringData:
  {{ $passwordKey }}: {{ $password | quote }}
  {{- if eq (($meta.url) | default "") "" }}
  redis-auth.conf: |
    requirepass {{ $password | quote }}
  {{- end }}
---
{{- end }}
{{- $storage := default dict ((.Values.cubeJuiceFS).storage) }}
{{- if and (ne (($storage.bucket) | default "") "") (eq (($storage.existingSecret) | default "") "") }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "cube.juicefsStorageSecretName" . }}
  labels:
    {{- include "cube.labels" . | nindent 4 }}
    app.kubernetes.io/component: cube-juicefs
type: Opaque
stringData:
  {{ $storage.accessKeyKey | default "access-key" }}: {{ $storage.accessKey | default "" | quote }}
  {{ $storage.secretKeyKey | default "secret-key" }}: {{ $storage.secretKey | default "" | quote }}
{{- end }}
{{- end }}
