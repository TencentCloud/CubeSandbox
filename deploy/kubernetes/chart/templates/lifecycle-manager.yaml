{{- if eq (include "cube.lifecycleManagerEnabled" .) "true" }}
{{- $redisSentinel := eq (include "cube.redisSentinelEnabled" .) "true" -}}
{{- $redisHost := "" -}}
{{- if not $redisSentinel -}}
{{- $redisHost = default (include "cube.redisHost" .) .Values.lifecycleManager.redis.host -}}
{{- end -}}
{{- $redisPort := default .Values.redis.port .Values.lifecycleManager.redis.port -}}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "cube.lifecycleManagerName" . }}
  labels:
    {{- include "cube.labels" . | nindent 4 }}
    app.kubernetes.io/component: lifecycle-manager
spec:
  replicas: {{ .Values.lifecycleManager.replicas }}
  {{- include "cube.deploymentStrategy" . | nindent 2 }}
  selector:
    matchLabels:
      {{- include "cube.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: lifecycle-manager
  template:
    metadata:
      labels:
        {{- include "cube.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: lifecycle-manager
      {{- with .Values.lifecycleManager.podAnnotations }}
      annotations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- include "cube.controlPlanePlacement" . | nindent 6 }}
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                labelSelector:
                  matchLabels:
                    app.kubernetes.io/instance: {{ .Release.Name }}
                    app.kubernetes.io/component: lifecycle-manager
                topologyKey: kubernetes.io/hostname
      containers:
        - name: cube-lifecycle-manager
          image: {{ include "cube.cubeImage" (dict "image" .Values.images.lifecycleManager "context" $) | quote }}
          imagePullPolicy: {{ .Values.images.lifecycleManager.pullPolicy }}
          env:
            {{- include "cube.timezoneEnv" . | nindent 12 }}
            - name: CUBE_LCM_REDIS_ADDR
              value: {{ if $redisSentinel }}{{ "" | quote }}{{ else }}{{ printf "%s:%v" $redisHost $redisPort | quote }}{{ end }}
            - name: CUBE_LCM_REDIS_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ include "cube.secretName" . }}
                  key: redis-password
            - name: CUBE_LCM_REDIS_DB
              value: {{ .Values.lifecycleManager.redis.db | quote }}
            - name: CUBE_LCM_REDIS_MASTER_NAME
              value: {{ .Values.redis.masterName | default "" | quote }}
            - name: CUBE_LCM_REDIS_SENTINEL_NODES
              value: {{ .Values.redis.sentinelNodes | default "" | quote }}
            - name: CUBE_LCM_REDIS_SENTINEL_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ include "cube.secretName" . }}
                  key: redis-sentinel-password
            - name: CUBE_LCM_CUBEMASTER_URL
              value: {{ printf "http://%s" (include "cube.masterEndpoint" .) | quote }}
            - name: CUBE_LCM_LISTEN_ADDR
              value: {{ .Values.lifecycleManager.listenAddr | quote }}
            - name: CUBE_LCM_DEFAULT_IDLE_TIMEOUT
              value: {{ .Values.lifecycleManager.defaultIdleTimeout | quote }}
            - name: CUBE_LCM_HEARTBEAT_TTL
              value: {{ .Values.lifecycleManager.heartbeatTTL | quote }}
            - name: CUBE_LCM_DISCOVERY_REFRESH
              value: {{ .Values.lifecycleManager.discoveryRefresh | quote }}
            - name: CUBE_LCM_LAST_ACTIVE_POLL
              value: {{ .Values.lifecycleManager.lastActivePoll | quote }}
            - name: CUBE_LCM_IDLE_SWEEP_INTERVAL
              value: {{ .Values.lifecycleManager.idleSweepInterval | quote }}
            - name: CUBE_LCM_BOOTSTRAP_WARMUP
              value: {{ .Values.lifecycleManager.bootstrapWarmup | quote }}
            - name: CUBE_LCM_STATE_LOCK_TTL
              value: {{ .Values.lifecycleManager.stateLockTTL | quote }}
            - name: CUBE_LCM_EVENTBUS_ENABLED
              value: {{ .Values.lifecycleManager.eventBusEnabled | quote }}
            - name: CUBE_LCM_LEADER_ELECTION_ENABLED
              value: {{ .Values.lifecycleManager.leaderElection.enabled | quote }}
            - name: CUBE_LCM_LEADER_LEASE_TTL
              value: {{ .Values.lifecycleManager.leaderElection.leaseTTL | quote }}
            - name: CUBE_LCM_LEADER_RENEW_INTERVAL
              value: {{ .Values.lifecycleManager.leaderElection.renewInterval | quote }}
            - name: CUBE_LCM_LEADER_RETRY_INTERVAL
              value: {{ .Values.lifecycleManager.leaderElection.retryInterval | quote }}
            - name: CUBE_LCM_ADMIN_TOKEN
              valueFrom:
                secretKeyRef:
                  name: {{ include "cube.secretName" . }}
                  key: cube-admin-token
          ports:
            - name: http
              containerPort: {{ .Values.lifecycleManager.service.port }}
              protocol: TCP
          {{- if .Values.lifecycleManager.probes.readiness.enabled }}
          readinessProbe:
            httpGet:
              path: {{ .Values.lifecycleManager.probes.readiness.path | quote }}
              port: {{ .Values.lifecycleManager.probes.readiness.port }}
            initialDelaySeconds: {{ .Values.lifecycleManager.probes.readiness.initialDelaySeconds }}
            periodSeconds: {{ .Values.lifecycleManager.probes.readiness.periodSeconds }}
            failureThreshold: {{ .Values.lifecycleManager.probes.readiness.failureThreshold }}
          {{- end }}
          {{- if .Values.lifecycleManager.probes.liveness.enabled }}
          livenessProbe:
            httpGet:
              path: {{ .Values.lifecycleManager.probes.liveness.path | quote }}
              port: {{ .Values.lifecycleManager.probes.liveness.port }}
            initialDelaySeconds: {{ .Values.lifecycleManager.probes.liveness.initialDelaySeconds }}
            periodSeconds: {{ .Values.lifecycleManager.probes.liveness.periodSeconds }}
            failureThreshold: {{ .Values.lifecycleManager.probes.liveness.failureThreshold }}
          {{- end }}
          {{- with .Values.lifecycleManager.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "cube.lifecycleManagerName" . }}
  labels:
    {{- include "cube.labels" . | nindent 4 }}
    app.kubernetes.io/component: lifecycle-manager
  {{- with .Values.lifecycleManager.service.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  type: ClusterIP
  selector:
    {{- include "cube.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: lifecycle-manager
  ports:
    - name: http
      port: {{ .Values.lifecycleManager.service.port }}
      targetPort: http
      protocol: TCP
{{- end }}
