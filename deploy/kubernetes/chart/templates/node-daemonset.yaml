{{- if .Values.cubeNode.enabled }}
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: {{ include "cube.nodeName" . }}
  labels:
    {{- include "cube.labels" . | nindent 4 }}
    app.kubernetes.io/component: cube-node
spec:
  updateStrategy:
    {{- toYaml .Values.cubeNode.updateStrategy | nindent 4 }}
  selector:
    matchLabels:
      {{- include "cube.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: cube-node
  template:
    metadata:
      labels:
        {{- include "cube.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: cube-node
      annotations:
        {{- with .Values.cubeNode.podAnnotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
    spec:
      serviceAccountName: {{ include "cube.nodeServiceAccountName" . }}
      automountServiceAccountToken: true
      hostNetwork: {{ .Values.security.hostNetwork }}
      hostPID: {{ .Values.security.hostPID }}
      terminationGracePeriodSeconds: {{ .Values.cubeNode.terminationGracePeriodSeconds }}
      dnsPolicy: ClusterFirstWithHostNet
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- include "cube.computePlacement" . | nindent 6 }}
      initContainers:
        # Stage image toolbox onto a hostPath before any other compute init so
        # cube-shim / cube-runtime binaries survive Pod rebuilds (overlay unmount).
        # Inline script so this works with existing cube-node images that do not
        # yet ship /usr/local/bin/stage-toolbox.sh; the image still provides the
        # toolbox tree under /usr/local/services/cubetoolbox.
        - name: stage-toolbox
          image: {{ include "cube.cubeImage" (dict "image" .Values.images.node "context" $) | quote }}
          imagePullPolicy: {{ .Values.images.node.pullPolicy }}
          command:
            - /bin/bash
            - -ec
            - |
              set -euo pipefail
              IMAGE_TOOLBOX_ROOT="${IMAGE_TOOLBOX_ROOT:-/usr/local/services/cubetoolbox}"
              HOST_TOOLBOX_ROOT="${HOST_TOOLBOX_ROOT:-/host-toolbox}"
              # Align with one-click install.sh: do not wipe runtime dirs under
              # the install prefix (cube-snapshot / cubebox_os_image / ...).
              PRESERVE_NAMES=(cube-snapshot cubebox_os_image cubeletmnt cube-vs)
              log() { printf '[stage-toolbox] %s\n' "$*"; }
              fail() { printf '[stage-toolbox] ERROR: %s\n' "$*" >&2; exit 1; }
              should_preserve() {
                local name="$1" preserved
                for preserved in "${PRESERVE_NAMES[@]}"; do
                  [[ "${name}" == "${preserved}" ]] && return 0
                done
                return 1
              }
              [[ -d "${IMAGE_TOOLBOX_ROOT}" ]] || fail "image toolbox missing: ${IMAGE_TOOLBOX_ROOT}"
              [[ -n "${HOST_TOOLBOX_ROOT}" && "${HOST_TOOLBOX_ROOT}" != "/" ]] || fail "invalid HOST_TOOLBOX_ROOT"
              [[ "${HOST_TOOLBOX_ROOT}" != "${IMAGE_TOOLBOX_ROOT}" ]] || fail "HOST_TOOLBOX_ROOT must differ from IMAGE_TOOLBOX_ROOT"
              mkdir -p "${HOST_TOOLBOX_ROOT}"
              log "staging ${IMAGE_TOOLBOX_ROOT} -> ${HOST_TOOLBOX_ROOT} (selective overwrite)"
              while IFS= read -r -d '' entry; do
                name="$(basename "${entry}")"
                if should_preserve "${name}"; then
                  log "preserving ${name}"
                  continue
                fi
                rm -rf "${entry}"
              done < <(find "${HOST_TOOLBOX_ROOT}" -mindepth 1 -maxdepth 1 -print0)
              while IFS= read -r -d '' entry; do
                name="$(basename "${entry}")"
                dest="${HOST_TOOLBOX_ROOT}/${name}"
                if should_preserve "${name}" && [[ -e "${dest}" ]]; then
                  log "skipping image copy over preserved ${name}"
                  continue
                fi
                rm -rf "${dest}"
                cp -a "${entry}" "${dest}"
              done < <(find "${IMAGE_TOOLBOX_ROOT}" -mindepth 1 -maxdepth 1 -print0)
              chmod +x \
                "${HOST_TOOLBOX_ROOT}/Cubelet/bin/cubelet" \
                "${HOST_TOOLBOX_ROOT}/Cubelet/bin/cubecli" \
                "${HOST_TOOLBOX_ROOT}/network-agent/bin/network-agent" \
                "${HOST_TOOLBOX_ROOT}/network-agent/bin/cubevsmapdump" \
                "${HOST_TOOLBOX_ROOT}/cube-shim/bin/cube-runtime" \
                "${HOST_TOOLBOX_ROOT}/cube-shim/bin/containerd-shim-cube-rs" \
                2>/dev/null || true
              for required in \
                Cubelet/bin/cubelet \
                network-agent/bin/network-agent \
                cube-shim/bin/containerd-shim-cube-rs \
                cube-shim/bin/cube-runtime
              do
                [[ -x "${HOST_TOOLBOX_ROOT}/${required}" ]] || fail "missing executable after stage: ${required}"
              done
              log "toolbox staged successfully at ${HOST_TOOLBOX_ROOT}"
          env:
            {{- include "cube.timezoneEnv" . | nindent 12 }}
            - name: IMAGE_TOOLBOX_ROOT
              value: /usr/local/services/cubetoolbox
            - name: HOST_TOOLBOX_ROOT
              value: /host-toolbox
          volumeMounts:
            - name: toolbox
              mountPath: /host-toolbox
          securityContext:
            privileged: {{ .Values.security.privileged }}
        {{- if .Values.bootstrap.pvmHostKernel.enabled }}
        - name: pvm-host-bootstrap
          image: {{ include "cube.cubeImage" (dict "image" .Values.images.pvmHostBootstrap "context" $) | quote }}
          imagePullPolicy: {{ .Values.images.pvmHostBootstrap.pullPolicy }}
          securityContext:
            privileged: {{ .Values.security.privileged }}
          env:
            {{- include "cube.timezoneEnv" . | nindent 12 }}
            - name: NODE_NAME
              valueFrom:
                fieldRef:
                  fieldPath: spec.nodeName
            - name: POD_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
            - name: HOST_ROOT
              value: /host
            - name: DESIRED_KERNEL_PATTERN
              value: {{ .Values.bootstrap.pvmHostKernel.desiredKernelPattern | quote }}
            - name: PVM_KERNEL_BOOT_ARGS
              value: {{ .Values.bootstrap.pvmHostKernel.bootArgs | quote }}
            - name: PVM_KERNEL_RPM_PATH
              value: {{ .Values.bootstrap.pvmHostKernel.package.rpmPath | quote }}
            - name: PVM_KERNEL_DEB_PATH
              value: {{ .Values.bootstrap.pvmHostKernel.package.debPath | quote }}
            - name: PVM_KERNEL_RPM_URL
              value: {{ .Values.bootstrap.pvmHostKernel.package.rpmUrl | quote }}
            - name: PVM_KERNEL_DEB_URL
              value: {{ .Values.bootstrap.pvmHostKernel.package.debUrl | quote }}
            - name: PVM_KERNEL_PACKAGE_SOURCE
              value: {{ .Values.bootstrap.pvmHostKernel.package.source | quote }}
            - name: REBOOT_ENABLED
              value: {{ .Values.bootstrap.pvmHostKernel.reboot.enabled | quote }}
            - name: REBOOT_COORDINATED
              value: {{ .Values.bootstrap.pvmHostKernel.reboot.coordinated | quote }}
            - name: LEASE_NAME
              value: {{ .Values.bootstrap.pvmHostKernel.reboot.leaseName | quote }}
            - name: LEASE_TTL_SECONDS
              value: {{ .Values.bootstrap.pvmHostKernel.reboot.leaseTTLSeconds | quote }}
            - name: REBOOT_MAX_COUNT
              value: {{ .Values.bootstrap.pvmHostKernel.reboot.maxCount | quote }}
          volumeMounts:
            - name: host-root
              mountPath: /host
            - name: dev
              mountPath: /dev
            - name: sys
              mountPath: /sys
            - name: lib-modules
              mountPath: /lib/modules
              readOnly: true
        {{- end }}
        {{- if .Values.bootstrap.nodeInit.enabled }}
        - name: cube-node-init
          image: {{ include "cube.cubeImage" (dict "image" .Values.images.nodeInit "context" $) | quote }}
          imagePullPolicy: {{ .Values.images.nodeInit.pullPolicy }}
          securityContext:
            privileged: {{ .Values.security.privileged }}
          env:
            {{- include "cube.timezoneEnv" . | nindent 12 }}
            - name: HOST_ROOT
              value: /host
            - name: DATA_CUBELET
              value: {{ .Values.hostPaths.dataCubelet | quote }}
            - name: REQUIRE_KVM
              value: {{ .Values.bootstrap.nodeInit.requireKVM | quote }}
            - name: REQUIRE_XFS
              value: {{ .Values.bootstrap.nodeInit.requireXFS | quote }}
            - name: CHMOD_KVM
              value: {{ .Values.bootstrap.nodeInit.chmodKVM | quote }}
            - name: LOAD_KVM_MODULE
              value: {{ .Values.bootstrap.nodeInit.loadKVMModule | quote }}
            - name: WRITE_UDEV_RULE
              value: {{ .Values.bootstrap.nodeInit.writeUdevRule | quote }}
            - name: CREATE_HOST_DIRS
              value: {{ .Values.bootstrap.nodeInit.createHostDirs | quote }}
            - name: CHECK_MASTER_CONNECTIVITY
              value: {{ .Values.bootstrap.nodeInit.checkMasterConnectivity | quote }}
            - name: CUBE_MASTER_ENDPOINT
              value: {{ include "cube.masterEndpoint" . | quote }}
            - name: LOOPBACK_ENABLED
              value: {{ .Values.bootstrap.nodeInit.dataCubelet.loopback.enabled | quote }}
            - name: LOOPBACK_IMAGE_PATH
              value: {{ .Values.bootstrap.nodeInit.dataCubelet.loopback.imagePath | quote }}
            - name: LOOPBACK_SIZE
              value: {{ .Values.bootstrap.nodeInit.dataCubelet.loopback.size | quote }}
            - name: CHECK_MEMORY
              value: {{ .Values.bootstrap.nodeInit.checkMemory | quote }}
            - name: MIN_MEMORY_KB
              value: {{ .Values.bootstrap.nodeInit.minMemoryKB | quote }}
            - name: CHECK_CGROUP_CPU
              value: {{ .Values.bootstrap.nodeInit.checkCgroupCPU | quote }}
            - name: CHECK_GLIBC
              value: {{ .Values.bootstrap.nodeInit.checkGlibc | quote }}
            - name: CHECK_CIDR
              value: {{ .Values.bootstrap.nodeInit.checkCIDR | quote }}
            - name: CHECK_CUBECOW_DEPS
              value: {{ .Values.bootstrap.nodeInit.checkCubecowDeps | quote }}
            - name: CUBE_PVM_ENABLE
              value: {{ ternary "1" "0" .Values.cubeNode.pvmGuestKernel.enabled | quote }}
            - name: CUBE_SANDBOX_NETWORK_CIDR
              value: {{ .Values.cubeNode.network.cidr | quote }}
            - name: CUBE_SANDBOX_NETWORK_CIDR_SKIP_CONFLICT_CHECK
              value: {{ ternary "1" "0" .Values.cubeNode.network.cidrSkipConflictCheck | quote }}
          volumeMounts:
            - name: host-root
              mountPath: /host
            - name: dev
              mountPath: /dev
            - name: sys
              mountPath: /sys
            - name: lib-modules
              mountPath: /lib/modules
              readOnly: true
            - name: data-cubelet
              mountPath: {{ .Values.hostPaths.dataCubelet }}
              mountPropagation: Bidirectional
            - name: data-log
              mountPath: {{ .Values.hostPaths.dataLog }}
            - name: data-cube-shim
              mountPath: {{ .Values.hostPaths.dataCubeShim }}
              mountPropagation: Bidirectional
            - name: data-snapshot-pack
              mountPath: {{ .Values.hostPaths.dataSnapshotPack }}
            - name: tmp-cube
              mountPath: {{ .Values.hostPaths.tmpCube }}
              mountPropagation: Bidirectional
        {{- end }}
      containers:
        - name: cube-node
          image: {{ include "cube.cubeImage" (dict "image" .Values.images.node "context" $) | quote }}
          imagePullPolicy: {{ .Values.images.node.pullPolicy }}
          # Keep /data/cubelet/state on the dataCubelet hostPath. cubelet's
          # default mountTmpfsDir() puts a 500Mi tmpfs over state inside its
          # private mount NS; that tmpfs (and shim bundle metadata) disappears
          # when the Pod is deleted, so LoadExistingShims cannot reconnect.
          # Bind-mounting state first makes mountinfo.Mounted(state)=true in the
          # NS cubelet clones, so mountTmpfsDir is a no-op.
          command:
            - /bin/bash
            - -ec
            - |
              set -euo pipefail
              mkdir -p /data/cubelet/state
              if ! findmnt --mountpoint /data/cubelet/state >/dev/null 2>&1; then
                mount --bind /data/cubelet/state /data/cubelet/state
              fi
              exec /usr/local/bin/cube-node-entrypoint.sh
          securityContext:
            privileged: {{ .Values.security.privileged }}
            capabilities:
              add:
                - SYS_ADMIN
                - NET_ADMIN
                - SYS_MODULE
                - SYS_RESOURCE
                - IPC_LOCK
                - SYS_PTRACE
          env:
            {{- include "cube.timezoneEnv" . | nindent 12 }}
            - name: CUBE_ROLE
              value: node
            - name: CUBE_MASTER_ENDPOINT
              value: {{ include "cube.masterEndpoint" . | quote }}
            - name: TOOLBOX_ROOT
              value: /usr/local/services/cubetoolbox
            - name: CUBE_SANDBOX_NODE_IP
              {{- if eq .Values.cubeNode.ipSource "statusHostIP" }}
              valueFrom:
                fieldRef:
                  fieldPath: status.hostIP
              {{- else }}
              value: {{ .Values.cubeNode.staticNodeIP | quote }}
              {{- end }}
            - name: CUBE_PVM_ENABLE
              value: {{ ternary "1" "0" .Values.cubeNode.pvmGuestKernel.enabled | quote }}
            - name: CUBE_SANDBOX_AUTO_DETECT_ETH
              value: {{ .Values.cubeNode.network.autoDetectEthName | quote }}
            - name: CUBE_SANDBOX_ETH_NAME
              value: {{ .Values.cubeNode.network.ethName | quote }}
            - name: CUBE_SANDBOX_NETWORK_CIDR
              value: {{ .Values.cubeNode.network.cidr | quote }}
            - name: CUBE_SANDBOX_DNS_SERVERS
              {{- if .Values.cubeNode.dns.sandbox.nameservers }}
              value: {{ join "," .Values.cubeNode.dns.sandbox.nameservers | quote }}
              {{- else }}
              value: ""
              {{- end }}
            - name: CUBE_SANDBOX_DNS_FOLLOW_NODE
              value: {{ ternary "true" "false" (and .Values.cubeNode.dns.sandbox.followNodeDns (not .Values.cubeNode.dns.sandbox.nameservers)) | quote }}
            {{- with .Values.cubeNode.env }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          ports:
            - name: cubelet-grpc
              containerPort: 9999
            - name: cubelet-http
              containerPort: 9998
            - name: cubelet-debug
              containerPort: 9966
            - name: network-agent
              containerPort: 19090
          lifecycle:
            preStop:
              exec:
                command:
                  - /bin/bash
                  - -ec
                  - |
                    # Graceful stop for control processes only. Never match
                    # containerd-shim-cube-rs / cube-runtime / VMM — those must
                    # survive Pod rebuilds so existing sandboxes keep running.
                    pkill -TERM -f '/usr/local/services/cubetoolbox/Cubelet/bin/cubelet --config' || true
                    pkill -TERM -f '/usr/local/services/cubetoolbox/network-agent/bin/network-agent' || true
                    sleep 5
          {{- if .Values.cubeNode.probes.startup.enabled }}
          startupProbe:
            {{- if .Values.cubeNode.probes.startup.exec }}
            exec:
              {{- toYaml .Values.cubeNode.probes.startup.exec | nindent 14 }}
            {{- else }}
            tcpSocket:
              port: {{ .Values.cubeNode.probes.startup.tcpSocketPort }}
            {{- end }}
            periodSeconds: {{ .Values.cubeNode.probes.startup.periodSeconds }}
            failureThreshold: {{ .Values.cubeNode.probes.startup.failureThreshold }}
          {{- end }}
          {{- if .Values.cubeNode.probes.readiness.enabled }}
          readinessProbe:
            {{- if .Values.cubeNode.probes.readiness.exec }}
            exec:
              command:
                {{- toYaml .Values.cubeNode.probes.readiness.exec | nindent 16 }}
            {{- else }}
            tcpSocket:
              port: {{ .Values.cubeNode.probes.readiness.tcpSocketPort }}
            {{- end }}
            initialDelaySeconds: {{ .Values.cubeNode.probes.readiness.initialDelaySeconds }}
            periodSeconds: {{ .Values.cubeNode.probes.readiness.periodSeconds }}
            failureThreshold: {{ .Values.cubeNode.probes.readiness.failureThreshold }}
          {{- end }}
          {{- if .Values.cubeNode.probes.liveness.enabled }}
          livenessProbe:
            {{- if .Values.cubeNode.probes.liveness.exec }}
            exec:
              command:
                {{- toYaml .Values.cubeNode.probes.liveness.exec | nindent 16 }}
            {{- else }}
            tcpSocket:
              port: {{ .Values.cubeNode.probes.liveness.tcpSocketPort }}
            {{- end }}
            initialDelaySeconds: {{ .Values.cubeNode.probes.liveness.initialDelaySeconds }}
            periodSeconds: {{ .Values.cubeNode.probes.liveness.periodSeconds }}
            failureThreshold: {{ .Values.cubeNode.probes.liveness.failureThreshold }}
          {{- end }}
          volumeMounts:
            - name: dev
              mountPath: /dev
            - name: sys
              mountPath: /sys
            - name: lib-modules
              mountPath: /lib/modules
              readOnly: true
            - name: toolbox
              mountPath: /usr/local/services/cubetoolbox
            - name: data-cubelet
              mountPath: {{ .Values.hostPaths.dataCubelet }}
              mountPropagation: Bidirectional
            - name: data-log
              mountPath: {{ .Values.hostPaths.dataLog }}
            - name: data-cube-shim
              mountPath: {{ .Values.hostPaths.dataCubeShim }}
              mountPropagation: Bidirectional
            - name: data-snapshot-pack
              mountPath: {{ .Values.hostPaths.dataSnapshotPack }}
            - name: tmp-cube
              mountPath: {{ .Values.hostPaths.tmpCube }}
              mountPropagation: Bidirectional
            # Persist shim ttrpc sockets (/run/containerd/s/*) across Pod
            # rebuilds so LoadExistingShims can reconnect. See hostPaths.runContainerd.
            - name: run-containerd
              mountPath: /run/containerd
            # Persist CH API / vsock sockets (/run/vc/vm/*). See hostPaths.runVc.
            - name: run-vc
              mountPath: /run/vc
          resources:
            {{- toYaml .Values.cubeNode.resources | nindent 12 }}
        {{- if .Values.cubeEgress.enabled }}
        - name: cube-egress
          image: {{ include "cube.cubeImage" (dict "image" .Values.images.cubeEgress "context" $) | quote }}
          imagePullPolicy: {{ .Values.images.cubeEgress.pullPolicy }}
          command:
            - /bin/bash
            - -ec
            - |
              mkdir -p /data/log/cube-egress
              exec /usr/local/openresty/nginx/sbin/start.sh
          securityContext:
            privileged: {{ .Values.security.privileged }}
            capabilities:
              add:
                - NET_ADMIN
                - NET_RAW
                - NET_BIND_SERVICE
                - CHOWN
                - SETUID
                - SETGID
                - DAC_READ_SEARCH
          env:
            {{- include "cube.timezoneEnv" . | nindent 12 }}
            - name: CUBE_EGRESS_BOOTSTRAP_URL
              value: {{ .Values.cubeEgress.bootstrapURL | quote }}
            - name: CUBE_EGRESS_DEBUG_DUMP
              value: {{ ternary "1" "0" .Values.cubeEgress.debugDump | quote }}
          ports:
            - name: egress-admin
              containerPort: 9090
            - name: egress-http
              containerPort: 8080
            - name: egress-https
              containerPort: 8443
          {{- if .Values.cubeEgress.probes.readiness.enabled }}
          readinessProbe:
            exec:
              command:
                - /bin/bash
                - -ec
                - {{ printf "curl -fsS http://127.0.0.1:%v%s >/dev/null" .Values.cubeEgress.probes.readiness.port .Values.cubeEgress.probes.readiness.path | quote }}
            initialDelaySeconds: {{ .Values.cubeEgress.probes.readiness.initialDelaySeconds }}
            periodSeconds: {{ .Values.cubeEgress.probes.readiness.periodSeconds }}
            failureThreshold: {{ .Values.cubeEgress.probes.readiness.failureThreshold }}
          {{- end }}
          {{- if .Values.cubeEgress.probes.liveness.enabled }}
          livenessProbe:
            exec:
              command:
                - /bin/bash
                - -ec
                - {{ printf "curl -fsS http://127.0.0.1:%v%s >/dev/null" .Values.cubeEgress.probes.liveness.port .Values.cubeEgress.probes.liveness.path | quote }}
            initialDelaySeconds: {{ .Values.cubeEgress.probes.liveness.initialDelaySeconds }}
            periodSeconds: {{ .Values.cubeEgress.probes.liveness.periodSeconds }}
            failureThreshold: {{ .Values.cubeEgress.probes.liveness.failureThreshold }}
          {{- end }}
          volumeMounts:
            - name: cube-egress-ca
              mountPath: /etc/cube/ca
              readOnly: true
            - name: data-log
              mountPath: {{ .Values.hostPaths.dataLog }}
            - name: cube-egress-run
              mountPath: /var/run/openresty
          {{- with .Values.cubeEgress.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
        {{- if .Values.cubeEgress.network.enabled }}
        - name: cube-egress-net
          image: {{ include "cube.cubeImage" (dict "image" .Values.images.cubeEgressNet "context" $) | quote }}
          imagePullPolicy: {{ .Values.images.cubeEgressNet.pullPolicy }}
          securityContext:
            privileged: {{ .Values.security.privileged }}
            capabilities:
              add:
                - NET_ADMIN
                - NET_RAW
                - SYS_MODULE
          env:
            {{- include "cube.timezoneEnv" . | nindent 12 }}
            - name: CUBE_INGRESS_IFACE
              value: {{ .Values.cubeEgress.network.ingressInterface | quote }}
            - name: CUBE_TPROXY_ON_IP
              value: {{ .Values.cubeEgress.network.tproxyOnIP | quote }}
            - name: CUBE_EGRESS_NET_INITIAL_WAIT_SECONDS
              value: {{ .Values.cubeEgress.network.initialWaitSeconds | quote }}
            - name: CUBE_EGRESS_NET_REAPPLY_INTERVAL_SECONDS
              value: {{ .Values.cubeEgress.network.reapplyIntervalSeconds | quote }}
          {{- if .Values.cubeEgress.network.probes.readiness.enabled }}
          readinessProbe:
            exec:
              command:
                - /bin/bash
                - -ec
                - {{ include "cube.egressNetProbeCommand" . | quote }}
            initialDelaySeconds: {{ .Values.cubeEgress.network.probes.readiness.initialDelaySeconds }}
            periodSeconds: {{ .Values.cubeEgress.network.probes.readiness.periodSeconds }}
            failureThreshold: {{ .Values.cubeEgress.network.probes.readiness.failureThreshold }}
          {{- end }}
          {{- if .Values.cubeEgress.network.probes.liveness.enabled }}
          livenessProbe:
            exec:
              command:
                - /bin/bash
                - -ec
                - {{ include "cube.egressNetProbeCommand" . | quote }}
            initialDelaySeconds: {{ .Values.cubeEgress.network.probes.liveness.initialDelaySeconds }}
            periodSeconds: {{ .Values.cubeEgress.network.probes.liveness.periodSeconds }}
            failureThreshold: {{ .Values.cubeEgress.network.probes.liveness.failureThreshold }}
          {{- end }}
          volumeMounts:
            - name: lib-modules
              mountPath: /lib/modules
              readOnly: true
          {{- with .Values.cubeEgress.netResources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
        {{- end }}
        {{- end }}
      volumes:
        - name: host-root
          hostPath:
            path: {{ .Values.hostPaths.root }}
            type: Directory
        - name: toolbox
          hostPath:
            path: {{ .Values.hostPaths.toolbox }}
            type: DirectoryOrCreate
        - name: dev
          hostPath:
            path: {{ .Values.hostPaths.dev }}
            type: Directory
        - name: sys
          hostPath:
            path: {{ .Values.hostPaths.sys }}
            type: Directory
        - name: lib-modules
          hostPath:
            path: {{ .Values.hostPaths.libModules }}
            type: Directory
        - name: data-cubelet
          hostPath:
            path: {{ .Values.hostPaths.dataCubelet }}
            type: DirectoryOrCreate
        - name: data-log
          hostPath:
            path: {{ .Values.hostPaths.dataLog }}
            type: DirectoryOrCreate
        - name: data-cube-shim
          hostPath:
            path: {{ .Values.hostPaths.dataCubeShim }}
            type: DirectoryOrCreate
        - name: data-snapshot-pack
          hostPath:
            path: {{ .Values.hostPaths.dataSnapshotPack }}
            type: DirectoryOrCreate
        - name: tmp-cube
          hostPath:
            path: {{ .Values.hostPaths.tmpCube }}
            type: DirectoryOrCreate
        - name: run-containerd
          hostPath:
            path: {{ .Values.hostPaths.runContainerd }}
            type: DirectoryOrCreate
        - name: run-vc
          hostPath:
            path: {{ .Values.hostPaths.runVc }}
            type: DirectoryOrCreate
      {{- if .Values.cubeEgress.enabled }}
        - name: cube-egress-ca
          secret:
            secretName: {{ include "cube.egressCASecretName" . }}
        - name: cube-egress-run
          emptyDir:
            medium: Memory
            sizeLimit: 64Mi
      {{- end }}
{{- end }}
