common:
  http_port: {{ .Values.controlPlane.master.service.port }}
  http_readtimeout: 120
  http_writetimeout: 360
  http_idletimeout: 360
  sync_meta_data_interval: 30s
  sync_metric_data_interval: 1s
  collect_metric_interval: 1s
  default_headless_service_nodes_num: 1
  enable_check_com_net_id_param: false
  # Template build wiring: a single boolean switch, mirroring
  # controlPlane.templateCenter.enabled. False serves every template path
  # locally; true forwards template-from-image builds to CubeTemplateCenter.
  #
  # CubeTemplateCenter's address is deliberately NOT here: it is a deployment
  # fact, so it is injected as the CUBE_TEMPLATE_CENTER_ADDR environment
  # variable on the CubeMaster Deployment (the counterpart of CUBE_MASTER_ADDR,
  # which TC uses to call back). Keeping it out of conf means changing the
  # address never requires editing this file.
  templatecenter_enabled: {{ include "cube.templateCenterEnabledConf" . }}

log:
  module: "cubemaster"
  path: "/data/log/CubeMaster"
  file_size: 100
  file_num: 10
  level: "info"

cubelet_conf:
  grpc:
    grpc_port: 9999
  common_timeout_insec: 30
  create_image_timeout_insec: 300
  create_concurrent_limit: 100
  destroy_concurent_limit: 100
  enable_exposed_port: true
  exposed_port_list:
    - "80"
  disable_redis_proxy_port: true

auth:
  enable: false

req_template_conf:
  whitelist_req_tag:
    WorkingDir: true
    RLimit: true
    DnsConfig: true
    HostAliases: true
    Poststop: true
    Prestop: true
  cube_box_req_template: >-
    {"volumes":[{"name":"tmp","volume_source":{"empty_dir":{"medium":0}}}],"containers":[{"name":"cubebox-default","envs":[{"key":"TZ","value":"Asia/Shanghai"},{"key":"TERM","value":"xterm"}],"volume_mounts":[{"name":"tmp","container_path":"/"}],"security_context":{"privileged":true,"readonly_rootfs":false,"no_new_privs":false}}],"network_type":"tap","cube_network_config":{"allowInternetAccess":true,"denyOut":["10.0.0.0/8","100.64.0.0/10","172.16.0.0/12","192.168.0.0/18"]}}

instance_db_config:
  driver: {{ include "cube.dbDriver" . | quote }}
  addr: {{ printf "%s:%v" (include "cube.dbHost" .) (include "cube.dbPort" .) | quote }}
  user: {{ include "cube.dbUser" . | quote }}
  pwd: {{ include "cube.dbPassword" . | quote }}
  db_name: {{ include "cube.dbName" . | quote }}
  conn_timeout: 5
  read_timeout: 5
  write_timeout: 5
  max_idle_conns: 5
  max_open_conns: 20
  max_conn_life_time_seconds: 300

redis:
  nodes: {{ include "cube.redisNodes" . | quote }}
  master_name: {{ .Values.redis.masterName | default "" | quote }}
  sentinel_nodes: {{ .Values.redis.sentinelNodes | default "" | quote }}
  sentinel_password: {{ .Values.redis.sentinelPassword | default "" | quote }}
  password: {{ .Values.redis.password | quote }}
  db_no: 0
  max_idle: 8
  max_active: 32
  idle_timeout: 30
  max_retry: 2

scheduler:
  priority_select_num: 1
  metric_update_timeout: 300s
  local_metric_update_timeout: 300s
  filter:
    enable_filters:
      - "cpu"
      - "mem"
      - "template_locality"
      - "realtime_create_num"

# Volume plugin (COS binary). Credentials: Secret-mounted volume-cos.conf
# next to the binary (see values.volumeCos).
volume_plugins:
  - name: cos
    type: binary
    binary_path: /usr/local/services/cubetoolbox/CubeMaster/plugin/cube-volume-cos
