openapi: "3.0.3"
info:
  title: cube-api
  description: |
    CubeSandbox REST API — E2B 兼容接口。
    对应服务进程：cube-api（默认监听 :3000）。

    数据流（run_code）不通过本 API，走 CubeProxy 转发到 sandbox 内的 envd：
      POST http://49999-{sandboxID}.cube.app/execute  (ndjson 流式)
  version: "1.0.0"

servers:
  - url: "http://localhost:3000"
    description: 本机部署（默认）
  - url: "http://{host}:3000"
    description: 远程部署
    variables:
      host:
        default: "9.135.79.34"

paths:
  /health:
    get:
      summary: 健康检查
      operationId: getHealth
      responses:
        "200":
          description: 服务正常
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthResponse"

  /sandboxes:
    get:
      summary: 列出所有运行中的 sandbox
      operationId: listSandboxes
      security:
        - ApiKeyAuth: []
      responses:
        "200":
          description: sandbox 列表
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/SandboxDetail"

    post:
      summary: 创建 sandbox
      operationId: createSandbox
      security:
        - ApiKeyAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateSandboxRequest"
            example:
              templateID: "tpl-6265796cee124256b4dcd6a1"
              timeout: 300
      responses:
        "200":
          description: 创建成功，返回 sandbox 基本信息
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SandboxCreated"
              example:
                templateID: "tpl-6265796cee124256b4dcd6a1"
                sandboxID: "cf4595ba8f094a9cbf72ab76fa19e435"
                clientID: "bdb40b5b-4777-488e-961a-68de8083ff41"
                envdVersion: "0.2.0"
                domain: "cube.app"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"

  /sandboxes/{sandboxID}:
    get:
      summary: 获取 sandbox 详情
      operationId: getSandbox
      security:
        - ApiKeyAuth: []
      parameters:
        - $ref: "#/components/parameters/sandboxID"
      responses:
        "200":
          description: sandbox 详情
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SandboxDetail"
        "404":
          $ref: "#/components/responses/NotFound"

    delete:
      summary: 销毁 sandbox
      operationId: deleteSandbox
      security:
        - ApiKeyAuth: []
      parameters:
        - $ref: "#/components/parameters/sandboxID"
      responses:
        "200":
          description: 销毁成功（空响应体）
        "404":
          $ref: "#/components/responses/NotFound"

  /sandboxes/{sandboxID}/pause:
    post:
      summary: 暂停 sandbox（保留内存快照）
      operationId: pauseSandbox
      security:
        - ApiKeyAuth: []
      parameters:
        - $ref: "#/components/parameters/sandboxID"
      responses:
        "200":
          description: 暂停成功
        "404":
          $ref: "#/components/responses/NotFound"

  /sandboxes/{sandboxID}/resume:
    post:
      summary: 恢复已暂停的 sandbox
      operationId: resumeSandbox
      security:
        - ApiKeyAuth: []
      parameters:
        - $ref: "#/components/parameters/sandboxID"
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                timeout:
                  type: integer
                  description: 恢复后的 TTL（秒）
                  default: 300
      responses:
        "200":
          description: 恢复成功
        "404":
          $ref: "#/components/responses/NotFound"

# ── envd 数据流 API（通过 CubeProxy 访问，不走 cube-api）─────────────────
# URL 格式：http://49999-{sandboxID}.cube.app/execute
# 当 CUBE_PROXY_NODE_IP 设置时，客户端直连 IP:80 + Host 头路由，无需 DNS

x-envd-api:
  execute:
    method: POST
    url: "http://49999-{sandboxID}.{domain}/execute"
    description: |
      在 sandbox 内执行代码，返回 ndjson 流式响应。
      每行为一个 JSON 对象，type 字段标识消息类型。
    requestBody:
      content:
        application/json:
          schema:
            type: object
            required: [code]
            properties:
              code:
                type: string
              context_id:
                type: string
                nullable: true
              language:
                type: string
                nullable: true
              env_vars:
                type: object
                additionalProperties:
                  type: string
                nullable: true
    response:
      description: ndjson 流，每行一个事件
      lines:
        - type: stdout
          schema: {type, text, timestamp}
        - type: stderr
          schema: {type, text, timestamp}
        - type: result
          schema: {type, text, is_main_result, html, markdown, png, svg, ...}
        - type: error
          schema: {type, name, value, traceback}
        - type: number_of_executions
          schema: {type, execution_count}

components:
  securitySchemes:
    ApiKeyAuth:
      type: apiKey
      in: header
      name: X-API-Key
      description: 本地部署填任意字符串即可

  parameters:
    sandboxID:
      name: sandboxID
      in: path
      required: true
      schema:
        type: string
      description: sandbox 唯一 ID，由 createSandbox 返回

  responses:
    NotFound:
      description: 资源不存在
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    InternalError:
      description: 服务内部错误
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"

  schemas:
    HealthResponse:
      type: object
      properties:
        status:
          type: string
          example: "ok"
        sandboxes:
          type: integer
          description: 当前运行的 sandbox 数量
          example: 1

    CreateSandboxRequest:
      type: object
      required: [templateID]
      properties:
        templateID:
          type: string
          description: 模板 ID（cubemastercli tpl create 得到）
          example: "tpl-6265796cee124256b4dcd6a1"
        timeout:
          type: integer
          description: sandbox TTL（秒），默认 300
          default: 300
        envVars:
          type: object
          additionalProperties:
            type: string
          description: 注入到 sandbox 的环境变量
        metadata:
          type: object
          additionalProperties:
            type: string
          description: 自定义元数据

    SandboxCreated:
      type: object
      properties:
        templateID:
          type: string
        sandboxID:
          type: string
          description: sandbox 唯一 ID
        clientID:
          type: string
          description: 创建者标识（UUID）
        envdVersion:
          type: string
          example: "0.2.0"
        domain:
          type: string
          description: sandbox 域名后缀
          example: "cube.app"

    SandboxDetail:
      type: object
      properties:
        templateID:
          type: string
        sandboxID:
          type: string
        clientID:
          type: string
        startedAt:
          type: string
          format: date-time
        endAt:
          type: string
          format: date-time
        envdVersion:
          type: string
        domain:
          type: string
        cpuCount:
          type: integer
        memoryMB:
          type: integer
        diskSizeMB:
          type: integer
        state:
          type: string
          enum: [running, paused, stopped]
        metadata:
          type: object
          additionalProperties:
            type: string

    ErrorResponse:
      type: object
      properties:
        code:
          type: integer
        message:
          type: string
