<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="560" viewBox="0 0 1120 560">
  <defs>
    <style>
      .font { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
      .title { font-size: 18px; font-weight: 700; fill: #0f172a; }
      .group { font-size: 14px; font-weight: 700; fill: #0f172a; }
      .box-title { font-size: 13px; font-weight: 700; }
      .box-text { font-size: 11px; }
      .edge { font-size: 11px; font-weight: 600; }
      .note { font-size: 12px; fill: #334155; }
    </style>
    <marker id="blue-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0 1 L10 5 L0 9 Z" fill="#2563eb"/>
    </marker>
    <marker id="amber-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0 1 L10 5 L0 9 Z" fill="#d97706"/>
    </marker>
    <marker id="purple-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0 1 L10 5 L0 9 Z" fill="#7c3aed"/>
    </marker>
  </defs>

  <rect width="1120" height="560" fill="#ffffff"/>
  <text x="32" y="38" class="font title">CubeSandbox sandbox-only observability</text>

  <rect x="32" y="64" width="650" height="350" rx="10" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.5"/>
  <text x="357" y="90" text-anchor="middle" class="font group">Sandbox compute node</text>

  <rect x="58" y="118" width="250" height="82" rx="8" fill="#dbeafe" stroke="#2563eb" stroke-width="1.5"/>
  <text x="183" y="148" text-anchor="middle" class="font box-title" fill="#1e3a8a">Cubelet sandbox metrics</text>
  <text x="183" y="170" text-anchor="middle" class="font box-text" fill="#1e40af">127.0.0.1:9998/v1/metrics/resource</text>
  <text x="183" y="187" text-anchor="middle" class="font box-text" fill="#1e40af">cubesandbox_* CPU / Memory / Count</text>

  <rect x="58" y="244" width="250" height="82" rx="8" fill="#fef3c7" stroke="#d97706" stroke-width="1.5"/>
  <text x="183" y="274" text-anchor="middle" class="font box-title" fill="#78350f">Sandbox stdout/stderr logs</text>
  <text x="183" y="296" text-anchor="middle" class="font box-text" fill="#92400e">/data/cubelet/log/&lt;sandbox-id&gt;/</text>
  <text x="183" y="313" text-anchor="middle" class="font box-text" fill="#92400e">stdout / stderr</text>

  <rect x="400" y="104" width="250" height="250" rx="10" fill="#ecfdf5" stroke="#10b981" stroke-width="1.5"/>
  <text x="525" y="132" text-anchor="middle" class="font group" fill="#065f46">OTel Collector Contrib</text>

  <rect x="422" y="154" width="206" height="64" rx="7" fill="#ffffff" stroke="#2563eb" stroke-width="1.3"/>
  <text x="525" y="180" text-anchor="middle" class="font box-title" fill="#1e3a8a">Metrics Pipeline</text>
  <text x="525" y="201" text-anchor="middle" class="font box-text" fill="#1e40af">prometheus receiver + batch</text>

  <rect x="422" y="240" width="206" height="64" rx="7" fill="#ffffff" stroke="#d97706" stroke-width="1.3"/>
  <text x="525" y="266" text-anchor="middle" class="font box-title" fill="#78350f">Logs Pipeline</text>
  <text x="525" y="287" text-anchor="middle" class="font box-text" fill="#92400e">filelog/sandbox + file_storage</text>

  <path d="M308 159 H365 V186 H422" fill="none" stroke="#2563eb" stroke-width="2" marker-end="url(#blue-arrow)"/>
  <text x="365" y="150" text-anchor="middle" class="font edge" fill="#1d4ed8">Pull</text>
  <path d="M308 285 H365 V272 H422" fill="none" stroke="#d97706" stroke-width="2" marker-end="url(#amber-arrow)"/>
  <text x="365" y="304" text-anchor="middle" class="font edge" fill="#b45309">Tail</text>

  <rect x="792" y="64" width="296" height="350" rx="10" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.5"/>
  <text x="940" y="90" text-anchor="middle" class="font group">Optional backends</text>

  <rect x="818" y="116" width="244" height="70" rx="8" fill="#fff1f2" stroke="#e11d48" stroke-width="1.5"/>
  <text x="940" y="144" text-anchor="middle" class="font box-title" fill="#881337">Prometheus :9092</text>
  <text x="940" y="166" text-anchor="middle" class="font box-text" fill="#9f1239">OTLP/HTTP or Remote Write</text>

  <rect x="818" y="220" width="244" height="70" rx="8" fill="#f0f9ff" stroke="#0284c7" stroke-width="1.5"/>
  <text x="940" y="248" text-anchor="middle" class="font box-title" fill="#0c4a6e">Loki :3100 (default)</text>
  <text x="940" y="270" text-anchor="middle" class="font box-text" fill="#075985">or Elasticsearch :9200</text>

  <rect x="818" y="324" width="244" height="62" rx="8" fill="#f5f3ff" stroke="#7c3aed" stroke-width="1.5"/>
  <text x="940" y="350" text-anchor="middle" class="font box-title" fill="#4c1d95">Grafana :3001</text>
  <text x="940" y="371" text-anchor="middle" class="font box-text" fill="#5b21b6">Sandbox resources + stdout/stderr logs</text>

  <path d="M628 186 H724 V151 H818" fill="none" stroke="#2563eb" stroke-width="2" marker-end="url(#blue-arrow)"/>
  <text x="724" y="139" text-anchor="middle" class="font edge" fill="#1d4ed8">Push metrics</text>
  <path d="M628 272 H724 V255 H818" fill="none" stroke="#d97706" stroke-width="2" marker-end="url(#amber-arrow)"/>
  <text x="724" y="295" text-anchor="middle" class="font edge" fill="#b45309">Push logs</text>
  <path d="M874 186 V324" fill="none" stroke="#7c3aed" stroke-width="1.5" marker-end="url(#purple-arrow)"/>
  <path d="M1006 290 V324" fill="none" stroke="#7c3aed" stroke-width="1.5" marker-end="url(#purple-arrow)"/>

  <rect x="32" y="442" width="1056" height="86" rx="9" fill="#fef2f2" stroke="#f87171" stroke-width="1.2"/>
  <text x="54" y="470" class="font box-title" fill="#991b1b">Explicitly excluded</text>
  <text x="54" y="495" class="font note">Node CPU / memory / disk / network; template and platform logs; systemd journal; standalone OCI Exec logs.</text>
  <text x="54" y="515" class="font note">Backends may run on a control node, but the collection plane sends sandbox telemetry only.</text>
</svg>
