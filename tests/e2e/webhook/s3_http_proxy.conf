# Dedicated P6 fixture only. Mount a NEW evidence directory at /evidence.
# Existing native S3 requests pass through; only export publication is faulted.
worker_processes 1;
error_log /dev/stderr notice;
pid /tmp/nginx.pid;
events { worker_connections 64; }
http {
    log_format evidence '$time_iso8601 $request_method $uri $status $upstream_status';
    access_log /evidence/access.log evidence;
    server {
        listen 127.0.0.1:19098;
        location / {
            access_by_lua_block {
                local file = assert(io.open('/evidence/mode', 'r'))
                local mode = file:read('*a'); file:close()
                if mode:match('hold%-manifest') and ngx.var.uri:match('/exports/[^/]+%.json$') then
                    local deadline = ngx.now() + 120
                    while mode:match('hold%-manifest') and ngx.now() < deadline do
                        ngx.sleep(0.1)
                        local current = assert(io.open('/evidence/mode', 'r'))
                        mode = current:read('*a'); current:close()
                    end
                    if mode:match('hold%-manifest') then return ngx.exit(503) end
                end
                if (mode:match('deny%-exports') and ngx.var.uri:match('/meta/exports%.json$')) or
                   (mode:match('deny%-manifest') and ngx.var.uri:match('/exports/[^/]+%.json$')) or
                   (mode:match('deny%-') and ngx.var.uri:match('/p6%-deny%-probe$')) then
                    ngx.status = 403; ngx.header.content_type = 'application/xml'
                    ngx.say('<Error><Code>AccessDenied</Code><Message>P6 dedicated export publication rejection</Message></Error>')
                    return ngx.exit(403)
                end
            }
            proxy_set_header Host $http_host;
            proxy_pass http://127.0.0.1:19096;
            proxy_request_buffering off;
        }
    }
}
