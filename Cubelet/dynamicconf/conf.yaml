common:
  enable_pf_mode: false
  sandbox_exec_cmd_time_out: 5s
  enable_sandbox_exec_cmd_before_exist: false
  sandbox_exec_cmd_before_exist_log_out: false
  sandbox_exec_cmd_before_exist:
   - sh 
   - "/usr/local/cubetools/cube_exec_cmd_before_exist.sh"
  cgroup_set_memory_reparent_file: ""
  disable_host_cgroup: true
  # Disable the legacy netfile.
  disable_host_netfile: true
  # Default DNS servers for guest containers.
  # When a template/request sets dns_config.servers, the whole guest DNS config
  # comes from the request (servers plus any request searches/options); defaults
  # for searches/options are not mixed in. With no request servers, empty
  # dns_config.searches / dns_config.options fall back to the defaults below.
  default_dns_servers:
    - 119.29.29.29
  # Default search domains / options for guest resolv.conf (e.g. followNodeDns).
  default_dns_searches: []
  default_dns_options: []

host:
  scheduler_label: "default-cluster"
  quota:
    mcpu_limit: 0
    mem_limit: ""
    mvm_limit: 0
    creation_concurrent_num: 0
    # Fraction of a paused sandbox's CPU/memory quota to release back to the
    # scheduler, in [0,1], applied symmetrically to CPU and memory. A paused
    # sandbox is snapshotted to disk with its MicroVM shut down, so the quota is
    # physically free; this ratio trades density against resume headroom:
    #   0.0 (default) release nothing -- paused keeps full quota, resume
    #                 guaranteed (legacy behaviour, safe zero-value default).
    #   1.0           release everything -- max density, resume best-effort and
    #                 rejected when the node can no longer fit the sandbox.
    #   0 < r < 1     release r, reserve (1-r) as headroom; the reserved quota
    #                 still shows up in QuotaCpuUsage/QuotaMemUsage, so
    #                 pause-heavy nodes are deprioritised by the cpu/mem scoring
    #                 factors.
    paused_resource_release_ratio: 0.0
  gc:
    code_expiration_time: "72h"
    image_expiration_time: "24h"

meta_server_config:
  # Endpoints are injected by the installer (one-click / prepare-compute-role)
  # or helm at deploy time. Defaults live in pkg/config/config.go (single-node).
  meta_server_endpoint: ""
  cubemaster_http_addr: ""
  node_status_max_images: 40000
