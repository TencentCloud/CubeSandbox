[package]
name = "cube-envd"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
description = "CubeSandbox-maintained in-guest data-plane daemon, E2B envd protocol compatible"
repository = "https://github.com/TencentCloud/CubeSandbox"

[dependencies]
tokio = { version = "1", features = ["full"] }
axum = { version = "0.7" }
# Used to serve the accepted connections ourselves: `axum::serve` has no
# hook between accept and serve, and the socket needs TCP_NODELAY set.
hyper = { version = "1", features = ["server", "http1"] }
hyper-util = { version = "0.1", features = ["tokio"] }
tower = { version = "0.5", features = ["util"] }
multer = "3"
# Content-Disposition is parsed with `mime` (already in the tree via multer) so
# parameter names match case-insensitively, the way Go's mime.ParseMediaType does.
mime = "0.3"
tower-http = { version = "0.5", features = ["catch-panic"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "0.22"
bytes = "1"
futures = "0.3"
tokio-stream = "0.1"
libc = "0.2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
time = { version = "0.3.55", default-features = false, features = ["parsing", "formatting"] }

[dev-dependencies]
tempfile = "3"

[profile.release]
lto = true
codegen-units = 1
strip = true
