[package]
name = "cube-envd"
version = "0.1.0"
edition = "2021"
build = "build.rs"

[lib]
name = "cube_envd"
path = "src/lib.rs"

[[bin]]
name = "cube-envd"
path = "src/main.rs"

[dependencies]
axum = { version = "0.8", features = ["multipart"] }
base64 = "0.22"
bytes = "1"
clap = { version = "4", features = ["derive"] }
futures-util = "0.3"
http = "1"
http-body-util = "0.1"
libc = "0.2"
multer = "3"
nix = { version = "0.30", features = ["fs", "process", "signal", "term", "user"] }
notify = "8.2"
prost = "0.14"
portable-pty = "0.9"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_urlencoded = "0.7"
thiserror = "2"
tokio = { version = "1", features = ["fs", "io-util", "macros", "net", "process", "rt-multi-thread", "signal", "sync", "time"] }
tokio-stream = { version = "0.1", features = ["sync"] }
tokio-util = { version = "0.7", features = ["io"] }
tower = "0.5"
tower-http = { version = "0.6", features = ["limit", "trace"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt", "json"] }
pbjson = "0.9"
pbjson-types = "0.9"

[build-dependencies]
pbjson-build = "0.9"
prost-build = "0.14"
protoc-bin-vendored = "3"

[dev-dependencies]
tempfile = "3"
tower = { version = "0.5", features = ["util"] }
